<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ============================================================
   DESIGN TOKENS — Premium Light Aesthetic
   ============================================================ */
:root {
  /* Surfaces — cool micro-blue gradient */
  --bg: #F8FAFC;
  --bg-gradient: linear-gradient(175deg, #F8FAFC 0%, #EEF2F6 40%, #E8EDF3 100%);
  --surface: #ffffff;
  --surface-glass: rgba(255,255,255,0.72);
  --surface-hover: rgba(255,255,255,0.94); /* [v2-优化项-1] */
  --surface-active: #f1f5f9;

  /* Text — slate ink ladder */
  --text: #0f172a;
  --text2: #475569;
  --text3: #94a3b8;

  /* Brand — refined blue */
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-subtle: rgba(37,99,235,0.07);
  --accent-ring: rgba(37,99,235,0.15); /* [v2-优化项-1] */

  /* Semantic */
  --success: #16A34A;
  --success-subtle: rgba(22,163,74,0.08);
  --warn: #D97706;
  --warn-subtle: rgba(217,119,6,0.07);
  --danger: #DC2626;
  --danger-subtle: rgba(220,38,38,0.07);

  /* Vendor */
  --nvidia: #16A34A;
  --nvidia-subtle: rgba(22,163,74,0.09);
  --china: #DC2626;
  --china-subtle: rgba(220,38,38,0.07);
  --amd: #EA580C;
  --amd-subtle: rgba(234,88,12,0.08);
  --intel: #6366F1;
  --intel-subtle: rgba(99,102,241,0.08);
  --other: #8B5CF6;
  --other-subtle: rgba(139,92,246,0.08);
  --blue-200: #93C5FD;

  /* Borders — ultra-fine hairlines */
  --border: #E2E8F0;
  --hairline: rgba(15,23,42,0.05);
  --hairline-strong: rgba(15,23,42,0.10);
  --hairline-cool: rgba(15,23,42,0.04);
  --hairline-cool-3: rgba(15,23,42,0.08);

  /* Canvas */
  --on-primary: #ffffff; /* [v2-优化项-1] */

  /* Shadows — softer, more dimensional */
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.03);
  --shadow-md: 0 2px 8px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
  --shadow-lg: 0 8px 24px rgba(15,23,42,0.05), 0 2px 6px rgba(15,23,42,0.03);
  --shadow-xl: 0 16px 40px rgba(15,23,42,0.06), 0 4px 12px rgba(15,23,42,0.03);
  --shadow-glow-blue: 0 4px 20px rgba(37,99,235,0.10);

  /* Radius */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space: 12px;
  --space-md: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Typography */
  --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Code', 'Consolas', 'SF Mono', Menlo, monospace;

  --text-2xs: 10px;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 32px;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 120ms;
  --dur-normal: 200ms;
  --dur-slow: 350ms;

  /* Navbar height */
  --nav-h: 56px;

  /* Sticky header glow */
  --sticky-shadow: 0 1px 0 rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.03); /* [v2-优化项-1] */
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-normal: 0ms;
    --dur-slow: 0ms;
  }
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-body);
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-weight: 400;
  font-size: var(--text-md);
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(148,163,184,0.35);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(148,163,184,0.55);
}

::selection {
  background: rgba(59,130,246,0.16);
  color: #334155;
}

/* ============================================================
   KEYFRAMES
   ============================================================ */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUpModal {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes shake {
  0%,
  100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes pulse-dot {
  0%,
  100% { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.20); }
  50% { box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.06); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes skeleton-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes spin-reverse {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}

@keyframes loader-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(37,99,235,0.08), 0 0 60px rgba(37,99,235,0.04); }
  50% { box-shadow: 0 0 40px rgba(37,99,235,0.18), 0 0 100px rgba(37,99,235,0.08); }
}

@keyframes loader-dot {
  0%, 20% { opacity: 0; }
  50% { opacity: 1; }
  100% { opacity: 0; }
}

/* ============================================================
   LOADING OVERLAY
   ============================================================ */
#loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  background: radial-gradient(ellipse at 50% 50%, rgba(248,250,252,0.3) 0%, rgba(241,245,249,0.78) 100%);
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
  opacity: 1;
  visibility: visible;
}

#loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#loading-overlay .loader-brand {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
  margin-bottom: 32px;
}

#loading-overlay .loader-brand .accent {
  color: var(--accent);
}

#loading-overlay .loader-spinner-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#loading-overlay .loader-outer {
  position: absolute;
  width: 72px;
  height: 72px;
  border: 2.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite, loader-pulse 2s ease-in-out infinite;
}

#loading-overlay .loader-inner {
  width: 40px;
  height: 40px;
  border: 2.5px solid rgba(37,99,235,0.12);
  border-top-color: rgba(37,99,235,0.45);
  border-radius: 50%;
  animation: spin-reverse 1.1s linear infinite;
}

#loading-overlay .loader-text {
  margin-top: 28px;
  font-size: 15px;
  color: var(--text2);
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 2px;
}

#loading-overlay .loader-text .dot {
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  animation: loader-dot 1.4s ease-in-out infinite;
}

#loading-overlay .loader-text .dot:nth-child(2) { animation-delay: 0.2s; }
#loading-overlay .loader-text .dot:nth-child(3) { animation-delay: 0.4s; }

/* ============================================================
   ICONS
   ============================================================ */
.icon {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex-shrink: 0;
  vertical-align: -0.125em;
}

.icon-xs { width: 12px; height: 12px; }
.icon-sm { width: 14px; height: 14px; }
.icon-md { width: 18px; height: 18px; }
.icon-lg { width: 22px; height: 22px; }

/* ============================================================
   FOCUS RING — unified
   ============================================================ */
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
  border-color: var(--accent);
}

/* ============================================================
   BUTTONS — Supabase: 6px radius, blue CTA with white text
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--hairline-cool-3);
  background: var(--surface);
  color: var(--text);
  white-space: nowrap;
  font-family: inherit;
  letter-spacing: 0;
  user-select: none;
  line-height: 1;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

.btn:hover {
  background: var(--surface-hover);
  border-color: var(--hairline-strong);
  transform: translateY(-0.5px);
  box-shadow: var(--shadow-sm);
}

.btn:active { transform: translateY(0); opacity: 0.88; }

/* Primary — blue */
.btn-primary {
  background: var(--accent);
  color: var(--on-primary);
  border-color: transparent;
  box-shadow: 0 1px 2px rgba(59,130,246,0.20);
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(59,130,246,0.28);
}

.btn-primary:active { transform: translateY(0); opacity: 0.9; }

/* Outline */
.btn-outline {
  background: transparent;
  border-color: var(--border);
}

.btn-outline:hover {
  background: var(--accent-subtle);
  border-color: var(--accent);
  color: var(--text);
  transform: translateY(-0.5px);
  box-shadow: 0 2px 8px rgba(59,130,246,0.10);
}

/* Danger */
.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: #fecaca;
}

.btn-danger:hover {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  transform: translateY(-0.5px);
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
}

/* Sizes */
.btn-sm {
  padding: 5px 12px;
  font-size: var(--text-xs);
}

.btn-cmp-only {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 500;
  color: var(--blue-200);
  background: rgba(255,255,255,0.70);
  border: 1px solid rgba(59,130,246,0.18);
  border-radius: 6px;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
}
.btn-cmp-only:hover {
  background: rgba(59,130,246,0.10);
  border-color: rgba(59,130,246,0.30);
  color: #2563EB;
  box-shadow: 0 2px 8px rgba(59,130,246,0.12);
}
.btn-cmp-only:active {
  transform: scale(0.96);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  justify-content: center;
}

/* Ghost */
.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text2);
}

.btn-ghost:hover {
  background: var(--surface-active);
  color: var(--text);
  transform: none;
  box-shadow: none;
}

/* ============================================================
   FORM ELEMENTS — Supabase: 6px radius, hairline borders
   ============================================================ */
.field-label {
  font-size: var(--text-xs);
  color: var(--text2);
  font-weight: 500;
  display: block;
  margin-bottom: var(--space-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* 共享基础样式 */ /* [v2-优化项-2] */
.field-input,
.field-textarea,
.field-select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

/* 各自独有属性 */ /* [v2-优化项-2] */
.field-input {
  transition: border-color var(--dur-fast) var(--ease-out);
}

.field-textarea {
  min-height: 64px;
  resize: vertical;
  line-height: 1.5;
  transition: border-color var(--dur-fast) var(--ease-out);
}

.field-select {
  cursor: pointer;
}

.field-input:focus,
.field-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.field-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

/* ============================================================
   LAYOUT
   ============================================================ */
.app {
  display: flex;
  height: calc(100vh - var(--nav-h) - 46px);
}

/* ============================================================
   NAVBAR — frosted glass
   ============================================================ */
.navbar {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  border-bottom: 1px solid var(--hairline);
  padding: 0 20px;
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: nowrap;
}

.navbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  letter-spacing: -0.01em;
}

.navbar .brand .brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #2563EB, #1D4ED8);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--on-primary);
  box-shadow: 0 2px 8px rgba(37,99,235,0.18);
}

.nav-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.nav-actions .btn { height: 32px; font-size: 12px; padding: 0 10px; background: rgba(255,255,255,0.60); border: 1px solid rgba(148,163,184,0.22); color: var(--text2); }

/* Search */
.search-wrap { position: relative; display: flex; align-items: center; }

.search-wrap .search-icon {
  position: absolute;
  left: 10px;
  color: var(--text3);
  pointer-events: none;
  display: flex;
}

.search-wrap input {
  background: rgba(248,250,252,0.78);
  border: 1px solid rgba(148,163,184,0.22);
  color: #334155;
  padding: 0 10px 0 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  width: 180px;
  outline: none;
  transition: all var(--dur-normal) var(--ease-out);
  font-family: inherit;
}

.search-wrap input:hover { border-color: rgba(59,130,246,0.25); }

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
  background: #ffffff;
  width: 240px;
}

.search-wrap input::placeholder { color: var(--text3); }

/* Live badge */
.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 10px;
  height: 32px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  background: rgba(34,197,94,0.10);
  color: #16A34A;
  border: 1px solid rgba(34,197,94,0.18);
  flex-shrink: 0;
}

.live-badge.offline { background: var(--warn-subtle); color: var(--warn); border-color: #fde68a; }

.live-badge .live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  animation: pulse-dot 2s ease-in-out infinite;
}

.live-badge.offline .live-dot { background: var(--warn); animation: none; }

/* Hamburger */
.hamburger {
  display: none;
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background var(--dur-fast) var(--ease-out);
}

.hamburger:hover { background: var(--surface-active); }

.hamburger span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all var(--dur-normal) var(--ease-in-out);
}

.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* Sidebar overlay */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 23, 0.30);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 150;
  display: none;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.sidebar-overlay.show { display: block; }

/* ============================================================
   COMPARISON BAR
   ============================================================ */
.cmp-bar {
  background: rgba(248,250,252,0.72);
  border-bottom: 1px solid rgba(148,163,184,0.14);
  padding: 6px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  flex-wrap: wrap;
}

.cmp-bar .cmp-label {
  font-size: var(--text-sm);
  color: var(--text2);
  font-weight: 500;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

.cmp-tag {
  background: var(--accent-subtle);
  border: 1px solid rgba(59,130,246,0.15);
  border-radius: var(--radius-sm);
  padding: 4px 12px;
  font-size: var(--text-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
  font-weight: 500;
  animation: fadeIn var(--dur-normal) var(--ease-out);
  transition: border-color var(--dur-fast) var(--ease-out);
}

.cmp-tag:hover { border-color: var(--accent); }

.cmp-tag .remove {
  cursor: pointer;
  color: var(--text3);
  font-size: 15px;
  line-height: 1;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all var(--dur-fast) var(--ease-out);
}

.cmp-tag .remove:hover { background: var(--danger); color: #fff; }

/* Power type toggle in header */
.th-label-power {
  cursor: pointer;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.th-label-power:hover { color: var(--accent); }
.th-label-power .pt-arrow { font-size: 8px; opacity: 0.5; transition: opacity var(--dur-fast); }
.th-label-power:hover .pt-arrow { opacity: 1; }

.power-type-dropdown {
  position: fixed;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid rgba(148,163,184,0.18);
  border-radius: var(--radius-md);
  min-width: 100px;
  box-shadow: var(--shadow-lg);
  z-index: 300;
  padding: 4px;
  display: none;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}
.power-type-dropdown.show { display: block; }

.pt-option {
  display: block;
  width: 100%;
  padding: 6px 14px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: var(--text-sm);
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  border-radius: var(--radius-xs);
  transition: all var(--dur-fast) var(--ease-out);
  font-weight: 500;
}
.pt-option:hover { background: var(--accent-subtle); color: var(--accent); }
.pt-option.active { background: var(--accent); color: var(--on-primary); }

/* ============================================================
   SIDEBAR — frosted glass
   ============================================================ */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: rgba(255,255,255,0.66);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border-right: 1px solid rgba(148,163,184,0.16);
  overflow-y: auto;
  flex-shrink: 0;
  padding: var(--space-sm) 0;
  padding-top: env(safe-area-inset-top, var(--space-sm));
}

.sidebar .side-section { margin-bottom: var(--space); }

.sidebar .side-header {
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 700;
  color: #0f172a;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  border-radius: var(--radius-sm);
  margin: 0 6px;
  transition: background 0.15s;
  height: 36px;
  position: relative;
}
/* Subtle left accent bar */
.sidebar .side-header::before {
  content: '';
  width: 3px;
  height: 18px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}
.sidebar .side-header:hover { background: var(--surface-active); }

.sidebar .side-header .side-chevron {
  margin-left: auto;
  font-size: 10px;
  color: var(--text3);
  transition: transform 0.2s;
  opacity: 0.6;
}
.sidebar .side-header:hover .side-chevron { opacity: 1; }
.sidebar .side-header.collapsed .side-chevron { transform: rotate(-90deg); }

.sidebar .side-header .side-count {
  background: rgba(59,130,246,0.10);
  color: #2563EB;
  padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
}
.sidebar .side-body { overflow: hidden; transition: max-height 0.25s ease; }
.sidebar .side-body.collapsed { max-height: 0 !important; }

.sidebar .side-region {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  padding: 10px 16px 4px;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sidebar .side-region:first-of-type { padding-top: 4px; }
.sidebar .side-region-count {
  font-weight: 400;
  font-size: 10px;
  color: var(--text3);
  background: rgba(148,163,184,0.12);
  padding: 1px 7px;
  border-radius: var(--radius-full);
}
.sidebar .side-brand {
  font-size: 11px;
  font-weight: 600;
  color: #94a3b8;
  padding: 8px 20px 2px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.sidebar .gpu-item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 0 12px 0 22px;
  height: 32px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 400;
  border-left: 2px solid transparent;
  transition: all var(--dur-fast) var(--ease-out);
  margin: 1px 6px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: #475569;
}

.sidebar .gpu-item:hover { background: rgba(59,130,246,0.06); color: #2563EB; }

.sidebar .gpu-item.active {
  border-left-color: var(--accent);
  background: rgba(59,130,246,0.08);
  color: #2563EB;
  font-weight: 500;
}

.sidebar .gpu-item .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.dot.nvidia { background: var(--nvidia); box-shadow: 0 0 0 2px var(--nvidia-subtle); }
.dot.china { background: var(--china); box-shadow: 0 0 0 2px var(--china-subtle); }
.dot.amd { background: var(--amd); box-shadow: 0 0 0 2px var(--amd-subtle); }
.dot.intel { background: var(--intel); box-shadow: 0 0 0 2px var(--intel-subtle); }
.dot.other { background: var(--other); box-shadow: 0 0 0 2px var(--other-subtle); }

.sidebar .gpu-item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar .gpu-item .cmp-toggle {
  margin-left: auto;
  font-size: 15px;
  color: var(--blue-200);
  cursor: pointer;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-xs);
  font-weight: 500;
  transition: all var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}

.sidebar .gpu-item .cmp-toggle:hover { background: var(--accent); color: var(--on-primary); }
.sidebar .gpu-item .cmp-toggle.active { color: var(--accent); font-weight: 600; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 20px; min-width: 0; }

/* Column filter */
.col-filter-wrap { display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }

.col-filter-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  border-radius: var(--radius-xs);
  transition: all var(--dur-fast) var(--ease-out);
  padding: 0;
  flex-shrink: 0;
  position: relative;
}
.col-filter-btn:hover { color: var(--accent); background: rgba(59,130,246,0.08); }
.col-filter-btn.active { color: var(--accent); background: var(--accent-subtle); }

.col-filter-btn.active::after {
  content: '';
  position: absolute;
  top: 2px;
  right: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.col-filter-dropdown {
  position: fixed;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid rgba(148,163,184,0.18);
  border-radius: var(--radius-md);
  min-width: 190px;
  max-width: 280px;
  box-shadow: var(--shadow-lg);
  z-index: 300;
  padding: var(--space-sm);
  display: none;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown.show { display: block; }

.col-filter-dropdown .filter-input {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

.col-filter-dropdown .filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  max-height: 160px;
  overflow-y: auto;
}

.col-filter-chip {
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  white-space: nowrap;
  font-family: inherit;
  transition: all var(--dur-fast) var(--ease-out);
}
.col-filter-chip:hover { border-color: var(--accent); color: var(--text); background: var(--accent-subtle); }
.col-filter-chip.selected { background: var(--accent); color: var(--on-primary); border-color: var(--accent); box-shadow: 0 2px 6px rgba(59,130,246,0.18); }

.col-filter-dropdown .filter-range {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
}
.col-filter-dropdown .filter-range input {
  width: 62px;
  padding: 5px 6px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  text-align: center;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-range input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
.col-filter-dropdown .filter-range span { color: var(--text3); flex-shrink: 0; }

.col-filter-dropdown .filter-actions {
  display: flex;
  gap: 6px;
  margin-top: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--hairline-cool);
}
.col-filter-dropdown .filter-actions button {
  flex: 1;
  padding: 5px 0;
  border-radius: var(--radius-xs);
  font-size: var(--text-xs);
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  transition: all var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-actions button:hover { background: var(--surface-hover); }
.col-filter-dropdown .filter-actions button.apply-btn { background: var(--accent); color: var(--on-primary); border-color: var(--accent); }
.col-filter-dropdown .filter-actions button.apply-btn:hover { background: var(--accent-hover); }

@media (max-width: 768px) {
  .col-filter-dropdown {
    position: fixed;
    top: auto !important;
    bottom: 0;
    left: 0 !important;
    right: 0;
    max-width: 100%;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    animation: slideUp var(--dur-md) var(--ease-out);
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }
}

.result-count { display: block; font-size: 12px; color: #94A3B8; font-weight: 400; margin-bottom: var(--space-sm); min-height: 16px; }

/* ============================================================
   DATA TABLE — Premium glass, sticky header with glow
   ============================================================ */
.table-wrap {
  overflow-x: hidden;
  overflow-y: visible;
  scrollbar-gutter: stable;
  border-radius: var(--radius-xl);
  background: var(--surface-glass);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-lg);
}

table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 13px; }

/* ==== TABLE CELLS ==== */
thead th,
tbody td {
  padding: 0 8px;
  min-height: 52px;
  text-align: center;
  vertical-align: middle;
  box-sizing: border-box;
  overflow: hidden;
}

thead tr,
tbody tr {
  height: 52px;
}

/* ==== THEAD — sticky with ambient glow ==== */
thead {
  position: sticky;
  top: 0;
  z-index: 2;
}
thead th {
  font-weight: 600;
  font-size: 13px;
  color: #334155;
  background: rgba(248,250,252,0.96);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--hairline-strong);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  z-index: 2;
}

/* Dynamic shadow when page is scrolled (header is sticking) */
.main.scrolled thead th {
  box-shadow: var(--sticky-shadow);
}

/* ==== THEAD inner wrappers ==== */
thead th .col-filter-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 52px;
  width: 100%;
  overflow: hidden;
  position: relative;
}

thead th .sort-arrow {
  font-size: 9px;
  opacity: 0.35;
  line-height: 1;
  flex-shrink: 0;
}

thead th .col-filter-btn {
  flex-shrink: 0;
}

thead th.filtered {
  color: var(--accent);
  background: var(--accent-subtle);
}

thead th .th-label { transition: color var(--dur-fast) var(--ease-out); }
thead th .th-label[data-action="sort-table"] { cursor: pointer; user-select: none; }
thead th .th-label[data-action="sort-table"]:hover { color: var(--accent); }
thead th .th-label.filtered { color: var(--accent); }
thead th .th-label.sorted { color: var(--accent); font-weight: 600; }
thead th .sort-arrow.active { opacity: 0.7; color: var(--accent); }

/* ==== TBODY ==== */
tbody td {
  border-bottom: 1px solid var(--hairline-cool);
  white-space: nowrap;
  font-size: 12px;
  color: var(--text2);
  text-overflow: ellipsis;
}

tbody td:first-child {
  white-space: pre-line;
  overflow: visible;
  text-overflow: clip;
}

tbody tr { transition: background var(--dur-fast) var(--ease-out); }
tbody tr:nth-child(even) { background: rgba(248,250,252,0.45); }
tbody tr:hover { background: rgba(37,99,235,0.04); }
tbody tr.selected { background: rgba(37,99,235,0.06); }

.gpu-name {
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  line-height: 1.4;
  white-space: pre-line;
  overflow: visible;
}

.gpu-name:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 3px; }

.td-fp16 {
  color: #475569;
  font-size: 10px;
  font-family: var(--font-mono);
  line-height: 1.5;
  white-space: pre-line !important;
  text-align: center !important;
  overflow: hidden;
  padding: 4px 6px !important;
  word-break: break-all;
  height: auto !important;
  min-height: auto !important;
  max-height: none !important;
}

.td-fp16-inner {
  line-height: 1.5;
  text-align: center;
}

.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-xs);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0;
  white-space: nowrap;
}

.tag-nvidia { background: var(--nvidia-subtle); color: var(--nvidia); border: 1px solid rgba(22,163,74,0.16); }
.tag-china { background: var(--china-subtle); color: var(--china); border: 1px solid rgba(220,38,38,0.16); }
.tag-amd { background: var(--amd-subtle); color: var(--amd); border: 1px solid rgba(234,88,12,0.16); }
.tag-intel { background: var(--intel-subtle); color: var(--intel); border: 1px solid rgba(99,102,241,0.16); }
.tag-other { background: var(--other-subtle); color: var(--other); border: 1px solid rgba(139,92,246,0.16); }

/* ============================================================
   SKELETON SCREEN — shimmer loading
   ============================================================ */
.skeleton-table {
  pointer-events: none;
  opacity: 0.6;
}

.skeleton-row {
  animation: skeleton-pulse 1.6s ease-in-out infinite;
}

.skeleton-cell {
  height: 16px;
  border-radius: var(--radius-xs);
  background: linear-gradient(
    90deg,
    rgba(148,163,184,0.08) 0%,
    rgba(148,163,184,0.18) 40%,
    rgba(148,163,184,0.08) 80%
  );
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}

.skeleton-row:nth-child(odd) .skeleton-cell {
  animation-delay: 0s;
}

.skeleton-row:nth-child(even) .skeleton-cell {
  animation-delay: 0.15s;
}

/* Loading overlay fade */
.table-loading {
  position: relative;
}

.table-loading::after {
  content: '';
  position: absolute;
  inset: 0;
  background: transparent;
  pointer-events: none;
  z-index: 5;
}

.empty-state { text-align: center; padding: 56px 20px; color: #94A3B8; }

.empty-state .empty-icon { font-size: 36px; margin-bottom: var(--space-sm); opacity: 0.2; }

/* ============================================================
   GPU CARDS (Mobile) — Supabase card styling
   ============================================================ */
.card-grid { display: none; gap: var(--space); }

.gpu-card {
  background: rgba(255,255,255,0.60);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: var(--space-2xl);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  cursor: pointer;
}

.gpu-card:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--hairline-strong);
  background: rgba(255,255,255,0.78);
}

.gpu-card:active { background: rgba(255,255,255,0.90); }

.gpu-card .card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space);
}

.gpu-card .card-name { font-weight: 500; font-size: var(--text-md); color: var(--text); letter-spacing: -0.01em; }

.gpu-card .card-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: var(--text-sm);
  color: var(--text2);
}

.gpu-card .card-meta span {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid var(--hairline-cool);
}

.gpu-card .card-meta span:last-child { border-bottom: none; }

.gpu-card .card-meta strong {
  color: var(--text3);
  font-weight: 500;
  font-size: var(--text-2xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.gpu-card .card-meta span > :last-child { color: var(--text); font-weight: 500; text-align: right; }

.gpu-card .card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-sm);
  margin-top: var(--space);
}

.gpu-card .card-actions .btn { text-align: center; justify-content: center; }

/* ============================================================
   COMPARISON PANEL
   ============================================================ */
.cmp-panel {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  margin-top: var(--space-2xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.cmp-panel-header {
  padding: var(--space-xl) var(--space-2xl);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
}

.cmp-panel-header h3 {
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.42px;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.cmp-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.cmp-row { display: grid; border-bottom: 1px solid var(--hairline-cool); }

.cmp-row:last-child { border-bottom: none; }

.cmp-cell {
  padding: 10px 14px;
  font-size: var(--text-sm);
  border-right: 1px solid var(--hairline-cool);
  min-width: 140px;
}

.cmp-cell:last-child { border-right: none; }

.cmp-cell.header {
  background: var(--bg);
  font-weight: 500;
  font-size: var(--text-xs);
  color: var(--text2);
  letter-spacing: 0.04em;
}

.cmp-cell.best { background: var(--success-subtle); position: relative; }

.cmp-cell.best::after {
  content: '●';
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 8px;
  color: var(--success);
}

.config-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  font-size: var(--text-sm);
  padding: var(--space-md) var(--space-2xl);
  background: var(--bg);
  border-bottom: 1px solid var(--hairline);
}

.config-row label { display: flex; align-items: center; gap: 6px; color: var(--text2); font-weight: 500; }

.config-row input[type="number"] {
  width: 56px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--text);
  padding: 6px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: var(--text-sm);
  font-family: inherit;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.config-row input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   SETUP BANNER
   ============================================================ */
.setup-banner {
  padding: 10px var(--space-xl);
  background: var(--warn-subtle);
  color: #92400e;
  text-align: center;
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  border-bottom: 1px solid #fde68a;
  display: none;
  letter-spacing: 0;
  transition: background var(--dur-fast) var(--ease-out);
}

.setup-banner.show { display: block; }
.setup-banner:hover { background: #fef7e6; }

/* ============================================================
   MODAL — Supabase elevation level 3
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 23, 0.50);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.modal {
  background: rgba(255,255,255,0.86);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  width: 720px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: modalIn var(--dur-slow) var(--ease-out);
}

.modal-header {
  padding: var(--space-xl) var(--space-2xl);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.86);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 1;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}

.modal-header h2 {
  font-size: var(--text-xl);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-weight: 500;
  letter-spacing: -0.42px;
}

.modal-close {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--dur-fast) var(--ease-out);
  font-size: 16px;
}

.modal-close:hover { background: var(--danger-subtle); color: var(--danger); border-color: var(--danger); }

.modal-body { padding: var(--space-2xl); }

/* Detail sections */
.detail-section { margin-bottom: var(--space-xl); }
.detail-section:last-child { margin-bottom: 0; }

.detail-section-title {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: var(--space);
  padding-bottom: var(--space-sm);
  border-bottom: 1px solid var(--hairline);
}

/* Spec grid */
.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space); }

.spec-item {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  border: 1px solid var(--hairline-cool);
  transition: border-color var(--dur-fast) var(--ease-out);
}

.spec-item:hover { border-color: var(--hairline-strong); }
.spec-item.full { grid-column: 1 / -1; }

.spec-item label {
  font-size: var(--text-2xs);
  color: var(--text3);
  display: block;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
}

.spec-item .value { font-size: var(--text-md); font-weight: 500; color: var(--text); letter-spacing: -0.01em; }

.spec-item input,
.spec-item textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-family: inherit;
  margin-top: 4px;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.spec-item textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.spec-item input:focus,
.spec-item textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.spec-item select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-family: inherit;
  margin-top: 4px;
  cursor: pointer;
  outline: none;
}

.spec-item select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   PASSWORD MODAL
   ============================================================ */
.pw-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 23, 0.50);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.pw-dialog {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  width: 380px;
  max-width: 92vw;
  padding: var(--space-2xl);
  text-align: center;
  box-shadow: var(--shadow-xl);
  animation: modalIn var(--dur-slow) var(--ease-out);
}

.pw-dialog .pw-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto var(--space-md);
  background: var(--accent-subtle);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.pw-dialog h3 { font-size: var(--text-xl); font-weight: 500; margin-bottom: var(--space-sm); letter-spacing: -0.42px; }

.pw-dialog p { font-size: var(--text-sm); color: var(--text2); margin-bottom: var(--space-md); line-height: 1.6; }

.pw-dialog input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
  text-align: center;
  font-family: inherit;
  letter-spacing: 0.2em;
  font-weight: 400;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.pw-dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.pw-dialog .pw-error {
  color: var(--danger);
  font-size: var(--text-sm);
  margin-top: var(--space-sm);
  display: none;
}

.pw-dialog .pw-error.show { display: block; animation: shake 0.4s var(--ease-out); }

.pw-dialog .btn { margin-top: var(--space-md); width: 100%; padding: 10px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 300;
  background: var(--text);
  color: #fff;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: slideUp var(--dur-slow) var(--ease-out);
  letter-spacing: 0;
}

/* ============================================================
   DROPDOWN
   ============================================================ */
.dropdown { position: relative; display: inline-block; }

.dropdown-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  min-width: 170px;
  z-index: 50;
  display: none;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}

.dropdown-menu.show { display: block; }

.dropdown-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 14px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: var(--text-sm);
  cursor: pointer;
  font-family: inherit;
  transition: background var(--dur-fast) var(--ease-out);
}

.dropdown-menu button:hover { background: var(--surface-hover); }

/* ============================================================
   SCROLL TO TOP
   ============================================================ */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 72px;
  z-index: 50;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text2);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  transition: all var(--dur-fast) var(--ease-out);
}

.scroll-top.show { display: flex; }

.scroll-top:hover { background: var(--accent); color: var(--on-primary); border-color: var(--accent); box-shadow: var(--shadow-lg); }

/* ============================================================
   EDIT INDICATOR
   ============================================================ */
.edit-indicator {
  position: fixed;
  top: 70px;
  right: 16px;
  z-index: 150;
  background: var(--warn);
  color: #fff;
  padding: 5px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
  display: none;
  box-shadow: var(--shadow-md);
  letter-spacing: 0;
}

.edit-indicator.on { display: block; animation: fadeIn var(--dur-normal) var(--ease-out); }

/* ============================================================
   UTILITY
   ============================================================ */
.perf-mid { color: #D97706; font-weight: 500; }
.power-high { color: #DC2626; font-weight: 500; }
.form-desc { font-size: var(--text-sm); color: var(--text2); margin-bottom: var(--space-md); line-height: 1.6; }
.form-hint { font-size: var(--text-xs); color: var(--text2); margin-bottom: 14px; padding: var(--space); background: var(--surface-hover); border-radius: var(--radius-sm); line-height: 1.6; border: 1px solid var(--hairline-cool); }
.form-group { margin-bottom: var(--space); }
.fp16-value { white-space: pre-line; font-size: var(--text-sm); }
.flex-1 { flex: 1; }
.jc-center { justify-content: center; }
.ml-auto { margin-left: auto; }
.grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-footer { display: flex; gap: 8px; margin-top: 16px; }

/* ============================================================
   MOBILE BOTTOM TABS
   ============================================================ */
.mobile-tabs {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--hairline);
  padding: 4px 8px env(safe-area-inset-bottom);
  justify-content: space-around;
  box-shadow: 0 -2px 14px rgba(0, 0, 0, 0.05);
}

.mobile-tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 10px;
  cursor: pointer;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  transition: color var(--dur-fast) var(--ease-out);
  font-family: inherit;
  min-width: 48px;
  min-height: 44px;
}

.mobile-tabs button .tab-icon { font-size: 18px; line-height: 1; }
.mobile-tabs button.active { color: var(--accent); font-weight: 500; }

/* ============================================================
   RESPONSIVE
   ============================================================ */

/* ≤1023px — Tablet/ Small Desktop */
@media (max-width: 1023px) {
  .hamburger { display: flex; }
  .sidebar {
    position: fixed;
    left: -288px;
    top: 0;
    bottom: 0;
    z-index: 160;
    width: 280px;
    transition: left 280ms var(--ease-in-out);
    padding-top: calc(64px + env(safe-area-inset-top, 0px));
    box-shadow: var(--shadow-xl);
    border-right: 1px solid var(--hairline);
  }
  .sidebar.open { left: 0; }
  .nav-actions .btn:not(.btn-icon) { display: none; }
  .nav-actions .btn-icon { display: flex; }
  .search-wrap input { width: 160px; }
  .search-wrap input:focus { width: 180px; }
}

/* ≤767px — Mobile */
@media (max-width: 767px) {
  .navbar {
    padding: 0 var(--space);
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(52px + env(safe-area-inset-top, 0px));
  }
  .navbar .brand { font-size: var(--text-sm); gap: 6px; }
  .navbar .brand .brand-icon { width: 28px; height: 28px; }
  .search-wrap input { width: 120px; font-size: var(--text-sm); padding: 7px 8px 7px 28px; }
  .search-wrap input:focus { width: 140px; }
  .live-badge { font-size: 10px; padding: 3px 9px; }

  .app { height: calc(100vh - 52px - 46px - 56px); }

  .cmp-bar { padding: 8px var(--space); gap: 5px; min-height: 36px; overflow-x: auto; flex-wrap: nowrap; }
  .cmp-bar .cmp-label { font-size: 11px; }
  .cmp-tag { font-size: 11px; padding: 4px 9px; white-space: nowrap; }

  .main { padding: var(--space); padding-bottom: 72px; }

  .table-wrap { display: none; }
  .card-grid { display: grid; }

  .modal {
    max-width: 100vw;
    max-height: 90vh;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    top: auto;
    animation: slideUpModal 280ms var(--ease-out);
  }
  .modal-overlay { align-items: flex-end; }
  .spec-grid { grid-template-columns: 1fr; }

  .cmp-grid { font-size: var(--text-xs); }
  .cmp-cell { padding: 8px 10px; min-width: 110px; }

  .mobile-tabs { display: flex; }
  .scroll-top { bottom: 74px; right: 12px; }
  .toast { bottom: 74px; right: 12px; left: 12px; text-align: center; }
  .dropdown-menu { right: auto; left: 0; }
}

/* ≥768px — Force table */
@media (min-width: 768px) {
  .card-grid { display: none !important; }
  .table-wrap { display: block !important; }
}

/* ≥1024px — Force sidebar visible, buttons visible */
@media (min-width: 1024px) {
  .sidebar { position: relative !important; left: 0 !important; }
  .sidebar-overlay { display: none !important; }
  .hamburger { display: none !important; }
}

/* ============================================================
   SIDEBAR VIEW TABS
   ============================================================ */
.side-view-tabs {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 6px;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 4px;
}

.side-view-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-family: inherit;
  text-align: left;
  transition: all var(--dur-fast) var(--ease-out);
}

.side-view-tab:hover {
  background: var(--accent-subtle);
  color: var(--accent);
}

.side-view-tab.active {
  background: var(--accent-subtle);
  color: var(--accent);
  font-weight: 600;
}

.side-view-tab .tab-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.side-view-hint {
  padding: 10px 14px;
  font-size: 11px;
  color: var(--text3);
  line-height: 1.5;
}

.side-view-hint .chip-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.side-view-hint .chip-filter-btn {
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  font-family: inherit;
  transition: all var(--dur-fast) var(--ease-out);
}

.side-view-hint .chip-filter-btn:hover,
.side-view-hint .chip-filter-btn.active {
  background: var(--accent-subtle);
  color: var(--accent);
  border-color: var(--accent);
}

.side-view-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 0 6px;
}

.side-view-list .gpu-item {
  margin: 1px 0;
}

/* ============================================================
   SERVER LAYER CARDS
   ============================================================ */
.server-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: var(--space-md);
}

.server-card {
  background: var(--surface-glass);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid var(--hairline);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
  box-shadow: var(--shadow-sm);
  transition: all var(--dur-normal) var(--ease-out);
  position: relative;
  overflow: hidden;
}

.server-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, rgba(37,99,235,0.3), rgba(37,99,235,0.05), transparent);
  opacity: 0;
  transition: opacity var(--dur-normal) var(--ease-out);
}

.server-card:hover {
  box-shadow: var(--shadow-lg), var(--shadow-glow-blue);
  border-color: var(--hairline-strong);
  transform: translateY(-2px);
}

.server-card:hover::before {
  opacity: 1;
}

.server-card .server-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
  padding-bottom: var(--space);
  border-bottom: 1px solid var(--hairline-cool);
}

.server-card .server-card-name {
  font-weight: 600;
  font-size: var(--text-lg);
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.3;
  display: flex;
  align-items: center;
  gap: 8px;
}

.server-card .server-card-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
  margin-bottom: var(--space-md);
}

.server-card .server-meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.server-card .server-meta-item label {
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.server-card .server-meta-item .val {
  font-size: var(--text-sm);
  color: var(--text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.server-card .server-config-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 12px;
  background: linear-gradient(135deg, var(--accent-subtle), var(--surface-active));
  border-radius: var(--radius-md);
  border: 1px solid var(--hairline-cool);
  margin-bottom: var(--space);
}

.server-card .server-config-row label {
  font-size: var(--text-xs);
  color: var(--text2);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.server-card .server-config-row input[type="number"] {
  width: 52px;
  padding: 5px 6px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  text-align: center;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-out);
}

.server-card .server-config-row input[type="number"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-ring);
}

.server-card .server-card-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

/* ============================================================
   SUPERNODE LAYER — Accordion
   ============================================================ */
.supernode-grid {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.supernode-block {
  background: var(--surface-glass);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid var(--hairline);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all var(--dur-normal) var(--ease-out);
}

.supernode-block:hover {
  box-shadow: var(--shadow-lg), var(--shadow-glow-blue);
  border-color: var(--hairline-strong);
  transform: translateY(-1px);
}

.supernode-block .sn-header {
  padding: var(--space-xl);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  background: linear-gradient(180deg, rgba(37,99,235,0.03), transparent);
  transition: background var(--dur-fast) var(--ease-out);
}

.supernode-block .sn-header:hover {
  background: linear-gradient(180deg, rgba(37,99,235,0.06), rgba(37,99,235,0.01));
}

.supernode-block .sn-header .sn-name {
  font-weight: 600;
  font-size: var(--text-lg);
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.01em;
}

.supernode-block .sn-header .sn-chevron {
  font-size: 12px;
  color: var(--accent);
  background: var(--accent-subtle);
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  transition: all var(--dur-normal) var(--ease-out);
  flex-shrink: 0;
}

.supernode-block.collapsed .sn-header .sn-chevron {
  transform: rotate(-90deg);
}

.supernode-block .sn-body {
  padding: 0 var(--space-xl) var(--space-xl);
  border-top: 1px solid var(--hairline-cool);
  display: block;
}

.supernode-block.collapsed .sn-body {
  display: none;
}

.supernode-block .sn-config {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space);
  padding: var(--space-md) 0;
}

.supernode-block .sn-config-item {
  background: var(--surface);
  border: 1px solid var(--hairline-cool);
  border-radius: var(--radius-md);
  padding: var(--space);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.supernode-block .sn-config-item label {
  font-size: 11px;
  color: var(--text2);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.supernode-block .sn-config-item input {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: all var(--dur-fast) var(--ease-out);
}

.supernode-block .sn-config-item input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-ring);
}

.supernode-block .sn-results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space);
  padding-top: var(--space-md);
  border-top: 1px solid var(--hairline-cool);
  margin-top: var(--space-xs);
}

.supernode-block .sn-result-item {
  background: linear-gradient(135deg, var(--surface), var(--bg));
  border-radius: var(--radius-md);
  padding: var(--space) var(--space-md);
  border: 1px solid var(--hairline-cool-3);
  transition: all var(--dur-fast) var(--ease-out);
}

.supernode-block .sn-result-item:hover {
  border-color: var(--accent-ring);
  box-shadow: 0 0 0 2px var(--accent-subtle);
}

.supernode-block .sn-result-item label {
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: block;
  margin-bottom: 4px;
  font-weight: 600;
}

.supernode-block .sn-result-item .val {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.supernode-block .sn-result-item .val.power-high {
  color: var(--danger);
}

.supernode-block .sn-result-item .val.perf-mid {
  color: var(--warn);
}

.supernode-block .sn-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  padding-top: var(--space-md);
  margin-top: var(--space-xs);
  border-top: 1px solid var(--hairline-cool);
}

.supernode-block .sn-suggestion {
  margin-top: var(--space);
  padding: var(--space) var(--space-md);
  background: linear-gradient(135deg, var(--accent-subtle), rgba(37,99,235,0.03));
  border-radius: var(--radius-md);
  border: 1px solid var(--accent-ring);
  font-size: var(--text-sm);
  color: var(--accent);
  font-weight: 500;
}

/* ============================================================
   DETAIL PAGE TAB BAR
   ============================================================ */
.detail-tabs {
  display: flex;
  gap: 0;
  margin-bottom: var(--space-md);
  border-bottom: 2px solid var(--hairline);
  padding: 0 4px;
}

.detail-tab {
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  font-family: inherit;
  transition: all var(--dur-fast) var(--ease-out);
  white-space: nowrap;
}

.detail-tab:hover {
  color: var(--accent);
  background: var(--accent-subtle);
}

.detail-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ============================================================
   INLINE CONFIG PANEL — Expandable Config Sub-rows
   ============================================================ */
.config-panel {
  background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
  border: 1px solid var(--hairline-cool);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 2px 12px rgba(15,23,42,0.03);
  margin: 0;
  padding: 14px 16px 10px;
}
/* ============================================================
   CONFIG SUB-TABLE — clean expandable config rows
   ============================================================ */
.config-sub-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: 12px; margin: 0;
}
.config-sub-table thead th {
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.04em;
  padding: 7px 10px; text-align: center;
  background: rgba(148,163,184,0.04);
  border-bottom: 1px solid var(--hairline);
  white-space: nowrap;
}
.config-sub-table thead th:first-child { padding-left: 14px; }
.config-sub-table tbody td {
  padding: 7px 10px; text-align: center;
  border-bottom: 1px solid var(--hairline-cool);
  vertical-align: middle; color: var(--text2);
  white-space: nowrap;
}
.config-sub-table tbody td:first-child { padding-left: 14px; }
.config-sub-table tbody tr:hover td { background: rgba(37,99,235,0.02); }
.config-sub-table tbody tr.compared td { background: rgba(37,99,235,0.05); }
.config-sub-prod { font-size: 11px; color: var(--text3); }
.config-sub-name { font-weight: 500; color: var(--text); }
.config-sub-chip { font-size: 10px; color: var(--text3); }
.config-sub-actions {
  display: flex; gap: 4px; justify-content: center; align-items: center;
}
.config-sub-btn {
  font-size: 10px; padding: 2px 7px; border-radius: var(--radius-sm);
  border: 1px solid var(--hairline); background: var(--surface);
  color: var(--text2); cursor: pointer; transition: all var(--dur-fast);
  display: inline-flex; align-items: center; gap: 2px;
  white-space: nowrap;
}
.config-sub-btn:hover { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent-ring); }
.config-sub-btn.active { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.config-sub-btn.danger:hover { background: var(--danger-subtle); color: var(--danger); border-color: var(--danger); }
.config-sub-btn-icon { width: 11px; height: 11px; }
.add-config-sub-btn {
  display: block; width: 100%; padding: 8px;
  border: 1.5px dashed var(--hairline-strong); border-radius: var(--radius-md);
  background: transparent; color: var(--text3); font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all var(--dur-fast);
}
.add-config-sub-btn:hover {
  border-color: var(--accent-ring); color: var(--accent);
  background: var(--accent-subtle);
}

.add-config-btn {
  display: block; width: 100%; margin-top: 0; padding: 10px;
  border: 1.5px dashed var(--hairline-strong); border-radius: var(--radius-md);
  background: transparent; color: var(--text3); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all var(--dur-fast);
}
.add-config-btn:hover {
  border-color: var(--accent-ring); color: var(--accent);
  background: var(--accent-subtle);
}
/* Card gap between product groups */
.card-gap { height: 4px !important; }
.card-gap td { padding: 0 !important; border: none !important; background: transparent !important; min-height: 0 !important; }

/* Card borders — product row is the top of the card */
.product-row td {
  border-top: 1.5px solid var(--hairline-strong);
  border-bottom: none;
  background: var(--surface);
}
.product-row td:first-child { border-left: 3px solid rgba(37,99,235,0.18); }
.product-row td:last-child { border-right: 1.5px solid var(--hairline-strong); }
.product-row td:not(:first-child):not(:last-child) { border-left: none; border-right: none; }

/* Collapsed card: bottom border closes the card */
.product-row:not(.expanded) td { border-bottom: 1.5px solid var(--hairline-strong); }
.product-row:not(.expanded) td:first-child { border-radius: 10px 0 0 10px; }
.product-row:not(.expanded) td:last-child { border-radius: 0 10px 10px 0; }

/* Expanded: card top corners only, no bottom border */
.product-row.expanded td { border-bottom: none; }
.product-row.expanded td:first-child { border-radius: 10px 0 0 0; }
.product-row.expanded td:last-child { border-radius: 0 10px 0 0; }

/* Config panel: card bottom */
.config-panel-row td {
  padding: 0 !important;
  border-left: 3px solid rgba(37,99,235,0.18);
  border-right: 1.5px solid var(--hairline-strong);
  border-bottom: 1.5px solid var(--hairline-strong);
  background: var(--surface);
}
.config-panel-row td:first-child { border-radius: 0 0 0 10px; }
.config-panel-row td:last-child { border-radius: 0 0 10px 0; }

/* ============================================================
   EXPANDABLE PRODUCT ROWS (Server & Supernode table views)
   ============================================================ */
.product-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 13px; }

.product-table thead th,
.product-table tbody td {
  padding: 0 8px;
  min-height: 52px;
  text-align: center;
  vertical-align: middle;
  box-sizing: border-box;
  overflow: hidden;
}

.product-table thead tr,
.product-table tbody tr {
  height: 52px;
}

.product-table thead th {
  font-weight: 600;
  font-size: 13px;
  color: #334155;
  background: rgba(248,250,252,0.96);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--hairline-strong);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  z-index: 2;
}

.product-row {
  cursor: pointer;
  transition: none;
}

.product-row:hover td { background: rgba(37,99,235,0.025); }
.product-row.expanded td { background: var(--surface); }

.product-row .expand-arrow {
  display: inline-block;
  width: 16px;
  font-size: 10px;
  color: var(--text3);
  transition: transform 0.2s var(--ease-out);
  margin-right: 4px;
}

.product-row.expanded .expand-arrow { transform: rotate(90deg); }

.product-name-cell {
  font-weight: 500;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  line-height: 1.4;
  gap: 2px;
}

/* Spec detail rows */
.spec-detail-row {
  background: var(--bg) !important;
}

.spec-detail-row td {
  border-bottom: 1px solid var(--hairline-cool);
  font-size: 12px;
}

.spec-detail-cell {
  padding: 8px 12px !important;
}

.spec-detail-row .spec-header {
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: rgba(148,163,184,0.06);
}

.spec-detail-row .spec-header td {
  padding: 6px 12px !important;
  border-bottom: 1px solid var(--hairline);
}

/* Spec add button row */
.spec-add-row td {
  padding: 6px 12px !important;
  border-bottom: none;
}

.spec-add-row .btn {
  font-size: 11px;
  padding: 4px 10px;
}

/* ============================================================
   RESPONSIVE — Server & Supernode mobile
   ============================================================ */
@media (max-width: 767px) {
  .server-grid {
    grid-template-columns: 1fr;
  }

  .server-card .server-card-meta {
    grid-template-columns: 1fr;
  }

  .supernode-block .sn-config {
    grid-template-columns: 1fr 1fr;
  }

  .supernode-block .sn-results {
    grid-template-columns: 1fr 1fr;
  }
}

</style>
</head>
