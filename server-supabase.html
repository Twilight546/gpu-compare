<script>
// ==================== 数据中心 GPU 服务器对比系统 ====================
// Supabase 集成 — 服务端鉴权 + RLS 策略
// 在 Supabase Dashboard → Authentication → Users 中创建管理员账号

// ==================== 数据源隔离模块 ====================
const DATA_SOURCE = {
  CHIP: 'chip',
  SERVER: 'server',
  SUPERNODE: 'supernode',

  // 从 class 字段映射到数据源类型
  fromClass: function(cls) {
    if (cls === 'GPU' || cls === 'chip') return DATA_SOURCE.CHIP;
    if (cls === '服务器' || cls === 'server') return DATA_SOURCE.SERVER;
    if (cls === '超节点' || cls === 'supernode') return DATA_SOURCE.SUPERNODE;
    return DATA_SOURCE.CHIP;
  },

  // 获取记录的 Supabase 表名
  tableFor: function() { return 'gpus'; }, // [v2-优化项-6]

  // 获取记录的数据源类型
  typeOf: function(record) {
    return DATA_SOURCE.fromClass(record.class || 'GPU');
  },

  // 检查两条记录是否可以对比（必须同类型）
  canCompare: function(typeA, typeB) {
    return typeA === typeB;
  }
};

// ==================== Store 模块 ====================
const Store = (() => {
  const STORAGE_KEY = 'gpu_compare_state_v2';

  let state = {
    gpuData: [],
    compareList: [],
    editMode: false,
    columnFilters: {},
    sortCol: null,
    sortDir: 1,
    sidebarOpen: false,
    isUnlocked: false,
    supabaseConfig: null,
    supabaseClient: null,
    realtimeChannel: null,
    pollingTimer: null,
    loading: true,
    currentView: 'detail',
    detailTab: 'chip',
    serverConfigs: {},
    supernodeConfigs: {},
    compareConfigMap: {},
    chipVendorFilter: null,
    powerType: 'FP16'
  };

  const listeners = new Set();

  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function notify(hint) { listeners.forEach(fn => fn(hint)); }

  function loadConfig() {
    const saved = sessionStorage.getItem('gpu_compare_supabase_config');
    // 安全提示：anon key 是公开密钥，安全性依赖 Supabase 后台 RLS 策略
    // 确保 gpus 表的 INSERT/UPDATE/DELETE 仅允许认证用户，settings 表 anon 不可读
    const defaults = {
      url: 'https://xgjojrmmfijpfukuigdu.supabase.co',
      anonKey: 'sb_publishable_duZJNGb6fxETvLTRfT1HcA_23MwEGrE'
    };
    if (!saved) { state.supabaseConfig = defaults; return; }
    try {
      state.supabaseConfig = JSON.parse(saved);
    } catch (e) {
      console.warn('配置解析失败，已重置为默认配置:', e.message);
      state.supabaseConfig = defaults;
    }
  }

  function loadViewState() {
    try {
      const saved = localStorage.getItem('gpu_compare_view_state');
      if (saved) {
        const vs = JSON.parse(saved);
        if (vs.currentView) state.currentView = vs.currentView;
        if (vs.detailTab) state.detailTab = vs.detailTab;
        // Migration: old serverGpuCounts (number values) -> serverConfigs (array)
        if (vs.serverConfigs) {
          state.serverConfigs = vs.serverConfigs;
        } else if (vs.serverGpuCounts) {
          let migrated = {};
          Object.keys(vs.serverGpuCounts).forEach(function(key) {
            if (key.indexOf('_expanded_') === 0) {
              migrated[key] = vs.serverGpuCounts[key];
            } else if (typeof vs.serverGpuCounts[key] === 'number') {
              migrated[key] = [{ cid: 'c_default', name: '默认配置', gpuCount: vs.serverGpuCounts[key], chassis: '' }];
            } else {
              migrated[key] = vs.serverGpuCounts[key];
            }
          });
          state.serverConfigs = migrated;
        }
        // Migration: old supernodeConfigs (single object) -> array
        if (vs.supernodeConfigs) {
          let snMigrated = {};
          Object.keys(vs.supernodeConfigs).forEach(function(key) {
            if (key.indexOf('_expanded_') === 0 || key.indexOf('_collapsed') >= 0) {
              snMigrated[key] = vs.supernodeConfigs[key];
            } else if (vs.supernodeConfigs[key] && typeof vs.supernodeConfigs[key].cabinetCount !== 'undefined') {
              snMigrated[key] = [Object.assign({ cid: 'c_default', name: '默认配置' }, vs.supernodeConfigs[key])];
            } else {
              snMigrated[key] = vs.supernodeConfigs[key];
            }
          });
          state.supernodeConfigs = snMigrated;
        }
        if (vs.chipVendorFilter !== undefined) state.chipVendorFilter = vs.chipVendorFilter;
        if (vs.powerType) state.powerType = vs.powerType;
        if (vs.compareConfigMap) state.compareConfigMap = vs.compareConfigMap;
      }
    } catch (e) { /* ignore */ }
  }

  function saveViewState() {
    try {
      localStorage.setItem('gpu_compare_view_state', JSON.stringify({
        currentView: state.currentView,
        detailTab: state.detailTab,
        serverConfigs: state.serverConfigs,
        supernodeConfigs: state.supernodeConfigs,
        compareConfigMap: state.compareConfigMap,
        chipVendorFilter: state.chipVendorFilter,
        powerType: state.powerType
      }));
    } catch (e) { /* ignore */ }
  }

  function saveConfig() {
    if (state.supabaseConfig) {
      sessionStorage.setItem('gpu_compare_supabase_config', JSON.stringify(state.supabaseConfig));
    }
  }

  return {
    get: (key) => state[key],
    set: (key, value) => { if (state[key] === value) return; state[key] = value; notify(); },
    update: (key, fn) => { const newVal = fn(state[key]); if (state[key] === newVal) return; state[key] = newVal; notify(); },
    batchSet: (updates) => { let changed = false; Object.keys(updates).forEach(function (k) { if (state[k] !== updates[k]) { state[k] = updates[k]; changed = true; } }); if (changed) notify(); },
    setSilent: (key, value) => { state[key] = value; },
    getState: () => ({ ...state }),
    subscribe,
    notify,
    loadConfig,
    saveConfig,
    loadViewState,
    saveViewState,
    STORAGE_KEY
  };
})();


// ==================== API 模块 ====================
const API = (() => {

  function isConfigured() {
    const cfg = Store.get('supabaseConfig');
    return !!(cfg && cfg.url && cfg.anonKey);
  }

  function getSupabase() {
    if (!isConfigured()) return null;
    let client = Store.get('supabaseClient');
    if (!client) {
      const cfg = Store.get('supabaseConfig');
      client = supabase.createClient(cfg.url, cfg.anonKey);
      Store.set('supabaseClient', client);
    }
    return client;
  }

  function getHeaders() {
    const cfg = Store.get('supabaseConfig');
    return {
      'apikey': cfg.anonKey,
      'Authorization': 'Bearer ' + cfg.anonKey,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };
  }

  const FETCH_TIMEOUT = 15000; // 15 秒超时

  async function fetchAPI(path, options, timeoutMs) {
    options = options || {};
    const cfg = Store.get('supabaseConfig');
    if (!cfg || !cfg.url) throw new Error('未配置 Supabase');
    const url = cfg.url.replace(/\/$/, '') + '/rest/v1/' + path;
    const ms = timeoutMs || FETCH_TIMEOUT;
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, ms);
    try {
      const res = await fetch(url, { ...options, headers: { ...getHeaders(), ...(options.headers || {}) }, signal: controller.signal });
      if (!res.ok) {
        let errMsg = res.status + ' ' + res.statusText;
        try { const body = await res.json(); errMsg = body.message || body.error || JSON.stringify(body); } catch (e) { /* keep default */ }
        throw new Error(errMsg);
      }
      return res;
    } finally {
      clearTimeout(timer);
    }
  }

  function cleanGpuFields(data) {
    data.forEach(function (g) {
      if ((g.class || 'GPU') === 'GPU') {
        g.gpu_count = '';
        g.chassis = '';
      }
    });
    return data;
  }

  const GPU_CACHE_KEY = 'gpu_compare_data_cache';

  function cacheGpuData(data) {
    try { sessionStorage.setItem(GPU_CACHE_KEY, JSON.stringify(data)); } catch (e) { /* quota exceeded, ignore */ }
  }

  function loadCachedGpuData() {
    try {
      const raw = sessionStorage.getItem(GPU_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  async function loadAll() {
    // 仅在无数据显示时展示骨架屏，已有缓存数据时静默刷新
    if (Store.get('gpuData').length === 0) {
      Store.set('loading', true);
    }
    try {
      if (!isConfigured()) {
        var localData = cleanGpuFields(structuredClone(DEFAULT_DATA));
        Store.batchSet({ gpuData: localData, loading: false });
        cacheGpuData(localData);
        return;
      }
      const res = await fetchAPI('gpus?select=*&order=id.asc');
      const data = await res.json();
      data.forEach(function (g) { if (g.class === 'Supernode') g.class = '超节点'; });
      var cloudData = cleanGpuFields(data);
      Store.batchSet({ gpuData: cloudData, loading: false });
      cacheGpuData(cloudData);
    } catch (e) {
      var isTimeout = e.name === 'AbortError';
      console.error('Supabase 加载失败:', isTimeout ? '请求超时' : e.message);
      if (Store.get('gpuData').length === 0) {
        var fallback = cleanGpuFields(structuredClone(DEFAULT_DATA));
        Store.batchSet({ gpuData: fallback, loading: false });
      } else {
        Store.set('loading', false);
      }
      var errMsg = isTimeout ? '云端请求超时，显示本地数据' : e.message.substring(0, 50);
      UI.showErrorToast('加载失败: ' + errMsg, function () { loadAll(); });
    }
  }

  // 静默轮询：逐条 diff，只更新变化的 GPU
  async function pollSilent() {
    if (!isConfigured()) return false;
    try {
      const res = await fetchAPI('gpus?select=*&order=id.asc');
      const data = await res.json();
      data.forEach(function (g) { if (g.class === 'Supernode') g.class = '超节点'; });
      const oldData = Store.get('gpuData');
      if (oldData.length !== data.length) {
        Store.set('gpuData', cleanGpuFields(data));
        Store.notify();
        return true;
      }
      const changed = [];
      let needFullRefresh = false;
      const oldMap = {};
      oldData.forEach(function (g) { oldMap[g.id] = g; });
      for (let i = 0; i < data.length; i++) {
        const g = data[i];
        const old = oldMap[g.id];
        if (!old || recordChanged(old, g)) {
          if (!old || old.class !== g.class || old.category !== g.category) {
            needFullRefresh = true;
            break;
          }
          changed.push(g);
        }
      }
      if (needFullRefresh) {
        Store.set('gpuData', cleanGpuFields(data));
        Store.notify();
        return true;
      }
      if (changed.length === 0) return true;
      Store.set('gpuData', cleanGpuFields(data));
      changed.forEach(function (g) { UI.patchSingleGPU(g); });
      return true;
    } catch (e) {
      return false;
    }
  }

  function recordChanged(a, b) {
    for (const k of Object.keys(a)) {
      if (a[k] !== b[k]) return true;
    }
    return Object.keys(a).length !== Object.keys(b).length;
  }

  async function syncDefaults() {
    try {
      const batch = cleanGpuFields(DEFAULT_DATA.map(g => ({ ...g, id: g.id, class: (g.class === 'Supernode' ? '超节点' : g.class) || 'GPU' })));
      await fetchAPI('gpus', {
        method: 'POST',
        body: JSON.stringify(batch),
        headers: { 'Prefer': 'resolution=merge-duplicates' }
      });
      Store.set('gpuData', cleanGpuFields(structuredClone(DEFAULT_DATA)));
      UI.showToast('已初始化云端数据库');
    } catch (e) {
      console.warn('初始化云端失败:', e.message);
      Store.set('gpuData', cleanGpuFields(structuredClone(DEFAULT_DATA)));
    }
  }

  async function saveOne(id, fields) {
    if (!isConfigured()) {
      const gpuData = Store.get('gpuData');
      const g = gpuData.find(function (d) { return d.id === id; });
      if (g) Object.assign(g, fields);
      return true;
    }
    try {
      await fetchAPI('gpus?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(fields) });
      return true;
    } catch (e) {
      console.error('云端保存失败:', e.message);
      UI.showErrorToast('保存失败: ' + e.message.substring(0, 60), function () { saveOne(id, fields); });
      return false;
    }
  }

  async function addOne(gpu) {
    const gpuData = Store.get('gpuData');
    const newId = Math.max.apply(null, gpuData.map(function (g) { return g.id; }).concat(0)) + 1;
    const ng = { id: newId, vendor: '', arch: '', type: '', vram: '—', bandwidth: '—', interconnect: '—', tdp: '—', fp16: '—', gpu_count: '—', chassis: '—', notes: '', category: 'nvidia', class: 'GPU' };
    Object.assign(ng, gpu);
    if (!isConfigured()) {
      gpuData.push(ng);
      return ng;
    }
    try {
      const res = await fetchAPI('gpus', { method: 'POST', body: JSON.stringify(ng) });
      const created = await res.json();
      if (created && created.length > 0) {
        gpuData.push(created[0]);
        return created[0];
      }
      gpuData.push(ng);
      return ng;
    } catch (e) {
      console.error('云端添加失败:', e.message);
      gpuData.push(ng);
      UI.showErrorToast('添加失败: ' + e.message.substring(0, 60), function () { addOne(gpu); });
      return ng;
    }
  }

  async function deleteOne(id) {
    const gpuData = Store.get('gpuData');
    const i = gpuData.findIndex(function (g) { return g.id === id; });
    if (i < 0) return;
    if (!isConfigured()) { gpuData.splice(i, 1); return true; }
    try {
      await fetchAPI('gpus?id=eq.' + id, { method: 'DELETE' });
      gpuData.splice(i, 1);
      return true;
    } catch (e) {
      console.error('云端删除失败:', e.message);
      gpuData.splice(i, 1);
      UI.showErrorToast('删除失败: ' + e.message.substring(0, 60), function () { deleteOne(id); });
      return false;
    }
  }

  async function resetAll() {
    if (!isConfigured()) {
      Store.set('gpuData', cleanGpuFields(structuredClone(DEFAULT_DATA)));
      return;
    }
    try {
      await fetchAPI('gpus?id=gt.0', { method: 'DELETE' });
      const batch = cleanGpuFields(DEFAULT_DATA.map(g => ({ ...g, id: g.id, class: (g.class === 'Supernode' ? '超节点' : g.class) || 'GPU' })));
      await fetchAPI('gpus', { method: 'POST', body: JSON.stringify(batch) });
      Store.set('gpuData', cleanGpuFields(structuredClone(DEFAULT_DATA)));
    } catch (e) { console.warn('重置失败:', e.message); }
  }

  // Password — 通过 RPC 在服务器端验证，密码不暴露
  async function rpcCall(fnName, params) {
    const cfg = Store.get('supabaseConfig');
    if (!cfg || !cfg.url) throw new Error('未配置 Supabase');
    const url = cfg.url.replace(/\/$/, '') + '/rest/v1/rpc/' + fnName;
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT);
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify(params),
        signal: controller.signal
      });
      if (!res.ok) throw new Error('RPC call failed: ' + res.status);
      return res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function verifyPasswordRPC(password) {
    if (!isConfigured()) return false;
    try {
      const result = await rpcCall('verify_password', { input_password: password });
      return result === true;
    } catch (e) {
      console.warn('密码验证失败:', e.message);
      return false;
    }
  }

  async function changePasswordRPC(oldPassword, newPassword) {
    if (!isConfigured()) return false;
    try {
      const result = await rpcCall('change_password', { old_password: oldPassword, new_password: newPassword });
      return result === true;
    } catch (e) {
      console.error('修改密码失败:', e.message);
      return false;
    }
  }

  // Realtime
  function subscribeRealtime() {
    _ensureVisHandler();
    const ch = Store.get('realtimeChannel');
    if (ch) {
      const sb = getSupabase();
      if (sb) sb.removeChannel(ch);
    }
    if (!isConfigured()) return;
    const sb = getSupabase();
    if (!sb) return;
    const channel = sb.channel('gpus-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'gpus' }, function (payload) {
        const gpuData = Store.get('gpuData');
        switch (payload.eventType) {
          case 'INSERT':
            if (payload.new && !gpuData.find(function (g) { return g.id === payload.new.id; })) {
              gpuData.push(payload.new);
            }
            break;
          case 'UPDATE':
            if (payload.new) {
              const idx = gpuData.findIndex(function (g) { return g.id === payload.new.id; });
              if (idx >= 0) {
                const oldRec = gpuData[idx];
                gpuData[idx] = payload.new;
                // 仅更新变化的 DOM 元素
                if (oldRec.class !== payload.new.class || oldRec.category !== payload.new.category) {
                  Store.notify();
                } else {
                  UI.patchSingleGPU(payload.new);
                }
                return;
              }
            }
            break;
          case 'DELETE':
            if (payload.old) {
              const idx = gpuData.findIndex(function (g) { return g.id === payload.old.id; });
              if (idx >= 0) gpuData.splice(idx, 1);
              Store.update('compareList', function (list) { return list.filter(function (cid) { return cid !== payload.old.id; }); });
            }
            break;
        }
        Store.notify();
      })
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') {
          document.getElementById('setup-banner').classList.remove('show');
        } else if (status === 'CHANNEL_ERROR') {
          startPollingFallback();
        }
      });
    Store.set('realtimeChannel', channel);
  }

  function startPollingFallback() {
    if (Store.get('pollingTimer')) return;
    const baseDelay = 5000;
    const maxDelay = 60000;
    let delay = baseDelay;
    let timer;
    let stopped = false;
    async function schedule() {
      if (stopped) return;
      const ok = await pollSilent();
      delay = ok ? baseDelay : Math.min(delay * 2, maxDelay);
      if (!stopped) timer = setTimeout(schedule, delay);
    }
    schedule();
    Store.set('pollingTimer', {
      stop: function () { stopped = true; clearTimeout(timer); }
    });
  }

  // Visibility-based polling pause/resume (registered once)
  let _visHandlerRegistered = false;
  function _ensureVisHandler() {
    if (_visHandlerRegistered) return;
    _visHandlerRegistered = true;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        stopPolling();
      } else {
        if (!Store.get('realtimeChannel')) startPollingFallback();
      }
    });
  }

  function stopPolling() {
    const timer = Store.get('pollingTimer');
    if (timer) { timer.stop(); Store.set('pollingTimer', null); }
  }

  return {
    isConfigured, getSupabase, loadAll, loadCachedGpuData, cleanGpuFields, pollSilent, saveOne, addOne, deleteOne, resetAll,
    verifyPasswordRPC, changePasswordRPC,
    subscribeRealtime, startPollingFallback, stopPolling
  };
})();

// ==================== UI 模块 ====================
const UI = (() => {

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function debounce(fn, delay) {
    let timer;
    return function () {
      const ctx = this, args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(ctx, args); }, delay);
    };
  }

  function icon(id, cls) {
    cls = cls || '';
    return '<svg class="icon ' + cls + '"><use href="#' + id + '"/></svg>';
  }

  function html(strings) {
    let result = '';
    for (let i = 0; i < strings.length; i++) {
      result += strings[i];
      if (i < arguments.length - 1) {
        let arg = arguments[i + 1];
        if (arg === null || arg === undefined) arg = '';
        result += String(arg);
      }
    }
    return result;
  }


  function getFilteredData() {
    let data = Store.get('gpuData');
    let q = (document.getElementById('search-input').value || '').toLowerCase();
    let filters = Store.get('columnFilters');

    Object.keys(filters).forEach(function (col) {
      let f = filters[col];
      if (f === null || f === undefined || f === '') return;
      if (col === 'tdp') {
        data = data.filter(function (g) {
          let v = parseTdpWatts(g.tdp);
          if (v === 0 && g.tdp !== '0' && g.tdp !== '0W') return false;
          if (f.min !== null && v < f.min) return false;
          if (f.max !== null && v > f.max) return false;
          return true;
        });
      } else if (col === 'name' || col === 'vram' || col === 'bandwidth' || col === 'interconnect') {
        let ft = String(f).toLowerCase();
        data = data.filter(function (g) { return (g[col] || '').toLowerCase().indexOf(ft) > -1; });
      } else {
        data = data.filter(function (g) { return g[col] === f; });
      }
    });

    if (q) {
      data = data.filter(function (g) {
        return g.name.toLowerCase().indexOf(q) > -1
          || g.vendor.toLowerCase().indexOf(q) > -1
          || g.arch.toLowerCase().indexOf(q) > -1
          || g.type.toLowerCase().indexOf(q) > -1
          || g.vram.toLowerCase().indexOf(q) > -1
          || g.bandwidth.toLowerCase().indexOf(q) > -1
          || g.interconnect.toLowerCase().indexOf(q) > -1
          || (g.notes || '').toLowerCase().indexOf(q) > -1
          || (g.gpu_count || '').toLowerCase().indexOf(q) > -1
          || (g.chassis || '').toLowerCase().indexOf(q) > -1;
      });
    }
    return data;
  }

  function getUniqueValues(key) {
    let vals = [];
    let seen = {};
    Store.get('gpuData').forEach(function (g) {
      let v = (g[key] || '').trim();
      if (v && !seen[v]) { seen[v] = true; vals.push(v); }
    });
    return vals.sort();
  }

  // ---- Sorting ----

  function sortTable(col) {
    const prevCol = Store.get('sortCol');
    const prevDir = Store.get('sortDir');
    Store.set('sortCol', col);
    Store.set('sortDir', (prevCol === col) ? prevDir * -1 : 1);
  }

  // ---- Table ----
  function renderSkevaron() {
    let tbody = document.getElementById('table-body');
    let cols = 13;
    let rows = 8;
    let html = '';
    for (let r = 0; r < rows; r++) {
      html += '<tr class="skeleton-row" style="height:52px;">';
      for (let c = 0; c < cols; c++) {
        let w = c === 0 ? '80%' : (c === 11 ? '60%' : '70%');
        html += '<td><div class="skeleton-cell" style="width:' + w + ';margin:0 auto;"></div></td>';
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
    document.getElementById('table-info').textContent = '加载中...';
  }

  function renderTable(data) {
    const tbody = document.getElementById('table-body');
    const compareList = Store.get('compareList');
    const compareSet = new Set(compareList);
    const powerType = Store.get('powerType') || 'FP16';
    if (Store.get('loading')) {
      renderSkevaron();
      return;
    }
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12"><div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU 数据</div></td></tr>';
      document.getElementById('table-info').textContent = '无匹配结果';
    } else {
      tbody.innerHTML = data.map(function (g) {
        const vendorTag = getVendorTag(g);
        const tdpNum = parseTdpWatts(g.tdp);

        if (tdpNum >= 500) tdpClass = 'power-high';
        else if (tdpNum >= 300) tdpClass = 'perf-mid';
        const selected = compareSet.has(g.id) ? ' selected' : '';
        const chipPower = parseGpuPower(g.fp16, powerType);
        const powerDisplay = chipPower > 0 ? formatPerf(chipPower) : '—';
        const fp16text = g.fp16 || '';
        const fp16Title = escapeHtml(fp16text);
        const inCmp = compareSet.has(g.id);

        return `<tr class="${selected}" data-action="show-detail" data-id="${g.id}">`

          + `<td title="${escapeHtml(g.vendor)}">${vendorTag}</td>`
          + `<td title="${escapeHtml(g.year || '—')}" style="text-align:center;">${escapeHtml(g.year || '—')}</td>`
          + `<td title="${escapeHtml(g.arch)}">${escapeHtml(g.arch)}</td>`
          + `<td title="${escapeHtml(g.type)}">${escapeHtml(g.type)}</td>`
          + `<td title="${escapeHtml(g.vram)}">${escapeHtml(g.vram)}</td>`
          + `<td title="${escapeHtml(g.bandwidth)}">${escapeHtml(g.bandwidth)}</td>`
          + `<td title="${escapeHtml(g.interconnect)}">${escapeHtml(g.interconnect)}</td>`
          + `<td class="${tdpClass}" title="${escapeHtml(g.tdp)}">${escapeHtml(g.tdp)}</td>`
          + `<td title="${fp16Title}">${escapeHtml(powerDisplay)}</td>`
          + `<td title="${escapeHtml(g.gpu_count || '—')}">${escapeHtml(g.gpu_count || '—')}</td>`
          + `<td title="${escapeHtml(g.chassis || '—')}">${escapeHtml(g.chassis || '—')}</td>`
          + `<td>${actionBtns}</td></tr>`;
      }).join('');
      document.getElementById('table-info').textContent = `显示 ${data.length} 条`;
    }
  }

  // ---- Cards (Mobile) ----
  function renderCards(data) {
    const grid = document.getElementById('card-grid');
    const compareList = Store.get('compareList');
    const compareSet = new Set(compareList);
    if (!data || data.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU</div>';
      return;
    }

        + `<div class="card-header"><span class="card-name">${escapeHtml(g.name)}</span>${vendorTag}<span style="margin-left:auto;color:var(--text2);font-size:12px;">${escapeHtml(g.year || '—')}</span></div>`
        + `<div class="card-meta">`
        + `<span><strong>架构</strong> ${escapeHtml(g.arch)}</span>`
        + `<span><strong>类型</strong> ${escapeHtml(g.type)}</span>`
        + `<span><strong>显存</strong> ${escapeHtml(g.vram)}</span>`
        + `<span><strong>带宽</strong> ${escapeHtml(g.bandwidth)}</span>`
        + `<span><strong>TDP</strong> ${escapeHtml(g.tdp)}</span>`

        + `</div></div>`;
    }).join('');
    document.getElementById('table-info').textContent = `显示 ${data.length} 条`;
  }

  // ---- Chip View (芯片层) ----
  function renderChipView(data) {
    const tbody = document.getElementById('table-body');
    const compareList = Store.get('compareList');
    const compareSet = new Set(compareList);
    const powerType = Store.get('powerType') || 'FP16';
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU 芯片</div></td></tr>';
      document.getElementById('table-info').textContent = '无匹配结果';
    } else {
      tbody.innerHTML = data.map(function (g) {
        const vendorTag = getVendorTag(g);

  // ---- Helper: parse default GPU count from gpu_count field ----
  function parseDefaultGpuCount(gpuCountStr) {
    const s = String(gpuCountStr || '');

    if (m) return parseInt(m[1]);
    const m2 = s.match(/(\d+)\s*[xX×]/);
    if (m2) return parseInt(m2[1]);
    const m3 = s.match(/(\d+)\s*GPU/);

  // ---- Helper: find the chip a server uses ----
  function findChipForServer(server) {
    const gpuData = Store.get('gpuData');
    const serverName = (server.name || '').toLowerCase();
    const serverNotes = (server.notes || '').toLowerCase();
    const serverGpuCount = (server.gpu_count || '').toLowerCase();

    // Try to extract chip name from server name/notes/gpu_count
    const allGpus = gpuData.filter(function (g) { return (g.class || 'GPU') === 'GPU'; });

    // Score-based matching
    let best = null;
    let bestScore = 0;
    allGpus.forEach(function (gpu) {
      let score = 0;
      const gn = (gpu.name || '').toLowerCase();
      // Direct name match (e.g., "H100" in "DGX H100")
      if (gn && serverName.indexOf(gn) > -1) score += 10;
      if (gn && serverGpuCount.indexOf(gn) > -1) score += 8;
      if (gn && serverNotes.indexOf(gn) > -1) score += 5;
      // Architecture match
      if (gpu.arch && serverName.indexOf(gpu.arch.toLowerCase()) > -1) score += 3;
      if (score > bestScore) { bestScore = score; best = gpu; }
    });
    return best;
  }

  // ---- Universal GPU Power Parser (同源解析核心) ----
  function parseGpuPower(fp16Str, type) {
    // Null/undefined/empty/NaN guard
    if (fp16Str === null || fp16Str === undefined || fp16Str === '') return 0;
    let s = String(fp16Str).trim();
    if (!s) return 0;
    let t = (type || 'FP16').toUpperCase();

    // Escape the type for regex
    let escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    // Robust regex: match "TYPE:number<unit>" across multi-line text
    // Supports: "FP16:148T", "INT8/FP8:296T", "FP16:756T/1.5P*", "FP16: 148 T"
    // Also handles Chinese colon "：" and optional whitespace
    let regex = new RegExp(
      '(?:^|[\\n\\r]|[A-Z0-9]+/)' + escaped + '[：:]\\s*([\\d.]+)(?:\\s*/\\s*([\\d.]+))?\\s*([TPE])?\\s*\\*?',
      'i'
    );
    let m = s.match(regex);
    if (!m) return 0;

    // Use sparse/higher value if available (second capture group)
    let val = parseFloat(m[2] || m[1]);
    if (isNaN(val) || val < 0) return 0;

    let unit = (m[3] || 'T').toUpperCase();
    if (unit === 'P') val *= 1000;
    else if (unit === 'E') val *= 1000000;
    return val;
  }

  function parseChipFp16T(fp16) {
    const s = String(fp16 || '');
    // Try patterns like "FP16:2250T" or "FP16:2.2P" or "FP16:1/2P*"
    const mT = s.match(/FP16[：:]\s*([\d.]+)T/);
    if (mT) return parseFloat(mT[1]);
    const mP = s.match(/FP16[：:]\s*([\d.]+)P/);
    if (mP) return parseFloat(mP[1]) * 1000;
    const mP2 = s.match(/FP16[：:]\s*([\d.]+)\/([\d.]+)P/);
    if (mP2) return parseFloat(mP2[2]) * 1000;
    // Try BF16 as fallback
    const mBF = s.match(/BF16[：:]\s*([\d.]+)T/);
    if (mBF) return parseFloat(mBF[1]);
    // Try FP8 as fallback
    const mF8 = s.match(/FP8[：:]\s*([\d.]+)T/);
    if (mF8) return parseFloat(mF8[1]) * 2; // rough FP8→FP16 estimate
    return 0;
  }

  function formatPerf(tflops) {
    if (tflops >= 1000) return (tflops / 1000).toFixed(2) + 'P FLOPS';
    if (tflops >= 1) return tflops.toFixed(0) + 'T FLOPS';
    return '—';
  }

  function getDefaultSupernodeConfig(sn) {
    // Try to extract defaults from chassis/notes
    const chassisStr = sn.chassis || '';
    const notesStr = sn.notes || '';
    const gpuCountStr = sn.gpu_count || '';

    let cabinetCount = 8;
    let serverCount = 32;
    let switchCount = 8;
    let serverPower = 10;

    // Parse cabinet count from chassis
    const cabM = chassisStr.match(/~?(\d+)\s*柜/);
    if (cabM) cabinetCount = parseInt(cabM[1]);

    // Parse server count from notes or gpu_count
    const srvM = notesStr.match(/(\d+)\s*台/);
    if (srvM) serverCount = parseInt(srvM[1]);
    const srvM2 = gpuCountStr.match(/(\d+)\s*[xX×]/);
    if (srvM2) {
      const parts = gpuCountStr.split(/[xX×]/);
      if (parts.length >= 2) {
        const m = parts[1].match(/(\d+)/);
        if (m) serverCount = parseInt(m[1]);
      }
    }
    // Try to parse from name like "DGX SuperPOD (H100)" → 32 servers
    if (notesStr.indexOf('32台') > -1) serverCount = 32;
    if (notesStr.indexOf('32×') > -1) {
      const m = notesStr.match(/32[×xX]/);
      if (m) serverCount = 32;
    }

    // For Cerebras CS-3 (single chip), serverCount should be 1
    if (sn.name && sn.name.toLowerCase().indexOf('cs-3') > -1) serverCount = 1;
    if (gpuCountStr.indexOf('单芯片') > -1) serverCount = 1;

    // For Colossus
    if (sn.name && sn.name.toLowerCase().indexOf('colossus') > -1) {
      cabinetCount = 1500;
      serverCount = 10000;
      switchCount = 500;
    }

    // For Groq
    if (sn.name && sn.name.toLowerCase().indexOf('lpu') > -1) {
      cabinetCount = 4;
      serverCount = 1;
      switchCount = 0;
    }

    // For TPU
    if (sn.name && sn.name.toLowerCase().indexOf('tpu') > -1) {
      cabinetCount = 8;
      serverCount = 256;
      switchCount = 16;
    }

    return {
      cabinetCount: cabinetCount,
      serverCount: serverCount,
      serverPower: serverPower,
      switchCount: switchCount,
      switchPower: 2,
      _collapsed: false
    };
  }

  function estimateServerPerf(sn) {
    const gpuData = Store.get('gpuData');
    const snName = (sn.name || '').toLowerCase();
    const snNotes = (sn.notes || '').toLowerCase();
    const snGpuCount = (sn.gpu_count || '').toLowerCase();

    // Try to find the server this supernode is based on
    const servers = gpuData.filter(function (g) { return g.class === '服务器'; });
    let bestServer = null;
    let bestScore = 0;
    servers.forEach(function (srv) {
      let score = 0;
      const sName = (srv.name || '').toLowerCase();
      if (snName.indexOf(sName) > -1) score += 20;
      if (snNotes.indexOf(sName) > -1) score += 10;
      if (srv.arch && snName.indexOf(srv.arch.toLowerCase()) > -1) score += 5;
      if (srv.arch && snNotes.indexOf(srv.arch.toLowerCase()) > -1) score += 3;
      if (score > bestScore) { bestScore = score; bestServer = srv; }
    });

    if (bestServer) {
      const chip = findChipForServer(bestServer);
      if (chip) {
        const defaultGpu = parseDefaultGpuCount(bestServer.gpu_count);
        const powerType = Store.get('powerType') || 'FP16';
        const perf = parseGpuPower(chip.fp16, powerType);
        return perf * (defaultGpu || 8);
      }
    }

    // Fallback: try to parse from sn fp16 field using current power type
    const powerType = Store.get('powerType') || 'FP16';
    return parseGpuPower(sn.fp16, powerType);
  }

  function estimateServerPower(sn) {
    // Try to parse from TDP field
    const tdp = parseTdpWatts(sn.tdp);
    if (tdp > 0) {
      // tdp might be total already; try to get per-server
      const notesStr = sn.notes || '';
      const srvM = notesStr.match(/(\d+)\s*台/);
      const srvCount = srvM ? parseInt(srvM[1]) : 32;
      const gpuM = (sn.gpu_count || '').match(/(\d+)\s*[xX×]/);
      if (gpuM) return tdp / (srvCount || 32);
      // If TDP seems like total, divide by server count
      if (tdp > 100000) return tdp / srvCount;
      return tdp;
    }
    return 0;
  }

      typeBadges[DATA_SOURCE.CHIP] = '<span style="font-size:10px;background:var(--accent-subtle);color:var(--accent);padding:1px 6px;border-radius:3px;margin-left:4px;">芯片</span>';
      typeBadges[DATA_SOURCE.SERVER] = '<span style="font-size:10px;background:var(--warn-subtle);color:var(--warn);padding:1px 6px;border-radius:3px;margin-left:4px;">服务器</span>';
      typeBadges[DATA_SOURCE.SUPERNODE] = '<span style="font-size:10px;background:var(--other-subtle);color:var(--other);padding:1px 6px;border-radius:3px;margin-left:4px;">集群</span>';

  function renderComparePanel() {
    let compareList = Store.get('compareList');
    let gpuData = Store.get('gpuData');
    let serverConfigs = Store.get('serverConfigs') || {};
    let compareConfigMap = Store.get('compareConfigMap') || {};
    function getServerGpuCount(srvId, defaultVal) {
      let cfgs = serverConfigs[srvId];
      let selCid = compareConfigMap[srvId];
      if (Array.isArray(cfgs) && cfgs.length > 0) {
        if (selCid) {
          let selCfg = cfgs.find(function(c) { return c.cid === selCid; });
          if (selCfg) return selCfg.gpuCount;
        }
        return cfgs[0].gpuCount;
      }
      return defaultVal;
    }
    let supernodeConfigs = Store.get('supernodeConfigs') || {};
    function getSnFirstCfg(snId, sn) {
      let cfgs = supernodeConfigs[snId];
      let selCid = compareConfigMap[snId];
      if (Array.isArray(cfgs) && cfgs.length > 0) {
        if (selCid) {
          let selCfg = cfgs.find(function(c) { return c.cid === selCid; });
          if (selCfg) return selCfg;
        }
        return cfgs[0];
      }
      return getDefaultSupernodeConfig(sn);
    }
    let powerType = Store.get('powerType') || 'FP16';
    let items = compareList.map(function (id) { return gpuData.find(function (g) { return g.id === id; }); }).filter(Boolean);
    if (items.length < 2) { document.getElementById('cmp-panel-container').innerHTML = ''; return; }

    // Detect types
    const allClasses = items.map(function (it) { return it.class || 'GPU'; });
    const uniqueClasses = [];
    allClasses.forEach(function (c) { if (uniqueClasses.indexOf(c) < 0) uniqueClasses.push(c); });
    const dominantClass = uniqueClasses.length === 1 ? uniqueClasses[0] : 'mixed';

    let specs = [];
    let title = '参数对比';

    if (dominantClass === 'GPU' || dominantClass === 'mixed') {
      title = '芯片参数对比';
      specs = [
        { label: '厂商', key: 'vendor' },
        { label: '推出年份', key: 'year' },
        { label: '产品架构', key: 'arch' },
        { label: '产品类型', key: 'type' },
        { label: '显存', key: 'vram' },
        { label: '显存带宽', key: 'bandwidth' },
        { label: 'GPU互联', key: 'interconnect' },
        { label: 'TDP', key: 'tdp' },
        { label: '算力(' + powerType + ')', fn: function (g) { let p = parseGpuPower(g.fp16, powerType); return p > 0 ? formatPerf(p) : '—'; } }
      ];
    } else if (dominantClass === '服务器') {
      title = '服务器参数对比';
      specs = [
        { label: '厂商', key: 'vendor' },
        { label: '产品架构', key: 'arch' },
        { label: '所用芯片', fn: function (s) { let chip = findChipForServer(s); return chip ? chip.name : (s.arch || '—'); } },
        { label: '默认GPU数', fn: function (s) { return parseDefaultGpuCount(s.gpu_count) + ' 卡'; } },
        { label: '当前GPU数', fn: function (s) { return getServerGpuCount(s.id, parseDefaultGpuCount(s.gpu_count)) + ' 卡'; } },
        { label: '总功率', fn: function (s) {
          let chip = findChipForServer(s);
          let tdpW = chip ? parseTdpWatts(chip.tdp) : 0;
          let cnt = getServerGpuCount(s.id, parseDefaultGpuCount(s.gpu_count));
          return tdpW > 0 ? (tdpW * cnt * 1.15 / 1000).toFixed(1) + ' kW' : '—';
        }},
        { label: '总算力(' + powerType + ')', fn: function (s) {
          let chip = findChipForServer(s);
          let perf = chip ? parseGpuPower(chip.fp16, powerType) : 0;
          let cnt = getServerGpuCount(s.id, parseDefaultGpuCount(s.gpu_count));
          return perf > 0 ? formatPerf(perf * cnt) : '—';
        }},
        { label: '机架高度', key: 'chassis' }
      ];
    } else if (dominantClass === '超节点') {
      title = '超节点参数对比';
      specs = [
        { label: '厂商', key: 'vendor' },
        { label: '产品类型', key: 'type' },
        { label: '总GPU数', key: 'gpu_count' },
        { label: '总算力(' + powerType + ')', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          let srvPerf = estimateServerPerf(sn);
          let totalPerf = srvPerf * cfg.serverCount;
          return totalPerf > 0 ? formatPerf(totalPerf) : '—';
        }},
        { label: '总功率', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          let totalPower = cfg.serverCount * (cfg.serverPower || 10) + cfg.switchCount * cfg.switchPower;
          return totalPower > 0 ? totalPower.toFixed(1) + ' kW' : '—';
        }},
        { label: '单节点机柜数', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          return cfg.cabinetCount + ' 柜';
        }},
        { label: '计算机柜数量', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          return cfg.serverCount + ' 台';
        }},
        { label: '计算机柜功率', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          return (cfg.serverPower || 10) + ' kW';
        }},
        { label: '网络机柜数量', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          return cfg.switchCount + ' 台';
        }},
        { label: '网络机柜功率', fn: function (sn) {
          let cfg = getSnFirstCfg(sn.id, sn);
          return cfg.switchPower + ' kW';
        }}
      ];
    }

    let html = '<div class="cmp-panel"><div class="cmp-panel-header"><h3>' + icon('ic-compare', 'icon-md') + ' ' + title + '</h3><span style="font-size:12px;color:var(--text3);">' + items.length + ' 项</span></div>';

    html += '<div class="cmp-grid"><div class="cmp-row" style="grid-template-columns:140px repeat(' + items.length + ', 1fr);"><div class="cmp-cell header">参数</div>';
    items.forEach(function (it) { html += '<div class="cmp-cell header" style="font-size:13px;color:var(--text);">' + escapeHtml(it.vendor) + ' ' + escapeHtml(it.name) + '</div>'; });
    html += '</div>';

    specs.forEach(function (spec) {
      html += '<div class="cmp-row" style="grid-template-columns:140px repeat(' + items.length + ', 1fr);"><div class="cmp-cell header">' + spec.label + '</div>';
      let bestIdx = -1;
      if (spec.key === 'tdp') {
        let vals = items.map(function (g) { let w = parseTdpWatts(g.tdp); return w > 0 ? w : Infinity; });
        bestIdx = vals.indexOf(Math.min.apply(null, vals));
      } else if (spec.key === 'bandwidth') {
        let vals = items.map(function (g) { return parseBandwidthGB(g.bandwidth); });
        bestIdx = vals.indexOf(Math.max.apply(null, vals));
      }
      items.forEach(function (it, i) {
        let cls = i === bestIdx && bestIdx >= 0 && items.length > 1 ? ' cmp-cell best' : 'cmp-cell';
        let display;
        if (spec.fn) {
          display = spec.fn(it);
        } else if (spec.key === 'fp16') {
          display = (it[spec.key] || '').replace(/\n/g, '<br>');
        } else {
          display = it[spec.key] || '—';
        }
        html += '<div class="' + cls + '" style="font-size:11px;">' + display + '</div>';
      });
      html += '</div>';
    });

    html += '</div></div>';
    document.getElementById('cmp-panel-container').innerHTML = html;
  }

  // [v2-优化项-3] 检查是否可以加入对比栏
  function _checkCompareAllowed(list, newType, gpuData) {
    if (list.length >= 5) {
      showToast('对比栏最多 5 项，请先移除部分项目。', 3000);
      return false;
    }
    if (list.length > 0) {
      const firstG = gpuData.find(function (d) { return d.id === list[0]; });
      if (firstG) {
        const existingType = DATA_SOURCE.typeOf(firstG);
        if (!DATA_SOURCE.canCompare(existingType, newType)) {
          const typeNames = {};
          typeNames[DATA_SOURCE.CHIP] = '芯片';
          typeNames[DATA_SOURCE.SERVER] = '服务器';
          typeNames[DATA_SOURCE.SUPERNODE] = '超节点（集群）';
          showToast('只能对比同一类型的数据（当前对比栏：' + (typeNames[existingType] || existingType) + '），请先清空对比栏。', 3500);
          return false;
        }
      }
    }
    return true;
  }

  // ---- Compare toggle (with cross-type guard) ----
  function toggleCompare(id) {
    const gpuData = Store.get('gpuData');
    const g = gpuData.find(function (d) { return d.id === id; });
    if (!g) return;
    const newType = DATA_SOURCE.typeOf(g);

    Store.update('compareList', function (list) {
      const idx = list.indexOf(id);
      if (idx >= 0) { list.splice(idx, 1); return list; }
      if (!_checkCompareAllowed(list, newType, gpuData)) return list; // [v2-优化项-3]
      list.push(id);
      return list;
    });
    Store.notify('compare');
    if (Store.get('sidebarOpen') && window.innerWidth < 1024) toggleSidebar();
  }

  // Toggle compare with specific config selection (for Server/Supernode config rows)
  function toggleCompareConfig(id, cid) {
    const gpuData = Store.get('gpuData');
    const g = gpuData.find(function (d) { return d.id === id; });
    if (!g) return;
    const newType = DATA_SOURCE.typeOf(g);
    const compareList = Store.get('compareList');
    const idx = compareList.indexOf(id);

    Store.update('compareList', function (list) {
      if (idx >= 0) { list.splice(idx, 1); return list; }
      if (!_checkCompareAllowed(list, newType, gpuData)) return list; // [v2-优化项-3]
      list.push(id);
      return list;
    });

    // Update config selection map
    Store.update('compareConfigMap', function (map) {
      map = map || {};
      let newList = Store.get('compareList');
      if (newList.indexOf(id) >= 0) {
        map[id] = cid;
      } else {
        delete map[id];
      }
      return map;
    });

    Store.notify();
    if (Store.get('sidebarOpen') && window.innerWidth < 1024) toggleSidebar();
  }

  function clearCompare() {
    Store.set('compareList', []);
    Store.set('compareConfigMap', {});
    Store.notify('compare');
  }

  // ---- Filters UI ----
  function updateFilterButtonStates() {
    let filters = Store.get('columnFilters');
    let activeFilters = Object.keys(filters).filter(function (k) {
      let f = filters[k];
      return f !== null && f !== undefined && f !== '' && !(k === 'tdp' && f.min === null && f.max === null);
    });

    document.querySelectorAll('.th-label').forEach(function (label) {
      let orig = label.getAttribute('data-label');
      if (orig && label.textContent !== orig) { label.textContent = orig; }
      label.classList.remove('filtered');
    });
    document.querySelectorAll('.col-filter-btn').forEach(function (btn) {
      btn.classList.remove('active');
      btn.title = '筛选';
    });
    document.querySelectorAll('thead th').forEach(function (th) { th.classList.remove('filtered'); });

    activeFilters.forEach(function (col) {
      let btn = document.getElementById('filter-btn-' + col);
      if (btn) { btn.classList.add('active'); btn.title = '已筛选：点击修改或清除'; }
      let th = btn ? btn.closest('th') : null;
      if (th) {
        th.classList.add('filtered');
        let labelEl = th.querySelector('.th-label');
        if (labelEl) {
          let filterVal = filters[col];
          let displayText = formatFilterDisplay(col, filterVal);
          if (displayText) {
            labelEl.textContent = displayText;
            labelEl.classList.add('filtered');
          }
        }
      }
    });

    let info = document.getElementById('table-info');
    if (info && activeFilters.length > 0) {
      info.textContent = activeFilters.length + ' 项筛选活跃';
      info.style.color = 'var(--accent)';
    } else if (info) {
      info.style.color = '';
    }
  }

  function formatFilterDisplay(col, val) {
    if (col === 'tdp') {
      if (val.min !== null && val.max !== null) return val.min + '–' + val.max + 'W';
      if (val.min !== null) return '≥' + val.min + 'W';
      if (val.max !== null) return '≤' + val.max + 'W';
      return null;
    }
    return String(val);
  }

  function toggleColFilter(col) {
    let existing = document.querySelector('.col-filter-dropdown.show');
    if (existing) {
      let existingCol = existing.getAttribute('data-colfilter');
      closeAllFilterDropdowns();
      if (existingCol === col) return;
    }
    renderColFilterDropdown(col);
    let dd = document.getElementById('col-filter-dd-' + col);
    if (dd) {
      let btn = document.getElementById('filter-btn-' + col);
      if (!btn) return;
      let rect = btn.getBoundingClientRect();
      let ddW = 220;
      let left = rect.left;
      let top = rect.bottom + 4;
      if (left + ddW > window.innerWidth - 8) { left = Math.max(8, window.innerWidth - ddW - 8); }
      dd.style.left = left + 'px';
      dd.style.top = top + 'px';
      setTimeout(function () { dd.classList.add('show'); }, 10);
      setTimeout(function () {
        let inp = dd.querySelector('.filter-input');
        if (inp) { inp.focus(); inp.select(); }
      }, 150);
    }
  }

  function renderColFilterDropdown(col) {
    let btn = document.getElementById('filter-btn-' + col);
    if (!btn) return;
    let th = btn.closest('th');
    if (!th) return;
    let dd = document.createElement('div');
    dd.className = 'col-filter-dropdown';
    dd.id = 'col-filter-dd-' + col;
    dd.setAttribute('data-colfilter', col);
    let filters = Store.get('columnFilters');
    let filterVal = filters[col] || null;

    if (col === 'tdp') {
      let minVal = (filterVal && filterVal.min !== null) ? filterVal.min : '';
      let maxVal = (filterVal && filterVal.max !== null) ? filterVal.max : '';

  function togglePowerTypeDropdown(e) {

    if (existing) { existing.remove(); return; }
    renderPowerTypeDropdown();
    let dd = document.getElementById('power-type-dd');
    if (!dd) return;

    if (!label) label = document.getElementById('power-type-label');
    if (!label) return;
    let rect = label.getBoundingClientRect();
    dd.style.left = Math.max(8, rect.left) + 'px';
    dd.style.top = (rect.bottom + 4) + 'px';
    setTimeout(function () { dd.classList.add('show'); }, 10);

  function renderPowerTypeDropdown() {
    let existing = document.getElementById('power-type-dd');

    let dd = document.createElement('div');
    dd.className = 'power-type-dropdown';
    dd.id = 'power-type-dd';
    let currentType = Store.get('powerType') || 'FP16';
    ['FP8', 'FP16', 'FP32', 'FP64'].forEach(function (t) {
      let opt = document.createElement('button');
      opt.className = 'pt-option' + (t === currentType ? ' active' : '');

        ev.stopPropagation();

  function updateConnectionBadge() {
    let badge = document.getElementById('gpu-count');
    let text = document.getElementById('gpu-count-text');
    let gpuData = Store.get('gpuData');
    if (text) {
      let gpuCount = gpuData.filter(function(g) { return (g.class || 'GPU') === 'GPU'; }).length;
      let serverCount = gpuData.filter(function(g) { return g.class === '服务器'; }).length;
      let superpodCount = gpuData.filter(function(g) { return g.class === '超节点'; }).length;
      let parts = [];
      if (gpuCount > 0) parts.push(gpuCount + ' GPU');
      if (serverCount > 0) parts.push(serverCount + ' 服务器');
      if (superpodCount > 0) parts.push(superpodCount + ' 超节点');
      text.textContent = parts.length > 0 ? parts.join(' · ') : '0 GPU';
    }
    if (!badge) return;
    if (API.isConfigured() && Store.get('realtimeChannel')) {
      badge.className = 'live-badge';
      badge.title = '实时连接中';
    } else if (API.isConfigured() && Store.get('pollingTimer')) {
      badge.className = 'live-badge';
      badge.title = '轮询模式';
    } else if (API.isConfigured()) {
      badge.className = 'live-badge';
      badge.title = '已连接';
    } else {
      badge.className = 'live-badge offline';
      badge.title = '未连接云端';
    }
  }

  function updateUnlockButton() {
    let btn = document.getElementById('unlock-btn');
    if (!btn) return;
    let isUnlocked = Store.get('isUnlocked');
    if (isUnlocked) {

      btn.className = 'btn btn-outline btn-sm';

  function refresh() {
    let filtered = getFilteredData();
    // Apply persisted sort
    const sortCol = Store.get('sortCol');
    const sortDir = Store.get('sortDir');
    if (sortCol) {
      filtered = filtered.slice().sort(function (a, b) {
        let va = a[sortCol] || '', vb = b[sortCol] || '';
        if (sortCol === 'tdp') { va = parseTdpWatts(va); vb = parseTdpWatts(vb); }
        else if (sortCol === 'bandwidth') { va = parseBandwidthGB(va); vb = parseBandwidthGB(vb); }
        else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
        if (va < vb) return -1 * sortDir;
        if (va > vb) return 1 * sortDir;
        return 0;
      });
    }
    // Update sort arrows and sorted class
    document.querySelectorAll('.sort-arrow').forEach(function (el) { el.textContent = ''; el.classList.remove('active'); });
    document.querySelectorAll('.th-label').forEach(function (el) { el.classList.remove('sorted'); });
    if (sortCol) {
      const arrow = document.getElementById('sort-' + sortCol);
      if (arrow) { arrow.textContent = sortDir === 1 ? '▲' : '▼'; arrow.classList.add('active'); }
      const label = document.querySelector(`[data-sort="${sortCol}"]`);
      if (label) label.classList.add('sorted');
    }
    // Render based on current view
    const currentView = Store.get('currentView');
    const chipVendorFilter = Store.get('chipVendorFilter');
    document.getElementById('card-grid').innerHTML = '';

    if (currentView === 'detail') {
      renderDetailView(filtered);
    } else {
      hideDetailTabs();
      if (currentView === 'chip') {
      if (chipVendorFilter) {
        if (chipVendorFilter === 'china') {
          filtered = filtered.filter(function (g) { return g.category === 'china'; });
        } else {
          filtered = filtered.filter(function (g) { return g.category === chipVendorFilter && g.category !== 'china'; });
        }
      }
      const chipData = filtered.filter(function (g) { return (g.class || 'GPU') === 'GPU'; });
      document.getElementById('table-container').innerHTML = '<table id="main-table">' + renderChipTableHeader() + '<tbody id="table-body"></tbody></table>';
      renderChipView(chipData);
    } else if (currentView === 'server') {
      const serverData = filtered.filter(function (g) { return g.class === '服务器'; });
      renderServerTableView(serverData);
    } else if (currentView === 'supernode') {
      const snData = filtered.filter(function (g) { return g.class === '超节点'; });
      renderSupernodeTableView(snData);
    }
    }
    renderSidebar();
    updateCompareBar();
    updateConnectionBadge();
    updateFilterButtonStates();
    updatePowerTypeToggleUI();
    updateUnlockButton();
    updateAddButtonVisibility();
    updateMobileTabs();
    if (Store.get('compareList').length >= 2) renderComparePanel();
    else document.getElementById('cmp-panel-container').innerHTML = '';
    Store.saveViewState();
  }

  // Ensure config object has all expected fields (defense against undefined)
  function sanitizeServerConfig(cfg, srv) {
    return {
      cid: cfg.cid || 'c_default',
      name: cfg.name || '默认配置',
      gpuCount: (typeof cfg.gpuCount === 'number' && cfg.gpuCount > 0) ? cfg.gpuCount : parseDefaultGpuCount(srv.gpu_count),
      chassis: cfg.chassis || srv.chassis || ''
    };

  function sanitizeSupernodeConfig(cfg, sn) {

    return {
      cid: cfg.cid || 'c_default',
      name: cfg.name || '默认配置',
      cabinetCount: (typeof cfg.cabinetCount === 'number' && cfg.cabinetCount > 0) ? cfg.cabinetCount : defCfg.cabinetCount,

  // 增量更新单个 GPU 的 DOM，不重绘整个页面
  function patchSingleGPU(g) {
    // If not in detail view, just do a full refresh for safety
    const currentView = Store.get('currentView');
    if (currentView !== 'detail') {
      refresh();
      return;
    }
    // Table row
    const tr = document.querySelector('#table-body tr[data-id="' + g.id + '"]');
    if (tr) tr.outerHTML = renderSingleRow(g);
    // Card
    const card = document.querySelector('#card-grid .gpu-card[data-id="' + g.id + '"]');
    if (card) card.outerHTML = renderSingleCard(g);
    // Sidebar item
    const sideItem = document.querySelector('#sidebar .gpu-item[data-id="' + g.id + '"]');
    if (sideItem) {
      const nameEl = sideItem.querySelector('.item-name');
      if (nameEl) nameEl.textContent = g.name;
    }
    // Compare panel (if this GPU is being compared)
    const cmpList = Store.get('compareList');
    if (cmpList.length >= 2 && cmpList.includes(g.id)) renderComparePanel();
    updateCompareBar();
  }

  function updateMobileTabs() {
    const currentView = Store.get('currentView');
    const viewToTab = { detail: 'all', chip: 'gpu', server: 'server', supernode: 'superpod' };
    const activeTabId = 'm-tab-' + (viewToTab[currentView] || 'all');
    ['all', 'server', 'gpu', 'superpod'].forEach(function (v) {
      let btn = document.getElementById('m-tab-' + v);
      if (!btn) return;
      if (activeTabId === 'm-tab-' + v) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  // Helper functions for modal detail
  function getVendorTag(g) {
    let cat = g.category || '';
    if (cat === 'amd') return '<span class="tag tag-amd">AMD</span>';
    if (cat === 'intel') return '<span class="tag tag-intel">Intel</span>';
    if (cat === 'other') return '<span class="tag tag-other">' + escapeHtml(g.vendor) + '</span>';
    if (cat === 'nvidia' || g.vendor === 'NVIDIA') return '<span class="tag tag-nvidia">NVIDIA</span>';
    return '<span class="tag tag-china">' + escapeHtml(g.vendor) + '</span>';
  }

  function parseBandwidthGB(bw) {
    let m = (bw || '').match(/([\d.]+)(TB|GB)/);
    return m ? (m[2] === 'TB' ? parseFloat(m[1]) * 1000 : parseFloat(m[1])) : 0;
  }

  function parseFp16T(fp16) {
    let m = (fp16 || '').match(/FP16[：:]\s*([\d.]+)T/);
    return m ? parseFloat(m[1]) : 0;
  }

  function parseTdpWatts(tdp) {
    const s = String(tdp || '').replace(/^~/, '').trim();
    if (s === '—' || s === '') return 0;
    const isKw = /kw/i.test(s);
    const m = s.match(/([\d.]+)/);
    if (!m) return 0;
    return isKw ? parseFloat(m[1]) * 1000 : parseFloat(m[1]);
  }

  function renderActionButtons(id, inCmp) {
    return '<button class="btn-cmp-only" data-action="toggle-compare" data-id="' + id + '" title="' + (inCmp ? '移出对比' : '加入对比') + '">' + (inCmp ? '−' : '+') + '</button>';
  }

  function focusInput(selector, delay) {
    setTimeout(function () { let el = document.getElementById(selector); if (el) el.focus(); }, delay || 150);

// ==================== App 模块（协调层 + 事件委托） ====================
const App = (() => {

  async function init() {
    Store.loadConfig();
    Store.loadViewState();

    // 立即渲染缓存数据或默认数据，不等待云端响应
    var cached = API.loadCachedGpuData();
    if (cached && cached.length > 0) {
      Store.setSilent('gpuData', cached);
    } else {
      Store.setSilent('gpuData', API.cleanGpuFields(structuredClone(DEFAULT_DATA)));
    }
    Store.setSilent('loading', false);

    // 立即隐藏加载遮罩 — 用户无需等待网络
    document.getElementById('loading-overlay').classList.add('hidden');

    // 异步从云端拉取最新数据（不阻塞 UI 渲染）
    API.loadAll();

    // 密码不再从云端读取，改为 RPC 验证

    // Subscribe to Store changes for auto-refresh
    Store.subscribe(function (hint) {
      if (hint === 'compare') {
        UI.refresh();
      } else if (hint === 'unlock') {
        UI.updateUnlockButton();
      } else {
        UI.refresh();
      }
      // 重置解锁超时计时器（任何操作都续期）
      resetUnlockTimer();
    });

    // 解锁状态仅存 sessionStorage，刷新即失效；30 分钟无操作自动锁定
    function resetUnlockTimer() {
      if (!Store.get('isUnlocked')) return;
      clearTimeout(window.__unlockTimer);
      window.__unlockTimer = setTimeout(function () {
        Store.set('isUnlocked', false);
        Store.notify();
        UI.showToast('编辑已超时锁定（30 分钟无操作）');
      }, 30 * 60 * 1000);
    }

    // Initial render
    Store.notify();

    if (!API.isConfigured()) {
      document.getElementById('setup-banner').classList.add('show');
    }

    // Event delegation
    bindGlobalEvents();
    bindKeyboardShortcuts();

    // Search input — 密码/配置 触发词仅在解锁后生效
    const debouncedNotify = UI.debounce(function () { Store.notify(); }, 180);
    document.getElementById('search-input').addEventListener('input', function () {
      let val = this.value.trim();
      let unlocked = Store.get('isUnlocked');
      if (val === '密码' && unlocked) {
        this.value = '';
        Store.notify();
        UI.showChangePasswordModal();
        return;
      }
      if (val === '配置' && unlocked) {
        this.value = '';
        Store.notify();
        UI.showSetupModal();
        return;
      }
      debouncedNotify();
    });

    // Scroll to top button + sticky header ambient shadow
    let mainEl = document.querySelector('.main');
    mainEl.addEventListener('scroll', function () {
      document.getElementById('scroll-top-btn').classList.toggle('show', mainEl.scrollTop > 300);
      mainEl.classList.toggle('scrolled', mainEl.scrollTop > 4);
    });
    window.addEventListener('scroll', function () {
      document.getElementById('scroll-top-btn').classList.toggle('show', window.scrollY > 300);
    });

    // Responsive sidebar
    window.matchMedia('(min-width: 1024px)').addEventListener('change', function () {
      if (window.matchMedia('(min-width: 1024px)').matches && Store.get('sidebarOpen')) {
        UI.toggleSidebar();
      }
    });

    // Setup banner click
    document.getElementById('setup-banner').addEventListener('click', function () {
      requirePassword(function () { UI.showSetupModal(); });
    });

    // Global click to close dropdowns
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.dropdown')) {
        document.getElementById('export-menu').classList.remove('show');
      }
      if (!e.target.closest('.col-filter-btn') && !e.target.closest('.col-filter-dropdown')) {
        UI.closeAllFilterDropdowns();
      }
      if (!e.target.closest('.th-label-power') && !e.target.closest('.power-type-dropdown')) {
        UI.closePowerTypeDropdown();
      }
    });

    // Scroll to close filter/power-type dropdowns
    document.addEventListener('scroll', function () {
      if (document.querySelector('.col-filter-dropdown.show')) UI.closeAllFilterDropdowns();
      if (document.querySelector('.power-type-dropdown.show')) UI.closePowerTypeDropdown();
    }, true);

    // 60s polling as fallback
    setInterval(async function () {
      if (!Store.get('realtimeChannel')) {
        await API.pollSilent();
      }
    }, 60000);

    API.subscribeRealtime();

    // Cleanup on page leave
    window.addEventListener('beforeunload', function () {
      API.stopPolling();
    });
  }

  function bindGlobalEvents() {
    document.body.addEventListener('click', function (e) {
      let el = e.target.closest('[data-action]');
      if (!el) return;
      let action = el.dataset.action;
      let id = el.dataset.id ? parseInt(el.dataset.id) : null;
      let col = el.dataset.col;
      let val = el.dataset.val;
      let filterVal = el.dataset.filterVal;

      e.stopPropagation();

      switch (action) {
        case 'toggle-sidebar': UI.toggleSidebar(); break;
        case 'show-detail': if (id) UI.showDetail(id); break;
        case 'toggle-compare': if (id) UI.toggleCompare(id); break;
        case 'toggle-compare-config':
          let cmpCid = el.dataset.cid;
          if (id && cmpCid) UI.toggleCompareConfig(id, cmpCid);
          break;
        case 'toggle-side-section':
          let header = el.closest('.side-section').querySelector('.side-header');
          let body = el.closest('.side-section').querySelector('.side-body');
          header.classList.toggle('collapsed');
          body.classList.toggle('collapsed');
          break;
        case 'show-setup': requirePassword(function () { UI.showSetupModal(); }); break;
        case 'show-add-gpu': requirePassword(function () { UI.showAddGPUModal(); }); break;
        case 'toggle-edit': toggleEditMode(); break;
        case 'show-password': showPasswordPrompt(); break;
        case 'change-password': UI.showChangePasswordModal(); break;
        case 'submit-change-password': submitChangePassword(); break;
        case 'toggle-export-menu':
          document.getElementById('export-menu').classList.toggle('show');
          break;
        case 'export-json': exportJSON(); break;
        case 'export-csv': exportCSV(); break;
        case 'sync-cloud': syncFromSupabase(); break;
        case 'reset-data': requirePassword(resetData); break;
        case 'clear-compare': UI.clearCompare(); break;
        case 'switch-view': if (el.dataset.view) switchView(el.dataset.view); break;
        case 'toggle-power-type':
          UI.togglePowerTypeDropdown(e);
          break;
        case 'set-chip-filter': setChipFilter(val || null); break;
        case 'toggle-supernode': if (id) toggleSupernodeCollapse(id); break;
        case 'scroll-to-server': if (id) scrollToServerCard(id); break;
        case 'scroll-to-supernode': if (id) scrollToSupernodeBlock(id); break;
        case 'scroll-top': window.scrollTo({ top: 0, behavior: 'smooth' }); break;
        case 'close-modal':
          // el is the closest element with data-action="close-modal"
          // Only close if: clicking the overlay itself, OR clicking a close button (not overlay)
          if (el.classList.contains('modal-overlay') && e.target !== el && !e.target.closest('.modal-close')) return;
          UI.closeModal();
          break;
        case 'delete-gpu': if (id) deleteGPU(id); break;
        case 'save-config': saveConfig(); break;
        case 'submit-add-gpu': submitAddGPU(); break;
        case 'verify-password': verifyPassword(); break;

        case 'sort-table': if (el.dataset.sort) UI.sortTable(el.dataset.sort); break;
        case 'toggle-col-filter': if (col) UI.toggleColFilter(col); break;
        case 'filter-all': clearAllFilters(); break;
        case 'filter-class':
          if (filterVal) {
            Store.update('columnFilters', function (f) { f.class = filterVal; return f; });
            Store.notify();
          }
          break;
        case 'scroll-compare':
          let panel = document.getElementById('cmp-panel-container');
          if (panel) panel.scrollIntoView({ behavior: 'smooth' });
          break;
        case 'switch-detail-tab': if (val) switchDetailTab(val); break;
        case 'toggle-server-expand': if (id) UI.toggleServerExpand(id); break;
        case 'toggle-supernode-expand': if (id) UI.toggleSupernodeExpand(id); break;
        case 'add-server-config': if (id) showAddServerConfigModal(id); break;
        case 'edit-server-config': if (id && el.dataset.cid) showEditServerConfigModal(id, el.dataset.cid); break;
        case 'delete-server-config': if (id && el.dataset.cid) deleteServerConfig(id, el.dataset.cid); break;
        case 'save-server-config':
          let parentId = el.dataset.parent ? parseInt(el.dataset.parent) : null;
          let scid = el.dataset.cid;
          if (parentId) saveServerConfig(parentId, scid);
          break;
        case 'add-supernode-config': if (id) showAddSupernodeConfigModal(id); break;
        case 'edit-supernode-config': if (id && el.dataset.cid) showEditSupernodeConfigModal(id, el.dataset.cid); break;
        case 'delete-supernode-config': if (id && el.dataset.cid) deleteSupernodeConfig(id, el.dataset.cid); break;
        case 'save-supernode-config':
          let snParentId = el.dataset.parent ? parseInt(el.dataset.parent) : null;
          let sncid = el.dataset.cid;
          if (snParentId) saveSupernodeConfig(snParentId, sncid);
          break;
        case 'focus-search': document.getElementById('search-input').focus(); break;
        case 'apply-col-filter':
          if (col && val) applyColFilter(col, val);
          break;
        case 'apply-text-filter':
          if (col) {
            let inp = document.getElementById('filter-input-' + col);
            applyColFilter(col, inp ? inp.value : '');
          }
          break;
        case 'apply-range-filter':
          if (col) applyColFilterRange(col);
          break;
        case 'clear-col-filter':
          if (col) clearColFilter(col);
          break;
      }
    });
  }

  function bindKeyboardShortcuts() {
    document.addEventListener('keydown', function (e) {
      // Ctrl+K / Cmd+K: focus search
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
      // Escape: close modals and dropdowns
      if (e.key === 'Escape') {
        UI.closeModal();
        UI.closeAllFilterDropdowns();
        UI.closePowerTypeDropdown();
        document.getElementById('export-menu').classList.remove('show');
        // 清除所有密码输入框
        document.querySelectorAll('input[type="password"]').forEach(function (el) { el.value = ''; });
      }
    });
  }

  // ---- Password helpers ----
  function requirePassword(callback) {
    if (Store.get('isUnlocked')) {
      callback();
      return;
    }
    UI.showPasswordModal(callback);
  }
  window.requirePassword = requirePassword;

  function showPasswordPrompt() {
    if (Store.get('isUnlocked')) {
      // Already unlocked — lock it
      Store.set('isUnlocked', false);
      Store.notify();
      UI.showToast('已锁定');
    } else {
      UI.showPasswordModal(function () {
        Store.notify();
        UI.showToast('可以修改数据了');
      });
    }
  }

  // 密码验证频率限制：3 秒内最多 1 次
    var _lastVerifyAttempt = 0;
    var _verifyFailCount = 0;
  async function verifyPassword() {
    var now = Date.now();
    if (now - _lastVerifyAttempt < 3000) { showPasswordError('请稍后再试'); return; }
    if (_verifyFailCount >= 5) { showPasswordError('错误次数过多，请 1 分钟后再试'); return; }
    _lastVerifyAttempt = now;

    let input = document.getElementById('edit-password-input');
    let password = input ? input.value : '';
    if (!password) {
      showPasswordError('请输入密码');
      return;
    }
    let ok = await API.verifyPasswordRPC(password);
    if (ok) {
      _verifyFailCount = 0;
      Store.set('isUnlocked', true);
      input.value = '';
      UI.closeModal();
      Store.notify();
      UI.showToast('密码正确，已解锁编辑');
      resetUnlockTimer();
      let cb = window.__pwCallback;
      window.__pwCallback = null;
      setTimeout(function () { if (cb) cb(); }, 300);
    } else {
      _verifyFailCount++;
      if (_verifyFailCount >= 5) {
        showPasswordError('错误次数过多，已锁定 1 分钟');
        setTimeout(function () { _verifyFailCount = 0; }, 60000);
      } else {
        showPasswordError('密码错误，请重试（剩余 ' + (5 - _verifyFailCount) + ' 次）');
      }
    }
  }

  async function submitChangePassword() {
    let oldInput = document.getElementById('old-password-input');
    let oldPw = oldInput ? oldInput.value.trim() : '';
    if (oldPw.length < 4) {
      let err = document.getElementById('chpw-error-msg');
      if (err) { err.textContent = '旧密码至少4位'; err.classList.add('show'); }
      return;
    }
    let input = document.getElementById('new-password-input');
    let newPw = input ? input.value.trim() : '';
    if (newPw.length < 4) {
      let err = document.getElementById('chpw-error-msg');
      if (err) { err.textContent = '新密码至少4位'; err.classList.add('show'); }
      return;
    }
    if (!API.isConfigured()) {
      UI.showToast('请先配置 Supabase 连接');
      return;
    }
    let ok = await API.changePasswordRPC(oldPw, newPw);
    if (ok) {
      Store.set('isUnlocked', true);
      UI.closeModal();
      UI.showToast('密码已修改');
      Store.notify();
    } else {
      let err = document.getElementById('chpw-error-msg');
      if (err) { err.textContent = '旧密码错误，修改失败'; err.classList.add('show'); }
    }
  }

  function showPasswordError(msg) {
    let err = document.getElementById('pw-error-msg');
    if (err) { err.textContent = msg; err.classList.add('show'); }
    setTimeout(function () {
      let e = document.getElementById('pw-error-msg');
      if (e) e.classList.remove('show');
    }, 3000);
  }

  // ---- Config ----
  async function saveConfig() {
    let url = document.getElementById('setup-url').value.trim();
    let key = document.getElementById('setup-key').value.trim();
    // 校验 URL 格式，防止指向恶意服务器
    try {
      var parsedUrl = new URL(url);
      if (parsedUrl.protocol !== 'https:') throw new Error();
      if (!/\.supabase\.co$/.test(parsedUrl.hostname) && !/\.supabase\.com$/.test(parsedUrl.hostname)) {
        throw new Error('仅支持 supabase.co 或 supabase.com 域名');
      }
    } catch (e) {
      UI.showToast('无效的 Supabase URL，请使用 https://xxxxx.supabase.co 格式');
      return;
    }
    // 清理输入：去除前后空白，拒绝空值
    if (!url || !key) { UI.showToast('URL 和 anon key 不能为空'); return; }
    if (key.length < 20) { UI.showToast('anon key 格式不正确'); return; }
    Store.set('supabaseConfig', { url: url, anonKey: key });
    Store.saveConfig();
    Store.set('supabaseClient', null);
    Store.set('realtimeChannel', null);
    API.stopPolling();
    UI.closeModal();
    await API.loadAll();
    Store.notify();
    if (API.isConfigured()) {
      document.getElementById('setup-banner').classList.remove('show');
      API.subscribeRealtime();
      UI.showToast('已连接云端 (' + Store.get('gpuData').length + ' 条数据)');
    }
  }

  // ---- Filters ----
  function applyColFilter(col, val) {
    if (!val) { clearColFilter(col); return; }
    Store.update('columnFilters', function (f) { f[col] = val; return f; });
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  function applyColFilterRange(col) {
    let minEl = document.getElementById(col + '-min');
    let maxEl = document.getElementById(col + '-max');
    let minV = minEl ? parseFloat(minEl.value) : NaN;
    let maxV = maxEl ? parseFloat(maxEl.value) : NaN;
    if (isNaN(minV) && isNaN(maxV)) { clearColFilter(col); return; }
    Store.update('columnFilters', function (f) {
      f[col] = { min: isNaN(minV) ? null : minV, max: isNaN(maxV) ? null : maxV };
      return f;
    });
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  function clearColFilter(col) {
    Store.update('columnFilters', function (f) { delete f[col]; return f; });
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  function clearAllFilters() {
    Store.set('columnFilters', {});
    document.getElementById('search-input').value = '';
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

    Store.update('editMode', function (v) { return !v; });

    let btn = document.getElementById('edit-btn');
    let indicator = document.getElementById('edit-indicator');
    if (editMode) {
      btn.innerHTML = UI.icon('ic-check', 'icon-sm') + ' 退出编辑';
      btn.className = 'btn btn-primary btn-sm';
      indicator.classList.add('on');

      btn.innerHTML = UI.icon('ic-edit', 'icon-sm') + ' 编辑';
      btn.className = 'btn btn-outline btn-sm';
      indicator.classList.remove('on');
    }
    Store.notify();
    UI.showToast(editMode ? '编辑模式已开启 — 可修改 GPU 数据' : '编辑模式已关闭');

  function saveServerConfig(parentId, cid) {
    let nameEl = document.getElementById('cfg-name');
    let gpuCountEl = document.getElementById('cfg-gpu-count');
    let chassisEl = document.getElementById('cfg-chassis');
    if (!gpuCountEl) return;
    let cfgObj = {
      name: nameEl ? nameEl.value.trim() || '未命名配置' : '未命名配置',
      gpuCount: parseInt(gpuCountEl.value) || 1,
      chassis: chassisEl ? chassisEl.value.trim() : ''
    };
    Store.update('serverConfigs', function (sc) {
      sc = sc || {};
      if (!Array.isArray(sc[parentId])) sc[parentId] = [];
      if (cid === 'new') {
        cfgObj.cid = 'c_' + Date.now();
        sc[parentId].push(cfgObj);
      } else {
        let idx = sc[parentId].findIndex(function (c) { return c.cid === cid; });
        if (idx >= 0) {
          cfgObj.cid = cid;
          sc[parentId][idx] = cfgObj;
        }
      }
      return sc;
    });
    // Persist configs to Supabase as JSON
    let configs = (Store.get('serverConfigs') || {})[parentId] || [];
    _persistConfigs(parentId, configs); // [v2-优化项-4]
    UI.closeModal();
    Store.notify();
    UI.showToast('配置已保存');
  }

  function _deleteConfig(storeKey, parentId, cid) { // [v2-优化项-5]
    UI.showConfirm('删除配置', '确定要删除此配置吗？此操作不可撤销。', function () {
      Store.update(storeKey, function (sc) {
        sc = sc || {};
        if (Array.isArray(sc[parentId])) {
          sc[parentId] = sc[parentId].filter(function (c) { return c.cid !== cid; });
        }
        return sc;
      });
      const configs = (Store.get(storeKey) || {})[parentId] || [];
      _persistConfigs(parentId, configs);
      Store.notify();
      UI.showToast('配置已删除');
    });
  }

  function deleteServerConfig(parentId, cid) { _deleteConfig('serverConfigs', parentId, cid); } // [v2-优化项-5]

  // ---- Supernode Config CRUD (Inline Panel) ----

    if (!sn) return;

      + '</div>'
