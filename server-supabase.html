      + '</div>'
      + '<div class="modal-footer"><button class="btn btn-outline flex-1" data-action="close-modal">取消</button><button class="btn btn-primary flex-1" data-action="save-supernode-config" data-parent="' + parentId + '" data-cid="new">保存</button></div>';
    document.getElementById('modal-root').innerHTML = UI.buildModal(
      '<h2>' + UI.icon('ic-plus', 'icon-lg') + ' 添加配置 — ' + UI.escapeHtml(sn.name) + '</h2>', body, 520
    );
    UI.focusInput('cfg-name');
  }

  function showEditSupernodeConfigModal(parentId, cid) {
    let sn = Store.get('gpuData').find(function (d) { return d.id === parentId; });
    if (!sn) return;
    let configs = (Store.get('supernodeConfigs') || {})[parentId] || [];
    let cfg = configs.find(function (c) { return c.cid === cid; });
    if (!cfg) return;
    let defCfg = UI.getDefaultSupernodeConfig(sn);
    let safeName = cfg.name || '默认配置';
    let safeCabinets = (typeof cfg.cabinetCount === 'number' && cfg.cabinetCount > 0) ? cfg.cabinetCount : defCfg.cabinetCount;
    let safeServers = (typeof cfg.serverCount === 'number' && cfg.serverCount > 0) ? cfg.serverCount : defCfg.serverCount;
    let safeServerPower = (typeof cfg.serverPower === 'number' && cfg.serverPower > 0) ? cfg.serverPower : (defCfg.serverPower || 10);
    let safeSwitches = (typeof cfg.switchCount === 'number' && cfg.switchCount >= 0) ? cfg.switchCount : defCfg.switchCount;
    let safeSwitchPower = (typeof cfg.switchPower === 'number' && cfg.switchPower >= 0) ? cfg.switchPower : (defCfg.switchPower || 2);
    let body = '<div style="display:grid;gap:12px;">'
      + '<div><label class="field-label">配置名称</label><input type="text" id="cfg-name" value="' + UI.escapeHtml(safeName) + '" class="field-input"></div>'
      + '<div class="grid-2col">'
      + '<div><label class="field-label">单节点机柜数量</label><input type="number" id="cfg-cabinet-count" value="' + safeCabinets + '" min="1" class="field-input"></div>'
      + '<div><label class="field-label">计算机柜数量</label><input type="number" id="cfg-server-count" value="' + safeServers + '" min="1" class="field-input"></div>'
      + '</div>'
      + '<div class="grid-2col">'
      + '<div><label class="field-label">计算机柜功率 (kW)</label><input type="number" id="cfg-server-power" value="' + safeServerPower + '" min="0" step="0.5" class="field-input"></div>'
      + '<div><label class="field-label">网络机柜数量</label><input type="number" id="cfg-switch-count" value="' + safeSwitches + '" min="0" class="field-input"></div>'
      + '</div>'
      + '<div><label class="field-label">网络机柜功率 (kW)</label><input type="number" id="cfg-switch-power" value="' + safeSwitchPower + '" min="0" step="0.5" class="field-input"></div>'
      + '</div>'
      + '<div class="modal-footer"><button class="btn btn-outline flex-1" data-action="close-modal">取消</button><button class="btn btn-primary flex-1" data-action="save-supernode-config" data-parent="' + parentId + '" data-cid="' + cid + '">保存</button></div>';
    document.getElementById('modal-root').innerHTML = UI.buildModal(
      '<h2>' + UI.icon('ic-edit', 'icon-lg') + ' 编辑配置 — ' + UI.escapeHtml(sn.name) + '</h2>', body, 520
    );
    UI.focusInput('cfg-name');
  }

  function saveSupernodeConfig(parentId, cid) {
    let nameEl = document.getElementById('cfg-name');
    let cabinetCountEl = document.getElementById('cfg-cabinet-count');
    let serverCountEl = document.getElementById('cfg-server-count');
    let serverPowerEl = document.getElementById('cfg-server-power');
    let switchCountEl = document.getElementById('cfg-switch-count');
    let switchPowerEl = document.getElementById('cfg-switch-power');
    if (!cabinetCountEl) return;
    let cfgObj = {
      name: nameEl ? nameEl.value.trim() || '未命名配置' : '未命名配置',
      cabinetCount: parseInt(cabinetCountEl.value) || 1,
      serverCount: parseInt(serverCountEl.value) || 1,
      serverPower: parseFloat(serverPowerEl && serverPowerEl.value) || 10,
      switchCount: parseInt(switchCountEl.value) || 0,
      switchPower: parseFloat(switchPowerEl.value) || 0
    };
    Store.update('supernodeConfigs', function (sc) {
      sc = sc || {};
      if (!Array.isArray(sc[parentId])) sc[parentId] = [];
      if (cid === 'new') {
        cfgObj.cid = 'c_' + Date.now();
        sc[parentId].push(cfgObj);
      } else {
        let idx = sc[parentId].findIndex(function (c) { return c.cid === cid; });
        if (idx >= 0) {
          cfgObj.cid = cid;
          sc[parentId][idx] = cfgObj;
        }
      }
      return sc;
    });
    let configs = (Store.get('supernodeConfigs') || {})[parentId] || [];
    _persistConfigs(parentId, configs); // [v2-优化项-4]
    UI.closeModal();
    Store.notify();
    UI.showToast('配置已保存');
  }

  function deleteSupernodeConfig(parentId, cid) { _deleteConfig('supernodeConfigs', parentId, cid); } // [v2-优化项-5]

  async function deleteGPU(id) {
    let g = Store.get('gpuData').find(function (d) { return d.id === id; });
    if (!g) return;
    UI.showConfirm('删除数据', '确定删除 ' + g.vendor + ' ' + g.name + ' 吗？', async function () {
      Store.update('compareList', function (list) {
        let idx = list.indexOf(id);
        if (idx >= 0) list.splice(idx, 1);
        return list;
      });
      await API.deleteOne(id);
      UI.closeModal();
      Store.notify();
      UI.showToast('已删除 ' + g.name);
    });
  }

  // ---- Export ----
  function exportJSON() {
    let blob = new Blob([JSON.stringify(Store.get('gpuData'), null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'gpu-server-data.json');
    UI.showToast('已导出 JSON');
  }

  function exportCSV() {
    function csvEscape(val) {
      const s = String(val);
      if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }
    let headers = ['厂商', 'GPU型号', '产品架构', '产品类型', '显存', '显存带宽', 'GPU互联', 'TDP', '单卡算力FP16', '整机GPU数量', '机架高度'];
    let rows = Store.get('gpuData').map(function (g) {
      return [g.vendor, g.name, g.arch, g.type, g.vram, g.bandwidth, g.interconnect, g.tdp, g.fp16.replace(/\n/g, ' | '), g.gpu_count || '', g.chassis || ''];
    });
    let csv = [headers.map(csvEscape).join(','), rows.map(function (r) { return r.map(csvEscape).join(','); })].join('\n');
    let blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, 'gpu-server-data.csv');
    UI.showToast('已导出 CSV');
  }

  function downloadBlob(blob, filename) {
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function syncFromSupabase() {
    if (!API.isConfigured()) { UI.showToast('请先配置 Supabase 连接'); return; }
    await API.loadAll();
    Store.notify();
    UI.showToast('已从云端刷新 (' + Store.get('gpuData').length + ' 条)');
  }

  async function resetData() {
    UI.showConfirm('恢复默认数据', '确定恢复为默认数据吗？所有修改将丢失。', async function () {
      await API.resetAll();
      Store.set('compareList', []);
      Store.set('editMode', false);
      Store.set('columnFilters', {});
      document.getElementById('search-input').value = '';
      Store.notify();
      UI.showToast('已恢复默认数据');
    });
  }

  function switchView(view) {
    Store.set('currentView', view);
    if (view === 'detail') Store.set('detailTab', 'chip');
    Store.set('chipVendorFilter', null);
    Store.update('columnFilters', function (f) { delete f.class; return f; });
    Store.notify();
    UI.closeAllFilterDropdowns();
  }

  function switchDetailTab(tab) {
    Store.set('detailTab', tab);
    Store.notify();
  }

  function setChipFilter(val) {
    Store.set('chipVendorFilter', val || null);
    Store.notify();
  }

  function updateServerGpuCount(serverId, count) {
    if (isNaN(count) || count < 1) count = 1;
    Store.update('serverConfigs', function (sc) {
      sc = sc || {};
      if (!Array.isArray(sc[serverId]) || sc[serverId].length === 0) {
        sc[serverId] = [{ cid: 'c_default', name: '默认配置', gpuCount: count, chassis: '' }];
      } else {
        sc[serverId][0].gpuCount = count;
      }
      return sc;
    });
    Store.notify();
  }

  function updateSupernodeConfig(snId, key, value) {
    Store.update('supernodeConfigs', function (sc) {
      sc = sc || {};
      if (!Array.isArray(sc[snId]) || sc[snId].length === 0) {
        let defCfg = UI.getDefaultSupernodeConfig(Store.get('gpuData').find(function (d) { return d.id === snId; }) || {});
        defCfg.cid = 'c_default';
        defCfg.name = '默认配置';
        sc[snId] = [defCfg];
      }
      sc[snId][0][key] = value;
      return sc;
    });
    Store.notify();
  }

  function toggleSupernodeCollapse(id) {
    Store.update('supernodeConfigs', function (cfgs) {
      cfgs = cfgs || {};
      let key = '_collapsed_' + id;
      cfgs[key] = !cfgs[key];
      return cfgs;
    });
    Store.notify();
  }

  function scrollToServerCard(id) {
    let card = document.querySelector('.server-card [data-action="show-detail"][data-id="' + id + '"]');
    if (card) {
      card = card.closest('.server-card');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.boxShadow = '0 0 0 3px var(--accent-ring)';
      setTimeout(function () { if (card.isConnected) card.style.boxShadow = ''; }, 2000);
    }
  }

  function scrollToSupernodeBlock(id) {
    let block = document.querySelector('.supernode-block [data-action="show-detail"][data-id="' + id + '"]');
    if (block) {
      block = block.closest('.supernode-block');
      block.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (block.classList.contains('collapsed')) {
        toggleSupernodeCollapse(id);
      }
      block.style.boxShadow = '0 0 0 3px var(--accent-ring)';
      setTimeout(function () { if (block.isConnected) block.style.boxShadow = ''; }, 2000);
    }
  }

  return {
    init, verifyPassword, showPasswordPrompt, submitChangePassword,
    applyColFilter, applyColFilterRange, clearColFilter, clearAllFilters,
    toggleEditMode, updateGPU, submitAddGPU, deleteGPU,
    switchView, switchDetailTab, updateServerGpuCount, updateSupernodeConfig,
    showAddServerConfigModal, showEditServerConfigModal, saveServerConfig, deleteServerConfig,
    showAddSupernodeConfigModal, showEditSupernodeConfigModal, saveSupernodeConfig, deleteSupernodeConfig
  };
})();

window.addEventListener('DOMContentLoaded', function () { App.init(); });

</script>
