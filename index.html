<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据中心GPU服务器对比系统</title>
<style>


/* ============================================================
   DESIGN TOKENS — Supabase-inspired
   ============================================================ */
:root {
  /* Surfaces — white-canvas commitment */
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-hover: #fafafa;
  --surface-active: #f5f5f5;

  /* Text — near-black ink ladder */
  --text: #171717;
  --text2: #707070;
  --text3: #9a9a9a;

  /* Brand — emerald green, the only chromatic event */
  --accent: #3ecf8e;
  --accent-hover: #24b47e;
  --accent-subtle: #ecfdf5;
  --accent-ring: rgba(62,207,142,0.20);

  /* Semantic */
  --success: #059669;
  --success-subtle: #ecfdf5;
  --warn: #d97706;
  --warn-subtle: #fffbeb;
  --danger: #dc2626;
  --danger-subtle: #fef2f2;

  /* Vendor */
  --nvidia-subtle: #ecfdf5;
  --china-subtle: #f5f5f5;

  /* Borders — hairline ladder */
  --border: #dfdfdf;
  --hairline: #dfdfdf;
  --hairline-strong: #c7c7c7;
  --hairline-cool: #ededed;
  --hairline-cool-3: #d4d4d4;

  /* Canvas */
  --canvas: #ffffff;
  --canvas-soft: #fafafa;
  --on-primary: #171717;
  --ink: #171717;

  /* Shadows — Supabase elevation 0→3 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.12);

  /* Radius — Supabase scale (square-ish, technical) */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Spacing — 8px base */
  --space-xs: 4px;
  --space-sm: 8px;
  --space: 12px;
  --space-md: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Typography — Inter (open-source Circular analogue) */
  --font-body: 'Inter', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: ui-monospace, 'Cascadia Code', 'Consolas', 'SF Mono', Menlo, monospace;

  --text-2xs: 10px;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-md: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;

  /* Motion */
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 120ms;
  --dur-normal: 200ms;
  --dur-slow: 300ms;

  /* Navbar height */
  --nav-h: 56px;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-normal: 0ms;
    --dur-slow: 0ms;
  }
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-weight: 400;
  font-size: var(--text-md);
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #d4d4d4;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: #9a9a9a;
}

::selection {
  background: rgba(62, 207, 142, 0.16);
  color: var(--text);
}

/* ============================================================
   KEYFRAMES
   ============================================================ */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUpModal {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes shake {
  0%,
  100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes pulse-dot {
  0%,
  100% { box-shadow: 0 0 0 2px rgba(62, 207, 142, 0.20); }
  50% { box-shadow: 0 0 0 5px rgba(62, 207, 142, 0.06); }
}

/* ============================================================
   ICONS
   ============================================================ */
.icon {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex-shrink: 0;
  vertical-align: -0.125em;
}

.icon-xs { width: 12px; height: 12px; }
.icon-sm { width: 14px; height: 14px; }
.icon-md { width: 18px; height: 18px; }
.icon-lg { width: 22px; height: 22px; }

/* ============================================================
   FOCUS RING — unified
   ============================================================ */
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-ring);
  border-color: var(--accent);
}

/* ============================================================
   BUTTONS — Supabase: 6px radius, emerald CTA with dark text
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--hairline-cool-3);
  background: var(--surface);
  color: var(--text);
  white-space: nowrap;
  font-family: inherit;
  letter-spacing: 0;
  user-select: none;
  line-height: 1;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

.btn:hover {
  background: var(--surface-hover);
  border-color: var(--hairline-strong);
  transform: translateY(-0.5px);
  box-shadow: var(--shadow-sm);
}

.btn:active { transform: translateY(0); opacity: 0.88; }

/* Primary — emerald green with near-black text (NOT white) */
.btn-primary {
  background: var(--accent);
  color: var(--on-primary);
  border-color: transparent;
  box-shadow: 0 1px 2px rgba(62,207,142,0.20);
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(62,207,142,0.28);
}

.btn-primary:active { transform: translateY(0); opacity: 0.9; }

/* Outline */
.btn-outline {
  background: transparent;
  border-color: var(--border);
}

.btn-outline:hover {
  background: var(--accent-subtle);
  border-color: var(--accent);
  color: var(--ink);
  transform: translateY(-0.5px);
  box-shadow: 0 2px 8px rgba(62,207,142,0.10);
}

/* Danger */
.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: #fecaca;
}

.btn-danger:hover {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  transform: translateY(-0.5px);
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
}

/* Sizes */
.btn-sm {
  padding: 5px 12px;
  font-size: var(--text-xs);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  justify-content: center;
}

/* Ghost */
.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text2);
}

.btn-ghost:hover {
  background: var(--surface-active);
  color: var(--text);
  transform: none;
  box-shadow: none;
}

/* ============================================================
   FORM ELEMENTS — Supabase: 6px radius, hairline borders
   ============================================================ */
.field-label {
  font-size: var(--text-xs);
  color: var(--text2);
  font-weight: 500;
  display: block;
  margin-bottom: var(--space-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.field-input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.field-textarea {
  width: 100%;
  min-height: 64px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  resize: vertical;
  line-height: 1.5;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.field-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.field-select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  outline: none;
}

.field-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   LAYOUT
   ============================================================ */
.app {
  display: flex;
  height: calc(100vh - var(--nav-h) - 46px);
}

/* ============================================================
   NAVBAR — clean white, no glass
   ============================================================ */
.navbar {
  background: var(--canvas);
  border-bottom: 1px solid var(--hairline);
  padding: 0 var(--space-xl);
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space);
  position: sticky;
  top: 0;
  z-index: 100;
}

.navbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-md);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  letter-spacing: -0.02em;
}

.navbar .brand .brand-icon {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--on-primary);
  box-shadow: 0 1px 3px rgba(62,207,142,0.18);
}

.nav-actions { display: flex; gap: 6px; align-items: center; }

/* Search */
.search-wrap { position: relative; display: flex; align-items: center; }

.search-wrap .search-icon {
  position: absolute;
  left: 10px;
  color: var(--text3);
  pointer-events: none;
  display: flex;
}

.search-wrap input {
  background: var(--surface-active);
  border: 1px solid transparent;
  color: var(--text);
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  width: 220px;
  outline: none;
  transition: all var(--dur-normal) var(--ease-out);
  font-family: inherit;
}

.search-wrap input:hover { border-color: var(--border); }

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-ring);
  background: var(--surface);
  width: 260px;
}

.search-wrap input::placeholder { color: var(--text3); }

/* Live badge */
.live-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
  white-space: nowrap;
  background: var(--success-subtle);
  color: var(--success);
  border: 1px solid #a7f3d0;
}

.live-badge.offline { background: var(--warn-subtle); color: var(--warn); border-color: #fde68a; }

.live-badge .live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse-dot 2s ease-in-out infinite;
}

.live-badge.offline .live-dot { background: var(--warn); animation: none; }

/* Hamburger */
.hamburger {
  display: none;
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background var(--dur-fast) var(--ease-out);
}

.hamburger:hover { background: var(--surface-active); }

.hamburger span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all var(--dur-normal) var(--ease-in-out);
}

.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* Sidebar overlay */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 23, 0.30);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 150;
  display: none;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.sidebar-overlay.show { display: block; }

/* ============================================================
   COMPARISON BAR
   ============================================================ */
.cmp-bar {
  background: var(--canvas-soft);
  border-bottom: 1px solid var(--hairline);
  padding: 10px var(--space-xl);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  min-height: 46px;
  flex-wrap: wrap;
}

.cmp-bar .cmp-label {
  font-size: var(--text-sm);
  color: var(--text2);
  font-weight: 500;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

.cmp-tag {
  background: var(--accent-subtle);
  border: 1px solid rgba(62,207,142,0.15);
  border-radius: var(--radius-sm);
  padding: 4px 12px;
  font-size: var(--text-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink);
  font-weight: 500;
  animation: fadeIn var(--dur-normal) var(--ease-out);
  transition: border-color var(--dur-fast) var(--ease-out);
}

.cmp-tag:hover { border-color: var(--accent); }

.cmp-tag .remove {
  cursor: pointer;
  color: var(--text3);
  font-size: 15px;
  line-height: 1;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all var(--dur-fast) var(--ease-out);
}

.cmp-tag .remove:hover { background: var(--danger); color: #fff; }

/* ============================================================
   SIDEBAR — clean, monochrome
   ============================================================ */
.sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  overflow-y: auto;
  flex-shrink: 0;
  padding: var(--space) 0;
  padding-top: env(safe-area-inset-top, var(--space));
}

.sidebar .side-section { margin-bottom: var(--space-xs); }

.sidebar .side-header {
  padding: var(--space-sm) var(--space-md);
  font-size: var(--text-2xs);
  text-transform: uppercase;
  color: var(--text3);
  letter-spacing: 0.08em;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.sidebar .side-header .side-count {
  background: var(--surface-active);
  color: var(--text3);
  padding: 1px 8px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 500;
}

.sidebar .gpu-item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 7px 14px;
  cursor: pointer;
  font-size: var(--text-sm);
  border-left: 2px solid transparent;
  transition: all var(--dur-fast) var(--ease-out);
  margin: 1px var(--space-sm);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text2);
}

.sidebar .gpu-item:hover { background: var(--surface-active); color: var(--text); }

.sidebar .gpu-item.active {
  border-left-color: var(--accent);
  background: var(--accent-subtle);
  color: var(--ink);
  font-weight: 500;
}

.sidebar .gpu-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.dot.nvidia { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-subtle); }
.dot.china { background: var(--text3); box-shadow: 0 0 0 2px var(--surface-active); }

.sidebar .gpu-item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar .gpu-item .cmp-toggle {
  margin-left: auto;
  font-size: 16px;
  color: var(--text3);
  cursor: pointer;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-xs);
  font-weight: 500;
  transition: all var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}

.sidebar .gpu-item .cmp-toggle:hover { background: var(--accent); color: var(--on-primary); }
.sidebar .gpu-item .cmp-toggle.active { color: var(--accent); font-weight: 600; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main { flex: 1; overflow-y: auto; padding: var(--space-2xl); }

/* Column filter */
.col-filter-wrap { display: inline-flex; align-items: center; gap: 1px; }

.col-filter-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  border-radius: var(--radius-xs);
  transition: all var(--dur-fast) var(--ease-out);
  padding: 0;
  flex-shrink: 0;
  position: relative;
}
.col-filter-btn:hover { color: var(--accent); background: var(--accent-subtle); }
.col-filter-btn.active { color: var(--accent); background: var(--accent-subtle); }

.col-filter-btn.active::after {
  content: '';
  position: absolute;
  top: 2px;
  right: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.col-filter-dropdown {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  min-width: 190px;
  max-width: 280px;
  box-shadow: var(--shadow-lg);
  z-index: 300;
  padding: var(--space-sm);
  display: none;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown.show { display: block; }

.col-filter-dropdown .filter-input {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

.col-filter-dropdown .filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  max-height: 160px;
  overflow-y: auto;
}

.col-filter-chip {
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  white-space: nowrap;
  font-family: inherit;
  transition: all var(--dur-fast) var(--ease-out);
}
.col-filter-chip:hover { border-color: var(--accent); color: var(--ink); background: var(--accent-subtle); }
.col-filter-chip.selected { background: var(--accent); color: var(--on-primary); border-color: var(--accent); box-shadow: 0 2px 6px rgba(62,207,142,0.18); }

.col-filter-dropdown .filter-range {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
}
.col-filter-dropdown .filter-range input {
  width: 62px;
  padding: 5px 6px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  text-align: center;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-range input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
.col-filter-dropdown .filter-range span { color: var(--text3); flex-shrink: 0; }

.col-filter-dropdown .filter-actions {
  display: flex;
  gap: 6px;
  margin-top: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--hairline-cool);
}
.col-filter-dropdown .filter-actions button {
  flex: 1;
  padding: 5px 0;
  border-radius: var(--radius-xs);
  font-size: var(--text-xs);
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  transition: all var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-actions button:hover { background: var(--surface-hover); }
.col-filter-dropdown .filter-actions button.apply-btn { background: var(--accent); color: var(--on-primary); border-color: var(--accent); }
.col-filter-dropdown .filter-actions button.apply-btn:hover { background: var(--accent-hover); }

.result-count { display: block; font-size: var(--text-xs); color: var(--text3); font-weight: 400; margin-bottom: var(--space-sm); min-height: 16px; }

/* ============================================================
   DATA TABLE — clean, subtle, monochrome
   ============================================================ */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--hairline);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }

thead th {
  padding: 10px 14px;
  text-align: left;
  font-weight: 500;
  color: var(--text2);
  border-bottom: 1px solid var(--hairline);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  background: var(--canvas-soft);
  z-index: 2;
  font-size: var(--text-sm);
  letter-spacing: 0;
  transition: color var(--dur-fast) var(--ease-out);
}

thead th.filtered { color: var(--accent); background: var(--accent-subtle); }

thead th .th-label { cursor: pointer; transition: all var(--dur-fast) var(--ease-out); }

thead th .th-label.filtered { color: var(--accent); }

thead th:hover { color: var(--ink); }

thead th .sort-arrow { font-size: 9px; margin-left: 2px; opacity: 0.4; flex-shrink: 0; }

tbody td { padding: 0 14px; border-bottom: 1px solid var(--hairline-cool); white-space: nowrap; vertical-align: middle; }

tbody tr { height: 52px; transition: background var(--dur-fast) var(--ease-out); }

tbody tr:nth-child(even) { background: #fafbfd; }

tbody tr:hover { background: var(--accent-subtle); }

tbody tr.selected { background: rgba(62, 207, 142, 0.04); }

.gpu-name {
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out);
}

.gpu-name:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 3px; }

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0;
}

.tag-nvidia { background: var(--nvidia-subtle); color: #1b7f4b; }
.tag-china { background: var(--china-subtle); color: var(--text2); }

.empty-state { text-align: center; padding: 56px 20px; color: var(--text3); }

.empty-state .empty-icon { font-size: 36px; margin-bottom: var(--space-sm); opacity: 0.2; }

/* ============================================================
   GPU CARDS (Mobile) — Supabase card styling
   ============================================================ */
.card-grid { display: none; gap: var(--space); }

.gpu-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: var(--space-2xl);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  cursor: pointer;
}

.gpu-card:active { background: var(--surface-hover); }

.gpu-card:hover { box-shadow: var(--shadow-md); border-color: var(--hairline-strong); }

.gpu-card .card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space);
}

.gpu-card .card-name { font-weight: 500; font-size: var(--text-md); color: var(--text); letter-spacing: -0.01em; }

.gpu-card .card-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: var(--text-sm);
  color: var(--text2);
}

.gpu-card .card-meta span {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid var(--hairline-cool);
}

.gpu-card .card-meta span:last-child { border-bottom: none; }

.gpu-card .card-meta strong {
  color: var(--text3);
  font-weight: 500;
  font-size: var(--text-2xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.gpu-card .card-meta span > :last-child { color: var(--text); font-weight: 500; text-align: right; }

.gpu-card .card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-sm);
  margin-top: var(--space);
}

.gpu-card .card-actions .btn { text-align: center; justify-content: center; }

/* ============================================================
   COMPARISON PANEL
   ============================================================ */
.cmp-panel {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  margin-top: var(--space-2xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.cmp-panel-header {
  padding: var(--space-xl) var(--space-2xl);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
}

.cmp-panel-header h3 {
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.42px;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.cmp-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.cmp-row { display: grid; border-bottom: 1px solid var(--hairline-cool); }

.cmp-row:last-child { border-bottom: none; }

.cmp-cell {
  padding: 10px 14px;
  font-size: var(--text-sm);
  border-right: 1px solid var(--hairline-cool);
  min-width: 140px;
}

.cmp-cell:last-child { border-right: none; }

.cmp-cell.header {
  background: var(--canvas-soft);
  font-weight: 500;
  font-size: var(--text-xs);
  color: var(--text2);
  letter-spacing: 0.04em;
}

.cmp-cell.best { background: var(--success-subtle); position: relative; }

.cmp-cell.best::after {
  content: '●';
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 8px;
  color: var(--success);
}

.config-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  font-size: var(--text-sm);
  padding: var(--space-md) var(--space-2xl);
  background: var(--canvas-soft);
  border-bottom: 1px solid var(--hairline);
}

.config-row label { display: flex; align-items: center; gap: 6px; color: var(--text2); font-weight: 500; }

.config-row input[type="number"] {
  width: 56px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--text);
  padding: 6px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: var(--text-sm);
  font-family: inherit;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.config-row input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   SETUP BANNER
   ============================================================ */
.setup-banner {
  padding: 10px var(--space-xl);
  background: var(--warn-subtle);
  color: #92400e;
  text-align: center;
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  border-bottom: 1px solid #fde68a;
  display: none;
  letter-spacing: 0;
  transition: background var(--dur-fast) var(--ease-out);
}

.setup-banner.show { display: block; }
.setup-banner:hover { background: #fef7e6; }

/* ============================================================
   MODAL — Supabase elevation level 3
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 23, 0.50);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.modal {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  width: 720px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: modalIn var(--dur-slow) var(--ease-out);
}

.modal-header {
  padding: var(--space-xl) var(--space-2xl);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}

.modal-header h2 {
  font-size: var(--text-xl);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-weight: 500;
  letter-spacing: -0.42px;
}

.modal-close {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--dur-fast) var(--ease-out);
  font-size: 16px;
}

.modal-close:hover { background: var(--danger-subtle); color: var(--danger); border-color: var(--danger); }

.modal-body { padding: var(--space-2xl); }

/* Detail sections */
.detail-section { margin-bottom: var(--space-xl); }
.detail-section:last-child { margin-bottom: 0; }

.detail-section-title {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: var(--space);
  padding-bottom: var(--space-sm);
  border-bottom: 1px solid var(--hairline);
}

/* Spec grid */
.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space); }

.spec-item {
  background: var(--canvas-soft);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  border: 1px solid var(--hairline-cool);
  transition: border-color var(--dur-fast) var(--ease-out);
}

.spec-item:hover { border-color: var(--hairline-strong); }
.spec-item.full { grid-column: 1 / -1; }

.spec-item label {
  font-size: var(--text-2xs);
  color: var(--text3);
  display: block;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
}

.spec-item .value { font-size: var(--text-md); font-weight: 500; color: var(--text); letter-spacing: -0.01em; }

.spec-item input,
.spec-item textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-family: inherit;
  margin-top: 4px;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.spec-item textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.spec-item input:focus,
.spec-item textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.spec-item select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-family: inherit;
  margin-top: 4px;
  cursor: pointer;
  outline: none;
}

.spec-item select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   PASSWORD MODAL
   ============================================================ */
.pw-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 23, 0.50);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.pw-dialog {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  width: 380px;
  max-width: 92vw;
  padding: var(--space-2xl);
  text-align: center;
  box-shadow: var(--shadow-xl);
  animation: modalIn var(--dur-slow) var(--ease-out);
}

.pw-dialog .pw-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto var(--space-md);
  background: var(--accent-subtle);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.pw-dialog h3 { font-size: var(--text-xl); font-weight: 500; margin-bottom: var(--space-sm); letter-spacing: -0.42px; }

.pw-dialog p { font-size: var(--text-sm); color: var(--text2); margin-bottom: var(--space-md); line-height: 1.6; }

.pw-dialog input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
  text-align: center;
  font-family: inherit;
  letter-spacing: 0.2em;
  font-weight: 400;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.pw-dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.pw-dialog .pw-error {
  color: var(--danger);
  font-size: var(--text-sm);
  margin-top: var(--space-sm);
  display: none;
}

.pw-dialog .pw-error.show { display: block; animation: shake 0.4s var(--ease-out); }

.pw-dialog .btn { margin-top: var(--space-md); width: 100%; padding: 10px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 300;
  background: var(--ink);
  color: #fff;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: slideUp var(--dur-slow) var(--ease-out);
  letter-spacing: 0;
}

/* ============================================================
   DROPDOWN
   ============================================================ */
.dropdown { position: relative; display: inline-block; }

.dropdown-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  min-width: 170px;
  z-index: 50;
  display: none;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}

.dropdown-menu.show { display: block; }

.dropdown-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 14px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: var(--text-sm);
  cursor: pointer;
  font-family: inherit;
  transition: background var(--dur-fast) var(--ease-out);
}

.dropdown-menu button:hover { background: var(--surface-hover); }

/* ============================================================
   SCROLL TO TOP
   ============================================================ */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 72px;
  z-index: 50;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  transition: all var(--dur-fast) var(--ease-out);
}

.scroll-top.show { display: flex; }

.scroll-top:hover { background: var(--accent); color: var(--on-primary); border-color: var(--accent); box-shadow: var(--shadow-lg); }

/* ============================================================
   EDIT INDICATOR
   ============================================================ */
.edit-indicator {
  position: fixed;
  top: 70px;
  right: 16px;
  z-index: 150;
  background: var(--warn);
  color: #fff;
  padding: 5px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
  display: none;
  box-shadow: var(--shadow-md);
  letter-spacing: 0;
}

.edit-indicator.on { display: block; animation: fadeIn var(--dur-normal) var(--ease-out); }

/* ============================================================
   UTILITY
   ============================================================ */
.perf-high { color: var(--success); font-weight: 500; }
.perf-mid { color: var(--warn); font-weight: 500; }
.power-high { color: var(--danger); font-weight: 500; }

.text-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}

.form-desc { font-size: var(--text-sm); color: var(--text2); margin-bottom: var(--space-md); line-height: 1.6; }
.form-hint { font-size: var(--text-xs); color: var(--text2); margin-bottom: 14px; padding: var(--space); background: var(--surface-hover); border-radius: var(--radius-sm); line-height: 1.6; border: 1px solid var(--hairline-cool); }
.form-group { margin-bottom: var(--space); }
.fp16-value { white-space: pre-line; font-size: var(--text-sm); }

/* ============================================================
   MOBILE BOTTOM TABS
   ============================================================ */
.mobile-tabs {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--surface);
  border-top: 1px solid var(--hairline);
  padding: 4px 8px env(safe-area-inset-bottom);
  justify-content: space-around;
  box-shadow: 0 -2px 14px rgba(0, 0, 0, 0.05);
}

.mobile-tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 10px;
  cursor: pointer;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  transition: color var(--dur-fast) var(--ease-out);
  font-family: inherit;
  min-width: 48px;
  min-height: 44px;
}

.mobile-tabs button .tab-icon { font-size: 18px; line-height: 1; }
.mobile-tabs button.active { color: var(--accent); font-weight: 500; }

/* ============================================================
   RESPONSIVE
   ============================================================ */

/* ≤1023px — Tablet / Small Desktop */
@media (max-width: 1023px) {
  .hamburger { display: flex; }
  .sidebar {
    position: fixed;
    left: -288px;
    top: 0;
    bottom: 0;
    z-index: 160;
    width: 280px;
    transition: left 280ms var(--ease-in-out);
    padding-top: calc(64px + env(safe-area-inset-top, 0px));
    box-shadow: var(--shadow-xl);
    border-right: 1px solid var(--hairline);
  }
  .sidebar.open { left: 0; }
  .nav-actions .btn:not(.btn-icon) { display: none; }
  .nav-actions .btn-icon { display: flex; }
  .search-wrap input { width: 160px; }
  .search-wrap input:focus { width: 180px; }
}

/* ≤767px — Mobile */
@media (max-width: 767px) {
  .navbar {
    padding: 0 var(--space);
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(52px + env(safe-area-inset-top, 0px));
  }
  .navbar .brand { font-size: var(--text-sm); gap: 6px; }
  .navbar .brand .brand-icon { width: 28px; height: 28px; }
  .search-wrap input { width: 120px; font-size: var(--text-sm); padding: 7px 8px 7px 28px; }
  .search-wrap input:focus { width: 140px; }
  .live-badge { font-size: 10px; padding: 3px 9px; }

  .app { height: calc(100vh - 52px - 46px - 56px); }

  .cmp-bar { padding: 8px var(--space); gap: 5px; min-height: 36px; overflow-x: auto; flex-wrap: nowrap; }
  .cmp-bar .cmp-label { font-size: 11px; }
  .cmp-tag { font-size: 11px; padding: 4px 9px; white-space: nowrap; }

  .main { padding: var(--space); padding-bottom: 72px; }

  .filter-bar { gap: 5px; }
  .filter-chip { padding: 5px 12px; font-size: 11px; }

  .table-wrap { display: none; }
  .card-grid { display: grid; }

  .modal {
    max-width: 100vw;
    max-height: 90vh;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    top: auto;
    animation: slideUpModal 280ms var(--ease-out);
  }
  .modal-overlay { align-items: flex-end; }
  .spec-grid { grid-template-columns: 1fr; }

  .cmp-grid { font-size: var(--text-xs); }
  .cmp-cell { padding: 8px 10px; min-width: 110px; }

  .mobile-tabs { display: flex; }
  .scroll-top { bottom: 74px; right: 12px; }
  .toast { bottom: 74px; right: 12px; left: 12px; text-align: center; }
  .dropdown-menu { right: auto; left: 0; }
}

/* ≥768px — Force table */
@media (min-width: 768px) {
  .card-grid { display: none !important; }
  .table-wrap { display: block !important; }
}

/* ≥1024px — Force sidebar visible, buttons visible */
@media (min-width: 1024px) {
  .sidebar { position: relative !important; left: 0 !important; }
  .sidebar-overlay { display: none !important; }
  .hamburger { display: none !important; }
}
</style>
</head>

<!-- Hidden SVG Icon Sprite -->

const Store = (() => {
  const STORAGE_KEY = 'gpu_compare_state_v2';

  let state = {
    gpuData: [],

    columnFilters: {},

    supabaseConfig: null,
    supabaseClient: null,
    realtimeChannel: null,
    pollingTimer: null,
    loading: true
  };

  const listeners = new Set();

  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function notify() { listeners.forEach(fn => fn()); }

  function loadConfig() {
    const saved = localStorage.getItem('gpu_compare_supabase_config');
    state.supabaseConfig = saved ? JSON.parse(saved) : { url: '', anonKey: '' };
  }

  function saveConfig() {
    if (state.supabaseConfig) {
      localStorage.setItem('gpu_compare_supabase_config', JSON.stringify(state.supabaseConfig));
    }
  }

  return {
    get: (key) => state[key],
    set: (key, value) => { state[key] = value; notify(); },
    update: (key, fn) => { state[key] = fn(state[key]); notify(); },
    getState: () => ({ ...state }),
    subscribe,
    notify,
    loadConfig,
    saveConfig,
    STORAGE_KEY
  };
})();

// ==================== API 模块 ====================
const API = (() => {

  function isConfigured() {
    const cfg = Store.get('supabaseConfig');
    return !!(cfg && cfg.url && cfg.anonKey);
  }

  function getSupabase() {
    if (!isConfigured()) return null;
    let client = Store.get('supabaseClient');
    if (!client) {
      const cfg = Store.get('supabaseConfig');
      client = supabase.createClient(cfg.url, cfg.anonKey);
      Store.set('supabaseClient', client);
    }
    return client;
  }

  function getHeaders() {
    const cfg = Store.get('supabaseConfig');
    return {
      'apikey': cfg.anonKey,
      'Authorization': 'Bearer ' + cfg.anonKey,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };
  }

  async function fetchAPI(path, options) {
    options = options || {};
    const cfg = Store.get('supabaseConfig');
    if (!cfg || !cfg.url) throw new Error('未配置 Supabase');
    const url = cfg.url.replace(/\/$/, '') + '/rest/v1/' + path;
    const res = await fetch(url, { ...options, headers: { ...getHeaders(), ...(options.headers || {}) } });
    if (!res.ok) {
      let errMsg = res.status + ' ' + res.statusText;
      try { const body = await res.json(); errMsg = body.message || body.error || JSON.stringify(body); } catch (e) { /* keep default */ }
      throw new Error(errMsg);
    }
    return res;
  }

  async function loadAll() {
    Store.set('loading', true);
    try {
      if (!isConfigured()) {
        Store.set('gpuData', JSON.parse(JSON.stringify(DEFAULT_DATA)));
        Store.set('loading', false);
        return;
      }
      const res = await fetchAPI('gpus?select=*&order=id.asc');
      const data = await res.json();
      if (data.length === 0) {
        await syncDefaults();
      } else {
        Store.set('gpuData', data);
      }
    } catch (e) {
      console.error('Supabase 加载失败:', e.message);
      if (Store.get('gpuData').length === 0) {
        Store.set('gpuData', JSON.parse(JSON.stringify(DEFAULT_DATA)));
      }
    } finally {
      Store.set('loading', false);
    }
  }

  async function syncDefaults() {
    try {
      for (const g of DEFAULT_DATA) {
        const { id, ...rest } = g;
        await fetchAPI('gpus', { method: 'POST', body: JSON.stringify({ id, ...rest }) });
      }
      Store.set('gpuData', JSON.parse(JSON.stringify(DEFAULT_DATA)));
      UI.showToast('已初始化云端数据库');
    } catch (e) {
      console.warn('初始化云端失败:', e.message);
      Store.set('gpuData', JSON.parse(JSON.stringify(DEFAULT_DATA)));
    }
  }

  async function saveOne(id, fields) {
    if (!isConfigured()) {
      const gpuData = Store.get('gpuData');
      const g = gpuData.find(function (d) { return d.id === id; });
      if (g) Object.assign(g, fields);
      return true;
    }
    try {
      await fetchAPI('gpus?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(fields) });
      return true;
    } catch (e) {
      console.error('云端保存失败:', e.message);
      UI.showToast('保存失败: ' + e.message.substring(0, 60), 4000);
      return false;
    }
  }

  async function addOne(gpu) {
    const gpuData = Store.get('gpuData');
    const newId = Math.max.apply(null, gpuData.map(function (g) { return g.id; }).concat(0)) + 1;
    const ng = { id: newId, vendor: '', arch: '', type: '', vram: '—', bandwidth: '—', interconnect: '—', tdp: '—', fp16: '—', notes: '', category: 'nvidia' };
    Object.assign(ng, gpu);
    if (!isConfigured()) {
      gpuData.push(ng);
      return ng;
    }
    try {
      const res = await fetchAPI('gpus', { method: 'POST', body: JSON.stringify(ng) });
      const created = await res.json();
      if (created && created.length > 0) {
        gpuData.push(created[0]);
        return created[0];
      }
      gpuData.push(ng);
      return ng;
    } catch (e) {
      console.error('云端添加失败:', e.message);
      gpuData.push(ng);
      UI.showToast('添加失败: ' + e.message.substring(0, 60), 4000);
      return ng;
    }
  }

  async function deleteOne(id) {
    const gpuData = Store.get('gpuData');
    const i = gpuData.findIndex(function (g) { return g.id === id; });
    if (i < 0) return;
    if (!isConfigured()) { gpuData.splice(i, 1); return true; }
    try {
      await fetchAPI('gpus?id=eq.' + id, { method: 'DELETE' });
      gpuData.splice(i, 1);
      return true;
    } catch (e) {
      console.error('云端删除失败:', e.message);
      gpuData.splice(i, 1);
      UI.showToast('删除失败: ' + e.message.substring(0, 60), 4000);
      return false;
    }
  }

  async function resetAll() {
    if (!isConfigured()) {
      Store.set('gpuData', JSON.parse(JSON.stringify(DEFAULT_DATA)));
      return;
    }
    try {
      await fetchAPI('gpus?id=gt.0', { method: 'DELETE' });
      for (const g of DEFAULT_DATA) {
        const { id, ...rest } = g;
        await fetchAPI('gpus', { method: 'POST', body: JSON.stringify({ id, ...rest }) });
      }
      Store.set('gpuData', JSON.parse(JSON.stringify(DEFAULT_DATA)));
    } catch (e) { console.warn('重置失败:', e.message); }
  }

  // Password — 从 Supabase 读取编辑密码
  async function fetchEditPassword() {
    if (!isConfigured()) return null;
    try {
      const res = await fetchAPI('settings?key=eq.edit_password&select=value');
      const data = await res.json();
      if (data && data.length > 0) return data[0].value;
      return null;
    } catch (e) {
      console.warn('获取编辑密码失败:', e.message);
      return null;
    }
  }

  async function setEditPassword(newPassword) {
    if (!isConfigured()) return false;
    try {
      const existing = await fetchAPI('settings?key=eq.edit_password&select=id');
      const rows = await existing.json();
      if (rows && rows.length > 0) {
        await fetchAPI('settings?id=eq.' + rows[0].id, { method: 'PATCH', body: JSON.stringify({ value: newPassword }) });
      } else {
        await fetchAPI('settings', { method: 'POST', body: JSON.stringify({ key: 'edit_password', value: newPassword }) });
      }
      return true;
    } catch (e) {
      console.error('保存密码失败:', e.message);
      return false;
    }
  }

  // Realtime
  function subscribeRealtime() {
    const ch = Store.get('realtimeChannel');
    if (ch) {
      const sb = getSupabase();
      if (sb) sb.removeChannel(ch);
    }
    if (!isConfigured()) return;
    const sb = getSupabase();
    if (!sb) return;
    const channel = sb.channel('gpus-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'gpus' }, function (payload) {
        const gpuData = Store.get('gpuData');
        switch (payload.eventType) {
          case 'INSERT':
            if (payload.new && !gpuData.find(function (g) { return g.id === payload.new.id; })) {
              gpuData.push(payload.new);
            }
            break;
          case 'UPDATE':
            if (payload.new) {
              const idx = gpuData.findIndex(function (g) { return g.id === payload.new.id; });
              if (idx >= 0) gpuData[idx] = payload.new;
            }
            break;
          case 'DELETE':
            if (payload.old) {
              const idx = gpuData.findIndex(function (g) { return g.id === payload.old.id; });
              if (idx >= 0) gpuData.splice(idx, 1);
              Store.update('compareList', function (list) { return list.filter(function (cid) { return cid !== payload.old.id; }); });
            }
            break;
        }
        Store.notify();
      })
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') {
          document.getElementById('setup-banner').classList.remove('show');
        } else if (status === 'CHANNEL_ERROR') {
          startPollingFallback();
        }
      });
    Store.set('realtimeChannel', channel);
  }

  function startPollingFallback() {
    if (Store.get('pollingTimer')) return;
    const timer = setInterval(async function () {
      await loadAll();
      Store.notify();
    }, 10000);
    Store.set('pollingTimer', timer);
  }

  function stopPolling() {
    const timer = Store.get('pollingTimer');
    if (timer) { clearInterval(timer); Store.set('pollingTimer', null); }
  }

  return {
    isConfigured, getSupabase, loadAll, saveOne, addOne, deleteOne, resetAll,
    fetchEditPassword, setEditPassword,
    subscribeRealtime, startPollingFallback, stopPolling
  };
})();

// ==================== UI 模块 ====================
const UI = (() => {

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function icon(id, cls) {
    cls = cls || '';
    return '<svg class="icon ' + cls + '"><use href="#' + id + '"/></svg>';
  }

  // ---- Data access helpers ----

  function getFilteredData() {
    var data = Store.get('gpuData');
    var q = (document.getElementById('search-input').value || '').toLowerCase();
    var filters = Store.get('columnFilters');

    Object.keys(filters).forEach(function (col) {
      var f = filters[col];
      if (f === null || f === undefined || f === '') return;
      if (col === 'tdp') {
        data = data.filter(function (g) {
          var v = parseFloat(g.tdp);
          if (isNaN(v)) return false;
          if (f.min !== null && v < f.min) return false;
          if (f.max !== null && v > f.max) return false;
          return true;
        });
      } else if (col === 'name' || col === 'vram' || col === 'bandwidth' || col === 'interconnect' || col === 'fp16') {
        var ft = String(f).toLowerCase();
        data = data.filter(function (g) { return (g[col] || '').toLowerCase().indexOf(ft) > -1; });
      } else {
        data = data.filter(function (g) { return g[col] === f; });
      }
    });

    if (q) {
      data = data.filter(function (g) {
        return g.name.toLowerCase().indexOf(q) > -1
          || g.vendor.toLowerCase().indexOf(q) > -1
          || g.arch.toLowerCase().indexOf(q) > -1
          || g.type.toLowerCase().indexOf(q) > -1
          || g.vram.toLowerCase().indexOf(q) > -1
          || g.bandwidth.toLowerCase().indexOf(q) > -1
          || g.interconnect.toLowerCase().indexOf(q) > -1
          || g.fp16.toLowerCase().indexOf(q) > -1
          || (g.notes || '').toLowerCase().indexOf(q) > -1;
      });
    }
    return data;
  }

  function getUniqueValues(key) {
    var vals = [];
    var seen = {};
    Store.get('gpuData').forEach(function (g) {
      var v = (g[key] || '').trim();
      if (v && !seen[v]) { seen[v] = true; vals.push(v); }
    });
    return vals.sort();
  }

  // ---- Sorting ----

  function sortTable(col) {
    var sortCol = Store.get('sortCol');
    var sortDir = Store.get('sortDir');
    if (sortCol === col) { sortDir *= -1; } else { sortCol = col; sortDir = 1; }
    Store.set('sortCol', sortCol);
    Store.set('sortDir', sortDir);

    document.querySelectorAll('.sort-arrow').forEach(function (el) { el.textContent = ''; });
    var arrow = document.getElementById('sort-' + col);
    if (arrow) arrow.textContent = sortDir === 1 ? '▲' : '▼';

    var filtered = getFilteredData();
    var sorted = filtered.slice().sort(function (a, b) {
      var va = a[col] || '', vb = b[col] || '';
      if (col === 'tdp') { va = parseFloat(va) || 0; vb = parseFloat(vb) || 0; }
      else if (col === 'bandwidth') {
        var pa = va.match(/([\d.]+)(TB|GB)/), pb = vb.match(/([\d.]+)(TB|GB)/);
        va = pa ? (pa[2] === 'TB' ? pa[1] * 1000 : parseFloat(pa[1])) : 0;
        vb = pb ? (pb[2] === 'TB' ? pb[1] * 1000 : parseFloat(pb[1])) : 0;
      }
      else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
      if (va < vb) return -1 * sortDir;
      if (va > vb) return 1 * sortDir;
      return 0;
    });
    renderTable(sorted);
    renderCards(sorted);
  }

  // ---- Table ----
  function lockColWidths() {
    var ths = document.querySelectorAll('#main-table thead th');
    if (!ths.length) return;
    if (ths[0].style.minWidth) return;
    ths.forEach(function (th) {
      th.style.minWidth = th.offsetWidth + 'px';
    });
  }

  function renderTable(data) {
    var tbody = document.getElementById('table-body');
    var compareList = Store.get('compareList');
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU 数据</div></td></tr>';
      document.getElementById('table-info').textContent = '无匹配结果';
    } else {
      tbody.innerHTML = data.map(function (g) {
        var vendorTag = g.vendor === 'NVIDIA'
          ? '<span class="tag tag-nvidia">NVIDIA</span>'
          : '<span class="tag tag-china">' + escapeHtml(g.vendor) + '</span>';
        var tdpNum = parseFloat(g.tdp);
        var tdpClass = '';
        if (tdpNum >= 500) tdpClass = 'power-high';
        else if (tdpNum >= 300) tdpClass = 'perf-mid';
        var selected = compareList.includes(g.id) ? ' selected' : '';
        var fp16display = g.fp16.length > 55 ? g.fp16.substring(0, 52) + '...' : g.fp16;
        var inCmp = compareList.includes(g.id);
        var actionBtns = '<button class="btn btn-outline btn-sm" data-action="show-detail" data-id="' + g.id + '" title="详情">' + icon('ic-detail', 'icon-sm') + '</button>'
          + '<button class="btn btn-outline btn-sm" data-action="toggle-compare" data-id="' + g.id + '">' + (inCmp ? '−' : '+') + '</button>';
        return '<tr class="' + selected + '" data-action="show-detail" data-id="' + g.id + '">'
          + '<td style="text-align:center;"><span class="gpu-name">' + escapeHtml(g.name) + '</span></td>'
          + '<td style="text-align:center;">' + vendorTag + '</td>'
          + '<td>' + escapeHtml(g.arch) + '</td><td>' + escapeHtml(g.type) + '</td>'
          + '<td>' + escapeHtml(g.vram) + '</td><td>' + escapeHtml(g.bandwidth) + '</td>'
          + '<td>' + escapeHtml(g.interconnect) + '</td>'
          + '<td class="' + tdpClass + '">' + escapeHtml(g.tdp) + '</td>'
          + '<td style="font-size:11px;max-width:200px;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;">' + escapeHtml(fp16display) + '</td>'
          + '<td style="border-bottom:none;"><div style="display:flex;gap:4px;align-items:center;justify-content:center;">' + actionBtns + '</div></td></tr>';
      }).join('');
      document.getElementById('table-info').textContent = '显示 ' + data.length + ' 条';
    }
    document.getElementById('gpu-count-text').textContent = Store.get('gpuData').length + ' GPU';
  }

  // ---- Cards (Mobile) ----
  function renderCards(data) {
    var grid = document.getElementById('card-grid');
    var compareList = Store.get('compareList');
    if (!data || data.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU</div>';
      return;
    }
    grid.innerHTML = data.map(function (g) {
      var vendorTag = g.vendor === 'NVIDIA'
        ? '<span class="tag tag-nvidia">NVIDIA</span>'
        : '<span class="tag tag-china">' + escapeHtml(g.vendor) + '</span>';
      var inCmp = compareList.includes(g.id);
      return '<div class="gpu-card" data-action="show-detail" data-id="' + g.id + '">'
        + '<div class="card-header"><span class="card-name">' + escapeHtml(g.name) + '</span>' + vendorTag + '</div>'
        + '<div class="card-meta">'
        + '<span><strong>架构</strong> ' + escapeHtml(g.arch) + '</span>'
        + '<span><strong>类型</strong> ' + escapeHtml(g.type) + '</span>'
        + '<span><strong>显存</strong> ' + escapeHtml(g.vram) + '</span>'
        + '<span><strong>带宽</strong> ' + escapeHtml(g.bandwidth) + '</span>'
        + '<span><strong>TDP</strong> ' + escapeHtml(g.tdp) + '</span>'
        + '<span><strong>互联</strong> ' + escapeHtml(g.interconnect) + '</span>'
        + '</div>'
        + '<div class="card-actions">'
        + '<button class="btn btn-outline btn-sm" data-action="show-detail" data-id="' + g.id + '">' + icon('ic-detail', 'icon-sm') + ' 详情</button>'
        + '<button class="btn btn-sm ' + (inCmp ? 'btn-primary' : 'btn-outline') + '" data-action="toggle-compare" data-id="' + g.id + '">' + (inCmp ? '已对比 −' : icon('ic-plus', 'icon-sm') + ' 对比') + '</button>'
        + '</div></div>';
    }).join('');
    document.getElementById('table-info').textContent = '显示 ' + data.length + ' 条';
  }

  // ---- Sidebar ----
  function renderSidebar() {
    var sidebar = document.getElementById('sidebar');
    var compareList = Store.get('compareList');
    var gpuData = Store.get('gpuData');
    var groups = {};
    gpuData.forEach(function (g) {
      var cat = g.category || 'other';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(g);
    });
    var catNames = { 'nvidia': 'NVIDIA GPU', 'china': '国产 GPU' };
    var catDots = { 'nvidia': 'nvidia', 'china': 'china' };
    var html = '';
    Object.keys(groups).forEach(function (cat) {
      var gpus = groups[cat];
      var label = catNames[cat] || (cat.charAt(0).toUpperCase() + cat.slice(1) + ' GPU');
      var dotCls = catDots[cat] || '';
      html += '<div class="side-section"><div class="side-header">' + label + ' <span class="side-count">' + gpus.length + '</span></div>';
      gpus.forEach(function (g) {
        var inCmp = compareList.includes(g.id);
        html += '<div class="gpu-item" data-action="show-detail" data-id="' + g.id + '">'
          + '<span class="dot ' + dotCls + '"></span>'
          + '<span class="item-name">' + escapeHtml(g.name) + '</span>'
          + '<span class="cmp-toggle ' + (inCmp ? 'active' : '') + '" data-action="toggle-compare" data-id="' + g.id + '">' + (inCmp ? '−' : '+') + '</span></div>';
      });
      html += '</div>';
    });
    sidebar.innerHTML = html;

  function updateCompareBar() {
    var container = document.getElementById('cmp-tags');
    var placeholder = document.getElementById('cmp-placeholder');
    var compareList = Store.get('compareList');
    var gpuData = Store.get('gpuData');
    if (compareList.length === 0) {
      container.innerHTML = '';
      placeholder.style.display = 'inline';
    } else {
      placeholder.style.display = 'none';
      container.innerHTML = compareList.map(function (id) {
        var g = gpuData.find(function (d) { return d.id === id; });
        if (!g) return '';
        return '<span class="cmp-tag">' + escapeHtml(g.name) + ' <span class="remove" data-action="toggle-compare" data-id="' + id + '">×</span></span>';
      }).join('');

    var serverConfig = Store.get('serverConfig');
    var gpus = compareList.map(function (id) { return gpuData.find(function (g) { return g.id === id; }); }).filter(Boolean);
    if (gpus.length < 2) { document.getElementById('cmp-panel-container').innerHTML = ''; return; }

    var specs = [
      { label: '厂商', key: 'vendor' },
      { label: '产品架构', key: 'arch' },
      { label: '产品类型', key: 'type' },
      { label: '显存', key: 'vram' },
      { label: '显存带宽', key: 'bandwidth' },
      { label: 'GPU互联', key: 'interconnect' },
      { label: 'TDP', key: 'tdp' },
      { label: 'FP16算力', key: 'fp16' }
    ];

    var serverSpecs = [
      {
        label: serverConfig.gpusPerServer + '卡总TDP',
        fn: function (g) {
          var w = parseFloat(g.tdp);
          return isNaN(w) ? '—' : (w * serverConfig.gpusPerServer * serverConfig.powerOverhead / 1000).toFixed(1) + 'kW (' + (serverConfig.powerOverhead * 100 - 100).toFixed(0) + '%冗余)';
        }
      },
      { label: serverConfig.gpusPerServer + '卡FP16算力', fn: computePerfEst },
      { label: '单台高度', fn: function (g) { return serverConfig.heightU + 'U'; } },
      { label: '千P算力需求(' + serverConfig.gpusPerServer + '卡)', fn: computeMachinesNeeded }
    ];

    var html = '<div class="cmp-panel"><div class="cmp-panel-header"><h3>' + icon('ic-compare', 'icon-md') + ' GPU 核心参数对比</h3><span style="font-size:12px;color:var(--text3);">' + gpus.length + ' 款 GPU</span></div>';

    html += '<div class="config-row"><span style="color:var(--text2);font-weight:600;display:flex;align-items:center;gap:4px;">' + icon('ic-settings', 'icon-sm') + ' 服务器参数：</span>';
    html += '<label>每机GPU <input type="number" value="' + serverConfig.gpusPerServer + '" onchange="App.updateServerConfig(\'gpusPerServer\',parseInt(this.value))"></label>';
    html += '<label>高度(U) <input type="number" value="' + serverConfig.heightU + '" onchange="App.updateServerConfig(\'heightU\',parseInt(this.value))"></label>';
    html += '<label>功率冗余 <input type="number" value="' + (serverConfig.powerOverhead * 100 - 100).toFixed(0) + '" onchange="App.updateServerConfig(\'powerOverhead\',1+parseFloat(this.value)/100)">%</label>';
    html += '</div>';

    html += '<div class="cmp-grid"><div class="cmp-row" style="grid-template-columns:140px repeat(' + gpus.length + ', 1fr);"><div class="cmp-cell header">参数</div>';
    gpus.forEach(function (g) { html += '<div class="cmp-cell header" style="font-size:13px;color:var(--text);">' + escapeHtml(g.vendor) + ' ' + escapeHtml(g.name) + '</div>'; });
    html += '</div>';

    specs.forEach(function (spec) {
      html += '<div class="cmp-row" style="grid-template-columns:140px repeat(' + gpus.length + ', 1fr);"><div class="cmp-cell header">' + spec.label + '</div>';
      var bestIdx = -1;
      if (spec.key === 'tdp') {
        var vals = gpus.map(function (g) { return parseFloat(g.tdp) || Infinity; });
        bestIdx = vals.indexOf(Math.min.apply(null, vals));
      } else if (spec.key === 'bandwidth') {
        var vals = gpus.map(function (g) {
          var m = g.bandwidth.match(/([\d.]+)(TB|GB)/);
          return m ? (m[2] === 'TB' ? m[1] * 1000 : parseFloat(m[1])) : 0;
        });
        bestIdx = vals.indexOf(Math.max.apply(null, vals));
      }
      gpus.forEach(function (g, i) {
        var cls = i === bestIdx && bestIdx >= 0 && gpus.length > 1 ? ' cmp-cell best' : 'cmp-cell';
        var display = spec.key === 'fp16' ? g[spec.key].replace(/\n/g, '<br>') : g[spec.key];
        html += '<div class="' + cls + '" style="font-size:11px;">' + display + '</div>';
      });
      html += '</div>';
    });

    serverSpecs.forEach(function (spec) {
      html += '<div class="cmp-row" style="grid-template-columns:140px repeat(' + gpus.length + ', 1fr);"><div class="cmp-cell header">' + spec.label + '</div>';
      gpus.forEach(function (g) { html += '<div class="cmp-cell" style="font-size:12px;color:var(--warn);">' + spec.fn(g) + '</div>'; });
      html += '</div>';
    });

    html += '</div></div>';
    document.getElementById('cmp-panel-container').innerHTML = html;
  }

  // ---- Filters UI ----
  function updateFilterButtonStates() {
    var filters = Store.get('columnFilters');
    var activeFilters = Object.keys(filters).filter(function (k) {
      var f = filters[k];
      return f !== null && f !== undefined && f !== '' && !(k === 'tdp' && f.min === null && f.max === null);
    });

    document.querySelectorAll('.th-label').forEach(function (label) {
      var orig = label.getAttribute('data-label');
      if (orig && label.textContent !== orig) { label.textContent = orig; }
      label.classList.remove('filtered');
    });
    document.querySelectorAll('.col-filter-btn').forEach(function (btn) {
      btn.classList.remove('active');
      btn.title = '筛选';
    });
    document.querySelectorAll('thead th').forEach(function (th) { th.classList.remove('filtered'); });

    activeFilters.forEach(function (col) {
      var btn = document.getElementById('filter-btn-' + col);
      if (btn) { btn.classList.add('active'); btn.title = '已筛选：点击修改或清除'; }
      var th = btn ? btn.closest('th') : null;
      if (th) {
        th.classList.add('filtered');
        var labelEl = th.querySelector('.th-label');
        if (labelEl) {
          var filterVal = filters[col];
          var displayText = formatFilterDisplay(col, filterVal);
          if (displayText) {
            labelEl.textContent = displayText;
            labelEl.classList.add('filtered');
          }
        }
      }
    });

    var info = document.getElementById('table-info');
    if (info && activeFilters.length > 0) {
      info.textContent = activeFilters.length + ' 项筛选活跃';
      info.style.color = 'var(--accent)';
    } else if (info) {
      info.style.color = '';
    }
  }

  function formatFilterDisplay(col, val) {
    if (col === 'tdp') {
      if (val.min !== null && val.max !== null) return val.min + '–' + val.max + 'W';
      if (val.min !== null) return '≥' + val.min + 'W';
      if (val.max !== null) return '≤' + val.max + 'W';
      return null;
    }
    return String(val);
  }

  function toggleColFilter(col) {
    var existing = document.querySelector('.col-filter-dropdown.show');
    if (existing) {
      var existingCol = existing.getAttribute('data-colfilter');
      closeAllFilterDropdowns();
      if (existingCol === col) return;
    }
    renderColFilterDropdown(col);
    var dd = document.getElementById('col-filter-dd-' + col);
    if (dd) {
      var btn = document.getElementById('filter-btn-' + col);
      if (!btn) return;
      var rect = btn.getBoundingClientRect();
      var ddW = 220;
      var left = rect.left;
      var top = rect.bottom + 4;
      if (left + ddW > window.innerWidth - 8) { left = Math.max(8, window.innerWidth - ddW - 8); }
      dd.style.left = left + 'px';
      dd.style.top = top + 'px';
      setTimeout(function () { dd.classList.add('show'); }, 10);
      setTimeout(function () {
        var inp = dd.querySelector('.filter-input');
        if (inp) { inp.focus(); inp.select(); }
      }, 150);
    }
  }

  function renderColFilterDropdown(col) {
    var btn = document.getElementById('filter-btn-' + col);
    if (!btn) return;
    var th = btn.closest('th');
    if (!th) return;
    var dd = document.createElement('div');
    dd.className = 'col-filter-dropdown';
    dd.id = 'col-filter-dd-' + col;
    dd.setAttribute('data-colfilter', col);
    var filters = Store.get('columnFilters');
    var filterVal = filters[col] || null;

    if (col === 'tdp') {
      var minVal = (filterVal && filterVal.min !== null) ? filterVal.min : '';
      var maxVal = (filterVal && filterVal.max !== null) ? filterVal.max : '';
      dd.innerHTML = '<div class="filter-range"><input type="number" id="tdp-min" placeholder="最小 W" value="' + minVal + '"><span>—</span><input type="number" id="tdp-max" placeholder="最大 W" value="' + maxVal + '"></div>'
        + '<div class="filter-actions"><button data-action="clear-col-filter" data-col="tdp">清除</button><button class="apply-btn" data-action="apply-range-filter" data-col="tdp">应用</button></div>';
    } else if (col === 'vendor' || col === 'arch' || col === 'type') {
      var vals = getUniqueValues(col);
      var chipsHtml = vals.map(function (v) {
        var sel = (filterVal === v) ? ' selected' : '';
        return '<button class="col-filter-chip' + sel + '" data-action="apply-col-filter" data-col="' + col + '" data-val="' + escapeHtml(v) + '">' + escapeHtml(v) + '</button>';
      }).join('');
      dd.innerHTML = '<div class="filter-chips">' + chipsHtml + '</div>'
        + '<div class="filter-actions"><button data-action="clear-col-filter" data-col="' + col + '">清除</button></div>';
    } else {
      dd.innerHTML = '<input type="text" class="filter-input" id="filter-input-' + col + '" placeholder="输入关键字筛选..." value="' + escapeHtml(filterVal || '') + '" onkeydown="if(event.key===\'Enter\')App.applyColFilter(\'' + col + '\',document.getElementById(\'filter-input-' + col + '\').value)">'
        + '<div class="filter-actions"><button data-action="clear-col-filter" data-col="' + col + '">清除</button><button class="apply-btn" data-action="apply-text-filter" data-col="' + col + '">应用</button></div>';
    }
    th.style.position = 'relative';
    th.appendChild(dd);
  }

  function closeAllFilterDropdowns() {
    document.querySelectorAll('.col-filter-dropdown').forEach(function (dd) { dd.remove(); });
  }

  // ---- Connection badge ----
  function updateConnectionBadge() {

    var text = document.getElementById('gpu-count-text');
    var gpuData = Store.get('gpuData');
    if (text) text.textContent = gpuData.length + ' GPU';
    if (!badge) return;
    if (API.isConfigured() && Store.get('realtimeChannel')) {
      badge.className = 'live-badge';
