<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据中心GPU服务器对比系统</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  /* Surfaces */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-hover: #f9fafb;
  --surface-active: #f3f4f6;

  /* Text */
  --text: #0f172a;
  --text2: #475569;
  --text3: #94a3b8;
  --text-inv: #ffffff;

  /* Brand */
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-subtle: #eef2ff;
  --accent-ring: rgba(79,70,229,0.15);

  /* Semantic */
  --success: #059669;
  --success-subtle: #ecfdf5;
  --warn: #d97706;
  --warn-subtle: #fffbeb;
  --danger: #dc2626;
  --danger-subtle: #fef2f2;

  /* Vendor */
  --nvidia: #65a30d;
  --nvidia-subtle: #f7fee7;
  --china: #dc2626;
  --china-subtle: #fef2f2;

  /* Borders */
  --border: #e2e8f0;
  --border-light: #f1f5f9;

  /* Shadows — elevation 0→3 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 1px 3px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.03);
  --shadow-xl: 0 12px 40px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.04);

  /* Radius */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 100px;

  /* Spacing — 4dp grid */
  --space-xs: 4px;
  --space-sm: 8px;
  --space: 12px;
  --space-md: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Typography */
  --text-2xs: 10px;
  --text-xs: 11px;
  --text-sm: 13px;
  --text: 14px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  /* Motion */
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 120ms;
  --dur-normal: 200ms;
  --dur-slow: 300ms;

  /* Ease aliases for backward compat */
  --ease: cubic-bezier(0, 0, 0.2, 1);
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --fast: 120ms;
  --normal: 200ms;
  --slow: 300ms;

  /* Navbar height */
  --nav-h: 56px;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-normal: 0ms;
    --dur-slow: 0ms;
    --fast: 0ms;
    --normal: 0ms;
    --slow: 0ms;
  }
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #d5d9e0;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: #b0b8c4;
}

::selection {
  background: rgba(79, 70, 229, 0.14);
  color: var(--text);
}

/* ============================================================
   KEYFRAMES
   ============================================================ */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUpModal {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes shake {
  0%,
  100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes pulse-dot {
  0%,
  100% { box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.20); }
  50% { box-shadow: 0 0 0 5px rgba(5, 150, 105, 0.06); }
}

/* ============================================================
   ICONS
   ============================================================ */
.icon {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex-shrink: 0;
  vertical-align: -0.125em;
}

.icon-xs { width: 12px; height: 12px; }
.icon-sm { width: 14px; height: 14px; }
.icon-md { width: 18px; height: 18px; }
.icon-lg { width: 22px; height: 22px; }

/* ============================================================
   FOCUS RING — unified
   ============================================================ */
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-ring);
  border-color: var(--accent);
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  white-space: nowrap;
  font-family: inherit;
  letter-spacing: 0.01em;
  user-select: none;
  line-height: 1;
  transition:
    background var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}

.btn:hover {
  background: var(--surface-hover);
  border-color: #cbd5e1;
  transform: translateY(-0.5px);
  box-shadow: var(--shadow-sm);
}

.btn:active { transform: translateY(0); opacity: 0.88; }

/* Primary */
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
  color: var(--text-inv);
  border-color: transparent;
  box-shadow:
    0 1px 2px rgba(79, 70, 229, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--accent-hover) 0%, #4f46e5 100%);
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow:
    0 4px 14px rgba(79, 70, 229, 0.32),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.btn-primary:active { transform: translateY(0); opacity: 0.9; }

/* Outline */
.btn-outline {
  background: transparent;
  border-color: var(--border);
}

.btn-outline:hover {
  background: var(--accent-subtle);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-0.5px);
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.10);
}

/* Danger */
.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: #fecaca;
}

.btn-danger:hover {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  transform: translateY(-0.5px);
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
}

/* Sizes */
.btn-sm {
  padding: 5px 12px;
  font-size: var(--text-xs);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  justify-content: center;
}

/* Ghost */
.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text2);
}

.btn-ghost:hover {
  background: var(--surface-active);
  color: var(--text);
  transform: none;
  box-shadow: none;
}

/* ============================================================
   FORM ELEMENTS — shared
   ============================================================ */
.field-label {
  font-size: var(--text-2xs);
  color: var(--text3);
  font-weight: 700;
  display: block;
  margin-bottom: var(--space-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.field-input {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.field-textarea {
  width: 100%;
  min-height: 64px;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  resize: vertical;
  line-height: 1.5;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.field-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.field-select {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  outline: none;
}

.field-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   LAYOUT
   ============================================================ */
.app {
  display: flex;
  height: calc(100vh - var(--nav-h) - 46px);
}

/* ============================================================
   NAVBAR
   ============================================================ */
.navbar {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 0 var(--space-xl);
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space);
  position: sticky;
  top: 0;
  z-index: 100;
}

.navbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  letter-spacing: -0.02em;
}

.navbar .brand .brand-icon {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.24);
}

.nav-actions { display: flex; gap: 6px; align-items: center; }

/* Search */
.search-wrap { position: relative; display: flex; align-items: center; }

.search-wrap .search-icon {
  position: absolute;
  left: 10px;
  color: var(--text3);
  pointer-events: none;
  display: flex;
}

.search-wrap input {
  background: var(--surface-active);
  border: 1.5px solid transparent;
  color: var(--text);
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  width: 220px;
  outline: none;
  transition: all var(--dur-normal) var(--ease-out);
  font-family: inherit;
}

.search-wrap input:hover { border-color: var(--border); }

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-ring);
  background: var(--surface);
  width: 260px;
}

.search-wrap input::placeholder { color: var(--text3); }

/* Live badge */
.live-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  white-space: nowrap;
  background: var(--success-subtle);
  color: var(--success);
  border: 1px solid #a7f3d0;
}

.live-badge.offline { background: var(--warn-subtle); color: var(--warn); border-color: #fde68a; }

.live-badge .live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse-dot 2s ease-in-out infinite;
}

.live-badge.offline .live-dot { background: var(--warn); animation: none; }

/* Hamburger */
.hamburger {
  display: none;
  width: 38px;
  height: 38px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background var(--dur-fast) var(--ease-out);
}

.hamburger:hover { background: var(--surface-active); }

.hamburger span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all var(--dur-normal) var(--ease-in-out);
}

.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* Sidebar overlay */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 25, 0.35);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 150;
  display: none;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.sidebar-overlay.show { display: block; }

/* ============================================================
   COMPARISON BAR
   ============================================================ */
.cmp-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px var(--space-xl);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  min-height: 46px;
  flex-wrap: wrap;
}

.cmp-bar .cmp-label {
  font-size: var(--text-sm);
  color: var(--text2);
  font-weight: 600;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

.cmp-tag {
  background: var(--accent-subtle);
  border: 1px solid rgba(79, 70, 229, 0.12);
  border-radius: var(--radius-full);
  padding: 4px 12px;
  font-size: var(--text-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  font-weight: 500;
  animation: fadeIn var(--dur-normal) var(--ease-out);
  transition: border-color var(--dur-fast) var(--ease-out);
}

.cmp-tag:hover { border-color: var(--accent); }

.cmp-tag .remove {
  cursor: pointer;
  color: var(--text3);
  font-size: 15px;
  line-height: 1;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all var(--dur-fast) var(--ease-out);
}

.cmp-tag .remove:hover { background: var(--danger); color: #fff; }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: var(--space) 0;
  padding-top: env(safe-area-inset-top, var(--space));
}

.sidebar .side-section { margin-bottom: var(--space-xs); }

.sidebar .side-header {
  padding: var(--space-sm) var(--space-md);
  font-size: var(--text-2xs);
  text-transform: uppercase;
  color: var(--text3);
  letter-spacing: 0.08em;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.sidebar .side-header .side-count {
  background: var(--surface-active);
  color: var(--text3);
  padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 600;
}

.sidebar .gpu-item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 7px 14px;
  cursor: pointer;
  font-size: var(--text-sm);
  border-left: 3px solid transparent;
  transition: all var(--dur-fast) var(--ease-out);
  margin: 1px var(--space-sm);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text2);
}

.sidebar .gpu-item:hover { background: var(--surface-active); color: var(--text); }

.sidebar .gpu-item.active {
  border-left-color: var(--accent);
  background: var(--accent-subtle);
  color: var(--accent);
  font-weight: 600;
}

.sidebar .gpu-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.dot.nvidia { background: var(--nvidia); box-shadow: 0 0 0 2px var(--nvidia-subtle); }
.dot.china { background: var(--china); box-shadow: 0 0 0 2px var(--china-subtle); }

.sidebar .gpu-item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar .gpu-item .cmp-toggle {
  margin-left: auto;
  font-size: 16px;
  color: var(--text3);
  cursor: pointer;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-xs);
  font-weight: 700;
  transition: all var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}

.sidebar .gpu-item .cmp-toggle:hover { background: var(--accent); color: #fff; }
.sidebar .gpu-item .cmp-toggle.active { color: var(--accent); font-weight: 800; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main { flex: 1; overflow-y: auto; padding: var(--space-xl); }

/* Column filter */
.col-filter-wrap { display: inline-flex; align-items: center; gap: 1px; }

.col-filter-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  border-radius: var(--radius-xs);
  transition: all var(--dur-fast) var(--ease-out);
  padding: 0;
  flex-shrink: 0;
  position: relative;
}
.col-filter-btn:hover { color: var(--accent); background: var(--accent-subtle); }
.col-filter-btn.active { color: var(--accent); background: var(--accent-subtle); }

.col-filter-btn.active::after {
  content: '';
  position: absolute;
  top: 2px;
  right: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.col-filter-dropdown {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-width: 190px;
  max-width: 280px;
  box-shadow: var(--shadow-lg);
  z-index: 300;
  padding: var(--space-sm);
  display: none;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown.show { display: block; }

.col-filter-dropdown .filter-input {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

.col-filter-dropdown .filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  max-height: 160px;
  overflow-y: auto;
}

.col-filter-chip {
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  white-space: nowrap;
  font-family: inherit;
  transition: all var(--dur-fast) var(--ease-out);
}
.col-filter-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }
.col-filter-chip.selected { background: var(--accent); color: var(--text-inv); border-color: var(--accent); box-shadow: 0 2px 6px rgba(79,70,229,0.18); }

.col-filter-dropdown .filter-range {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
}
.col-filter-dropdown .filter-range input {
  width: 62px;
  padding: 5px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  text-align: center;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-range input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
.col-filter-dropdown .filter-range span { color: var(--text3); flex-shrink: 0; }

.col-filter-dropdown .filter-actions {
  display: flex;
  gap: 6px;
  margin-top: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--border-light);
}
.col-filter-dropdown .filter-actions button {
  flex: 1;
  padding: 5px 0;
  border-radius: var(--radius-xs);
  font-size: var(--text-xs);
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  transition: all var(--dur-fast) var(--ease-out);
}
.col-filter-dropdown .filter-actions button:hover { background: var(--surface-hover); }
.col-filter-dropdown .filter-actions button.apply-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
.col-filter-dropdown .filter-actions button.apply-btn:hover { background: var(--accent-hover); }

.result-count { display: block; font-size: var(--text-xs); color: var(--text3); font-weight: 500; margin-bottom: var(--space-sm); min-height: 16px; }

/* ============================================================
   DATA TABLE
   ============================================================ */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }

thead th {
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text2);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  background: var(--surface-hover);
  z-index: 2;
  font-size: var(--text-sm);
  letter-spacing: 0.02em;
  transition: color var(--dur-fast) var(--ease-out);
}

thead th.filtered { color: var(--accent); background: var(--accent-subtle); }

thead th .th-label { cursor: pointer; transition: all var(--dur-fast) var(--ease-out); }

thead th .th-label.filtered { color: var(--accent); }

thead th:hover { color: var(--accent); }

thead th .sort-arrow { font-size: 9px; margin-left: 2px; opacity: 0.4; flex-shrink: 0; }

.col-filter-btn .filter-dot {
  display: none;
  position: absolute;
  top: 1px;
  right: 1px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

tbody td { padding: 0 14px; border-bottom: 1px solid var(--border-light); white-space: nowrap; }

tbody tr { height: 52px; transition: background var(--dur-fast) var(--ease-out); }

tbody tr:nth-child(even) { background: #fafbfd; }

tbody tr:hover { background: var(--accent-subtle); }

tbody tr.selected { background: rgba(79, 70, 229, 0.04); }

.gpu-name {
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out);
}

.gpu-name:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 3px; }

.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.tag-nvidia { background: var(--nvidia-subtle); color: #4d7c0f; }
.tag-china { background: var(--china-subtle); color: #b91c1c; }

.empty-state { text-align: center; padding: 56px 20px; color: var(--text3); }

.empty-state .empty-icon { font-size: 36px; margin-bottom: var(--space-sm); opacity: 0.2; }

/* ============================================================
   GPU CARDS (Mobile)
   ============================================================ */
.card-grid { display: none; gap: var(--space); }

.gpu-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  cursor: pointer;
}

.gpu-card:active { background: var(--surface-press); }

.gpu-card:hover { box-shadow: var(--shadow-md); border-color: #d1d5db; }

.gpu-card .card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space);
}

.gpu-card .card-name { font-weight: 700; font-size: var(--text-md); color: var(--text); letter-spacing: -0.01em; }

.gpu-card .card-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: var(--text-sm);
  color: var(--text2);
}

.gpu-card .card-meta span {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid var(--border-light);
}

.gpu-card .card-meta span:last-child { border-bottom: none; }

.gpu-card .card-meta strong {
  color: var(--text3);
  font-weight: 500;
  font-size: var(--text-2xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.gpu-card .card-meta span > :last-child { color: var(--text); font-weight: 600; text-align: right; }

.gpu-card .card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-sm);
  margin-top: var(--space);
}

.gpu-card .card-actions .btn { text-align: center; justify-content: center; }

/* ============================================================
   COMPARISON PANEL
   ============================================================ */
.cmp-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-top: var(--space-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.cmp-panel-header {
  padding: 14px var(--space-lg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-hover);
}

.cmp-panel-header h3 {
  font-size: var(--text-md);
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.cmp-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.cmp-row { display: grid; border-bottom: 1px solid var(--border-light); }

.cmp-row:last-child { border-bottom: none; }

.cmp-cell {
  padding: 10px 14px;
  font-size: var(--text-sm);
  border-right: 1px solid var(--border-light);
  min-width: 140px;
}

.cmp-cell:last-child { border-right: none; }

.cmp-cell.header {
  background: var(--surface-hover);
  font-weight: 600;
  font-size: var(--text-xs);
  color: var(--text2);
  letter-spacing: 0.04em;
}

.cmp-cell.best { background: var(--success-subtle); position: relative; }

.cmp-cell.best::after {
  content: '●';
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 8px;
  color: var(--success);
}

.config-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  font-size: var(--text-sm);
  padding: 10px var(--space-lg);
  background: var(--surface-hover);
  border-bottom: 1px solid var(--border);
}

.config-row label { display: flex; align-items: center; gap: 6px; color: var(--text2); font-weight: 500; }

.config-row input[type="number"] {
  width: 56px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 6px;
  border-radius: var(--radius-xs);
  text-align: center;
  font-size: var(--text-sm);
  font-family: inherit;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.config-row input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   SETUP BANNER
   ============================================================ */
.setup-banner {
  padding: 10px var(--space-xl);
  background: var(--warn-subtle);
  color: #92400e;
  text-align: center;
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  border-bottom: 1px solid #fde68a;
  display: none;
  letter-spacing: -0.01em;
  transition: background var(--dur-fast) var(--ease-out);
}

.setup-banner.show { display: block; }
.setup-banner:hover { background: #fef7e6; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 25, 0.55);
  backdrop-filter: blur(8px) saturate(0.6);
  -webkit-backdrop-filter: blur(8px) saturate(0.6);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 720px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: modalIn var(--dur-slow) var(--ease-out);
}

.modal-header {
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.modal-header h2 {
  font-size: var(--text-lg);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.modal-close {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--dur-fast) var(--ease-out);
  font-size: 16px;
}

.modal-close:hover { background: var(--danger-subtle); color: var(--danger); border-color: var(--danger); }

.modal-body { padding: var(--space-xl); }

/* Detail sections */
.detail-section { margin-bottom: var(--space-lg); }
.detail-section:last-child { margin-bottom: 0; }

.detail-section-title {
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: var(--space);
  padding-bottom: var(--space-sm);
  border-bottom: 1px solid var(--border);
}

/* Spec grid */
.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space); }

.spec-item {
  background: var(--surface-hover);
  border-radius: var(--radius-sm);
  padding: 14px;
  border: 1px solid var(--border-light);
  transition: border-color var(--dur-fast) var(--ease-out);
}

.spec-item:hover { border-color: #d1d5db; }
.spec-item.full { grid-column: 1 / -1; }

.spec-item label {
  font-size: var(--text-2xs);
  color: var(--text3);
  display: block;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}

.spec-item .value { font-size: var(--text-md); font-weight: 600; color: var(--text); letter-spacing: -0.01em; }

.spec-item input,
.spec-item textarea {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  margin-top: 4px;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.spec-item textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.spec-item input:focus,
.spec-item textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.spec-item select {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  font-size: var(--text-sm);
  font-family: inherit;
  margin-top: 4px;
  cursor: pointer;
  outline: none;
}

.spec-item select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* ============================================================
   PASSWORD MODAL
   ============================================================ */
.pw-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 25, 0.55);
  backdrop-filter: blur(8px) saturate(0.6);
  -webkit-backdrop-filter: blur(8px) saturate(0.6);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn var(--dur-normal) var(--ease-out);
}

.pw-dialog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 380px;
  max-width: 92vw;
  padding: var(--space-2xl);
  text-align: center;
  box-shadow: var(--shadow-xl);
  animation: modalIn var(--dur-slow) var(--ease-out);
}

.pw-dialog .pw-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto var(--space-md);
  background: var(--accent-subtle);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.pw-dialog h3 { font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--space-sm); letter-spacing: -0.01em; }

.pw-dialog p { font-size: var(--text-sm); color: var(--text2); margin-bottom: var(--space-lg); line-height: 1.6; }

.pw-dialog input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  text-align: center;
  font-family: inherit;
  letter-spacing: 0.2em;
  font-weight: 500;
  transition: border-color var(--dur-fast) var(--ease-out);
  outline: none;
}

.pw-dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.pw-dialog .pw-error {
  color: var(--danger);
  font-size: var(--text-sm);
  margin-top: var(--space-sm);
  display: none;
}

.pw-dialog .pw-error.show { display: block; animation: shake 0.4s var(--ease-out); }

.pw-dialog .btn { margin-top: var(--space-md); width: 100%; padding: 10px; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 300;
  background: var(--text);
  color: #fff;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  animation: slideUp var(--dur-slow) var(--ease-out);
  letter-spacing: 0.01em;
}

/* ============================================================
   DROPDOWN
   ============================================================ */
.dropdown { position: relative; display: inline-block; }

.dropdown-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-width: 170px;
  z-index: 50;
  display: none;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: fadeIn var(--dur-fast) var(--ease-out);
}

.dropdown-menu.show { display: block; }

.dropdown-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 14px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: var(--text-sm);
  cursor: pointer;
  font-family: inherit;
  transition: background var(--dur-fast) var(--ease-out);
}

.dropdown-menu button:hover { background: var(--surface-hover); }

/* ============================================================
   SCROLL TO TOP
   ============================================================ */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 72px;
  z-index: 50;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  transition: all var(--dur-fast) var(--ease-out);
}

.scroll-top.show { display: flex; }

.scroll-top:hover { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow-lg); }

/* ============================================================
   EDIT INDICATOR
   ============================================================ */
.edit-indicator {
  position: fixed;
  top: 70px;
  right: 16px;
  z-index: 150;
  background: var(--warn);
  color: #fff;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 700;
  display: none;
  box-shadow: var(--shadow-md);
  letter-spacing: 0.02em;
}

.edit-indicator.on { display: block; animation: fadeIn var(--dur-normal) var(--ease-out); }

/* ============================================================
   UTILITY
   ============================================================ */
.perf-high { color: var(--success); font-weight: 600; }
.perf-mid { color: var(--warn); font-weight: 500; }
.power-high { color: var(--danger); font-weight: 600; }

.text-mono {
  font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  font-size: var(--text-xs);
}

.form-desc { font-size: var(--text-sm); color: var(--text2); margin-bottom: var(--space-md); line-height: 1.6; }
.form-hint { font-size: var(--text-xs); color: var(--text2); margin-bottom: 14px; padding: var(--space); background: var(--accent-subtle); border-radius: var(--radius); line-height: 1.6; }
.form-group { margin-bottom: var(--space); }
.fp16-value { white-space: pre-line; font-size: var(--text-sm); }

/* ============================================================
   MOBILE BOTTOM TABS
   ============================================================ */
.mobile-tabs {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-top: 1px solid var(--border);
  padding: 4px 8px env(safe-area-inset-bottom);
  justify-content: space-around;
  box-shadow: 0 -2px 14px rgba(0, 0, 0, 0.05);
}

.mobile-tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 10px;
  cursor: pointer;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  transition: color var(--dur-fast) var(--ease-out);
  font-family: inherit;
  min-width: 48px;
  min-height: 44px;
}

.mobile-tabs button .tab-icon { font-size: 18px; line-height: 1; }
.mobile-tabs button.active { color: var(--accent); font-weight: 600; }

/* ============================================================
   RESPONSIVE
   ============================================================ */

/* ≤1023px — Tablet / Small Desktop */
@media (max-width: 1023px) {
  .hamburger { display: flex; }
  .sidebar {
    position: fixed;
    left: -288px;
    top: 0;
    bottom: 0;
    z-index: 160;
    width: 280px;
    transition: left 280ms var(--ease-in-out);
    padding-top: calc(64px + env(safe-area-inset-top, 0px));
    box-shadow: var(--shadow-xl);
    border-right: 1px solid var(--border);
  }
  .sidebar.open { left: 0; }
  .nav-actions .btn:not(.btn-icon) { display: none; }
  .nav-actions .btn-icon { display: flex; }
  .search-wrap input { width: 160px; }
  .search-wrap input:focus { width: 180px; }
}

/* ≤767px — Mobile */
@media (max-width: 767px) {
  .navbar {
    padding: 0 var(--space);
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(52px + env(safe-area-inset-top, 0px));
  }
  .navbar .brand { font-size: 14px; gap: 6px; }
  .navbar .brand .brand-icon { width: 28px; height: 28px; }
  .search-wrap input { width: 120px; font-size: var(--text-sm); padding: 7px 8px 7px 28px; }
  .search-wrap input:focus { width: 140px; }
  .live-badge { font-size: 10px; padding: 3px 9px; }

  .app { height: calc(100vh - 52px - 46px - 56px); }

  .cmp-bar { padding: 8px var(--space); gap: 5px; min-height: 36px; overflow-x: auto; flex-wrap: nowrap; }
  .cmp-bar .cmp-label { font-size: 11px; }
  .cmp-tag { font-size: 11px; padding: 4px 9px; white-space: nowrap; }

  .main { padding: var(--space); padding-bottom: 72px; }

  .filter-bar { gap: 5px; }
  .filter-chip { padding: 5px 12px; font-size: 11px; }

  .table-wrap { display: none; }
  .card-grid { display: grid; }

  .modal {
    max-width: 100vw;
    max-height: 90vh;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    top: auto;
    animation: slideUpModal 280ms var(--ease-out);
  }
  .modal-overlay { align-items: flex-end; }
  .spec-grid { grid-template-columns: 1fr; }

  .cmp-grid { font-size: var(--text-xs); }
  .cmp-cell { padding: 8px 10px; min-width: 110px; }

  .mobile-tabs { display: flex; }
  .scroll-top { bottom: 74px; right: 12px; }
  .toast { bottom: 74px; right: 12px; left: 12px; text-align: center; }
  .dropdown-menu { right: auto; left: 0; }
}

/* ≥768px — Force table */
@media (min-width: 768px) {
  .card-grid { display: none !important; }
  .table-wrap { display: block !important; }
}

/* ≥1024px — Force sidebar visible */
@media (min-width: 1024px) {

// ==================== Supabase API ====================
async function supabaseFetch(path, options = {}) {
  if (!isConfigured()) throw new Error('未配置 Supabase');
  const url = supabaseConfig.url.replace(/\/$/, '') + '/rest/v1/' + path;
  const res = await fetch(url, { ...options, headers: { ...getHeaders(), ...(options.headers||{}) } });
  if (!res.ok) {
    let errMsg = res.status + ' ' + res.statusText;
    try { const body = await res.json(); errMsg = body.message || body.error || JSON.stringify(body); } catch(e) { try { errMsg = await res.text(); } catch(_) {} }
    throw new Error(errMsg);
  }
  return res;
}

async function loadFromSupabase() {
  if (!isConfigured()) { gpuData = JSON.parse(JSON.stringify(DEFAULT_DATA)); return; }
  try {
    const res = await supabaseFetch('gpus?select=*&order=id.asc');
    const data = await res.json();
    if (data.length === 0) { await syncDefaultToSupabase(); } else { gpuData = data; }
  } catch(e) {
    console.error('Supabase 加载失败:', e.message);
    if (gpuData.length === 0) gpuData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

async function syncDefaultToSupabase() {
  try {
    for (const g of DEFAULT_DATA) { const { id, ...rest } = g; await supabaseFetch('gpus', { method: 'POST', body: JSON.stringify({id, ...rest}) }); }
    gpuData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    showToast('已初始化云端数据库');
  } catch(e) { console.warn('初始化云端失败:', e.message); gpuData = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}

async function saveGPUToSupabase(id, fields) {
  if (!isConfigured()) { const g = gpuData.find(d=>d.id===id); if(g) Object.assign(g,fields); return true; }
  try { await supabaseFetch('gpus?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(fields) }); return true; }
  catch(e) { console.error('云端保存失败:', e.message); showToast('保存失败: ' + e.message.substring(0,60), 4000); return false; }
}

async function addGPUToSupabase(gpu) {
  const newId = Math.max(...gpuData.map(g=>g.id), 0) + 1;
  const ng = {id:newId,vendor:'',arch:'',type:'',vram:'—',bandwidth:'—',interconnect:'—',tdp:'—',fp16:'—',notes:'',category:'nvidia',...gpu};
  if (!isConfigured()) { gpuData.push(ng); return ng; }
  try {
    const res = await supabaseFetch('gpus', { method: 'POST', body: JSON.stringify(ng) });
    const created = await res.json();
    if (created && created.length > 0) { gpuData.push(created[0]); return created[0]; }
    gpuData.push(ng); return ng;
  } catch(e) { console.error('云端添加失败:', e.message); gpuData.push(ng); showToast('添加失败: ' + e.message.substring(0,60), 4000); return ng; }
}

async function deleteGPUFromSupabase(id) {
  const i = gpuData.findIndex(g=>g.id===id);
  if (i<0) return;
  if (!isConfigured()) { gpuData.splice(i,1); return true; }
  try { await supabaseFetch('gpus?id=eq.' + id, { method: 'DELETE' }); gpuData.splice(i,1); return true; }
  catch(e) { console.error('云端删除失败:', e.message); gpuData.splice(i,1); showToast('删除失败: ' + e.message.substring(0,60), 4000); return false; }
}

async function resetSupabaseData() {
  if (!isConfigured()) { gpuData=JSON.parse(JSON.stringify(DEFAULT_DATA)); return; }
  try {
    await supabaseFetch('gpus?id=gt.0', { method: 'DELETE' });
    for (const g of DEFAULT_DATA) { const { id, ...rest } = g; await supabaseFetch('gpus', { method: 'POST', body: JSON.stringify({id,...rest}) }); }
    gpuData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e) { console.warn('重置失败:', e.message); }
}

async function syncFromSupabase() {
  if (!isConfigured()) { showToast('请先配置 Supabase 连接'); return; }
  await loadFromSupabase(); refreshUI(); showToast('已从云端刷新 (' + gpuData.length + ' 条)');
}

// ==================== Supabase Realtime ====================
function subscribeToRealtime() {
  if (realtimeChannel) { supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
  if (!isConfigured()) return;
  const sb = getSupabase(); if (!sb) return;
  realtimeChannel = sb.channel('gpus-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gpus' }, (payload) => {
      console.log('实时变更:', payload.eventType, payload.new || payload.old);
      switch (payload.eventType) {
        case 'INSERT': if (payload.new && !gpuData.find(g => g.id === payload.new.id)) { gpuData.push(payload.new); } break;
        case 'UPDATE': if (payload.new) { const idx = gpuData.findIndex(g => g.id === payload.new.id); if (idx >= 0) gpuData[idx] = payload.new; } break;
        case 'DELETE': if (payload.old) { const idx = gpuData.findIndex(g => g.id === payload.old.id); if (idx >= 0) gpuData.splice(idx, 1); const cmpIdx = compareList.indexOf(payload.old.id); if (cmpIdx >= 0) compareList.splice(cmpIdx, 1); } break;
      }
      refreshUI(); if (compareList.length >= 2) renderComparePanel();
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { console.log('已订阅 Supabase Realtime'); document.getElementById('setupBanner').classList.remove('show'); }
      else if (status === 'CHANNEL_ERROR') { console.warn('Realtime 订阅失败，降级为轮询模式'); startPollingFallback(); }
    });
}

function startPollingFallback() { if (pollingTimer) return; pollingTimer = setInterval(async () => { await loadFromSupabase(); refreshUI(); }, 10000); }

function updateConnectionBadge() {

  else { badge.className = 'live-badge offline'; badge.title = '未连接云端'; }
}

// ==================== Column Filters ====================
function getUniqueValues(key) {
  var vals = []; var seen = {};
  gpuData.forEach(function(g){
    var v = (g[key]||'').trim();
    if (v && !seen[v]) { seen[v] = true; vals.push(v); }
  });
  return vals.sort();
}

function getFilteredData() {
  var data = gpuData;
  var q = (document.getElementById('searchInput').value || '').toLowerCase();
  Object.keys(columnFilters).forEach(function(col){
    var f = columnFilters[col];
    if (f === null || f === undefined || f === '') return;
    if (col === 'tdp') {
      data = data.filter(function(g){ var v = parseFloat(g.tdp); if (isNaN(v)) return false; if (f.min !== null && v < f.min) return false; if (f.max !== null && v > f.max) return false; return true; });
    } else if (col === 'name' || col === 'vram' || col === 'bandwidth' || col === 'interconnect' || col === 'fp16') {
      var ft = String(f).toLowerCase();
      data = data.filter(function(g){ return (g[col]||'').toLowerCase().indexOf(ft) > -1; });
    } else {
      // categorical (vendor, arch, type)
      data = data.filter(function(g){ return g[col] === f; });
    }
  });
  if (q) { data = data.filter(function(g){ return g.name.toLowerCase().indexOf(q)>-1||g.vendor.toLowerCase().indexOf(q)>-1||g.arch.toLowerCase().indexOf(q)>-1||g.type.toLowerCase().indexOf(q)>-1||g.vram.toLowerCase().indexOf(q)>-1||g.bandwidth.toLowerCase().indexOf(q)>-1||g.interconnect.toLowerCase().indexOf(q)>-1||g.fp16.toLowerCase().indexOf(q)>-1||(g.notes||'').toLowerCase().indexOf(q)>-1; }); }
  return data;
}

function lockColWidths() {
  var ths = document.querySelectorAll('#mainTable thead th');
  if (!ths.length) return;
  var alreadyLocked = ths[0].style.minWidth;
  if (alreadyLocked) return;
  ths.forEach(function(th){
    var w = th.offsetWidth;
    th.style.minWidth = w + 'px';
  });
}

function refreshUI() { renderSidebar(); renderAll(); updateCompareBar(); updateConnectionBadge(); updateFilterButtonStates(); if (compareList.length >= 2) renderComparePanel(); }
function renderAll() { var f = getFilteredData(); renderTable(f); renderCards(f); lockColWidths(); }

function updateFilterButtonStates() {
  var activeFilters = Object.keys(columnFilters).filter(function(k){ var f = columnFilters[k]; return f !== null && f !== undefined && f !== '' && !(k === 'tdp' && f.min === null && f.max === null); });

  // Reset all labels & buttons first
  document.querySelectorAll('.th-label').forEach(function(label){
    var orig = label.getAttribute('data-label');
    if (orig && label.textContent !== orig) { label.textContent = orig; }
    label.classList.remove('filtered');
  });
  document.querySelectorAll('.col-filter-btn').forEach(function(btn){
    btn.classList.remove('active');
    btn.title = '筛选';
  });
  document.querySelectorAll('thead th').forEach(function(th){ th.classList.remove('filtered'); });

  // Apply active filter states
  activeFilters.forEach(function(col){
    var btn = document.getElementById('filterBtn-' + col);
    if (btn) { btn.classList.add('active'); btn.title = '已筛选：点击修改或清除'; }
    var label = document.querySelector('.th-label[data-label]'); // need specific one
    // Find label for this column
    var th = btn ? btn.closest('th') : null;
    if (th) {
      th.classList.add('filtered');
      var labelEl = th.querySelector('.th-label');
      if (labelEl) {
        var filterVal = columnFilters[col];
        var displayText = formatFilterDisplay(col, filterVal);
        if (displayText) {
          labelEl.textContent = displayText;
          labelEl.classList.add('filtered');
        }
      }
    }
  });

  // Update result count
  var info = document.getElementById('tableInfo');
  if (info && activeFilters.length > 0) {
    info.textContent = activeFilters.length + ' 项筛选活跃';
    info.style.color = 'var(--accent)';
  } else if (info) {
    info.style.color = '';
  }
}

function formatFilterDisplay(col, val) {
  if (col === 'tdp') {
    if (val.min !== null && val.max !== null) return val.min + '–' + val.max + 'W';
    if (val.min !== null) return '≥' + val.min + 'W';
    if (val.max !== null) return '≤' + val.max + 'W';
    return null;
  }
  return String(val);
}

function toggleColFilter(col) {
  var existing = document.querySelector('.col-filter-dropdown.show');
  if (existing) {
    var existingCol = existing.getAttribute('data-colfilter');
    closeAllFilterDropdowns();
    if (existingCol === col) return; // Toggle close
  }
  renderColFilterDropdown(col);
  var dd = document.getElementById('colFilterDD-' + col);
  if (dd) {
    var btn = document.getElementById('filterBtn-' + col);
    var rect = btn.getBoundingClientRect();
    var ddW = 220; // estimate
    var left = rect.left;
    var top = rect.bottom + 4;
    // Flip if overflows right edge
    if (left + ddW > window.innerWidth - 8) { left = Math.max(8, window.innerWidth - ddW - 8); }
    dd.style.left = left + 'px';
    dd.style.top = top + 'px';
    setTimeout(function(){ dd.classList.add('show'); }, 10);
    setTimeout(function(){
      var inp = dd.querySelector('.filter-input');
      if (inp) { inp.focus(); inp.select(); }
    }, 150);
  }
}

function renderColFilterDropdown(col) {
  var th = document.querySelector('#filterBtn-' + col).closest('th');
  var dd = document.createElement('div');
  dd.className = 'col-filter-dropdown';
  dd.id = 'colFilterDD-' + col;
  dd.setAttribute('data-colfilter', col);
  dd.onclick = function(e){ e.stopPropagation(); };

  var filterVal = columnFilters[col] || null;

  if (col === 'tdp') {
    var minVal = (filterVal && filterVal.min !== null) ? filterVal.min : '';
    var maxVal = (filterVal && filterVal.max !== null) ? filterVal.max : '';
    dd.innerHTML = '<div class="filter-range"><input type="number" id="tdpMin" placeholder="最小 W" value="' + minVal + '"><span>—</span><input type="number" id="tdpMax" placeholder="最大 W" value="' + maxVal + '"></div>'
      + '<div class="filter-actions"><button onclick="clearColFilter(\'tdp\')">清除</button><button class="apply-btn" onclick="applyColFilterRange(\'tdp\')">应用</button></div>';
  } else if (col === 'vendor' || col === 'arch' || col === 'type') {
    var vals = getUniqueValues(col);
    var chipsHtml = vals.map(function(v){
      var sel = (filterVal === v) ? ' selected' : '';
      return '<button class="col-filter-chip' + sel + '" onclick="applyColFilter(\'' + col + '\',\'' + v.replace(/'/g, "\\'") + '\')">' + v + '</button>';
    }).join('');
    dd.innerHTML = '<div class="filter-chips">' + chipsHtml + '</div>'
      + '<div class="filter-actions"><button onclick="clearColFilter(\'' + col + '\')">清除</button></div>';
  } else {
    dd.innerHTML = '<input type="text" class="filter-input" id="filterInput-' + col + '" placeholder="输入关键字筛选..." value="' + (filterVal||'') + '" onkeydown="if(event.key===\'Enter\')applyColFilter(\'' + col + '\',document.getElementById(\'filterInput-' + col + '\').value)">'
      + '<div class="filter-actions"><button onclick="clearColFilter(\'' + col + '\')">清除</button><button class="apply-btn" onclick="applyColFilter(\'' + col + '\',document.getElementById(\'filterInput-' + col + '\').value)">应用</button></div>';
  }
  th.style.position = 'relative';
  th.appendChild(dd);
}

function applyColFilter(col, val) {
  if (!val) { clearColFilter(col); return; }
  columnFilters[col] = val;
  closeAllFilterDropdowns();
  refreshUI();
}

function applyColFilterRange(col) {
  var minEl = document.getElementById('tdpMin');
  var maxEl = document.getElementById('tdpMax');
  var minV = minEl ? parseFloat(minEl.value) : NaN;
  var maxV = maxEl ? parseFloat(maxEl.value) : NaN;
  if (isNaN(minV) && isNaN(maxV)) { clearColFilter(col); return; }
  columnFilters[col] = { min: isNaN(minV) ? null : minV, max: isNaN(maxV) ? null : maxV };
  closeAllFilterDropdowns();
  refreshUI();
}

function clearColFilter(col) {
  delete columnFilters[col];
  closeAllFilterDropdowns();
  refreshUI();
}

function clearAllFilters() {
  columnFilters = {};
  document.getElementById('searchInput').value = '';
  closeAllFilterDropdowns();
  refreshUI();
}

function closeAllFilterDropdowns() {
  document.querySelectorAll('.col-filter-dropdown').forEach(function(dd){ dd.remove(); });
}

// Global click to close dropdowns
document.addEventListener('click', function(e){
  if (!e.target.closest('.col-filter-btn') && !e.target.closest('.col-filter-dropdown')) {
    closeAllFilterDropdowns();
  }
});

// ==================== 侧边栏 (动态分组) ====================
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('sidebarOverlay').classList.toggle('show', sidebarOpen);
  document.getElementById('hamburgerBtn').classList.toggle('active', sidebarOpen);
}

function renderSidebar() {
  var sidebar = document.getElementById('sidebar');
  // Group by category
  var groups = {};
  gpuData.forEach(function(g){
    var cat = g.category || 'other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(g);
  });
  var catNames = { 'nvidia': 'NVIDIA GPU', 'china': '国产 GPU' };
  var catDots = { 'nvidia': 'nvidia', 'china': 'china' };
  var html = '';
  Object.keys(groups).forEach(function(cat){
    var gpus = groups[cat];
    var label = catNames[cat] || (cat.charAt(0).toUpperCase() + cat.slice(1) + ' GPU');
    var dotCls = catDots[cat] || '';
    html += '<div class="side-section"><div class="side-header">' + label + ' <span class="side-count">' + gpus.length + '</span></div>';
    gpus.forEach(function(g){
      var inCmp = compareList.includes(g.id);
      html += '<div class="gpu-item" onclick="showDetail(' + g.id + ')"><span class="dot ' + dotCls + '"></span><span class="item-name">' + g.name + '</span><span class="cmp-toggle ' + (inCmp?'active':'') + '" onclick="event.stopPropagation();toggleCompare(' + g.id + ')">' + (inCmp?'−':'+') + '</span></div>';
    });
    html += '</div>';
  });
  sidebar.innerHTML = html;
}

// ==================== 排序 ====================
function sortTable(col) {
  if (sortCol===col){sortDir*=-1;}else{sortCol=col;sortDir=1;}
  document.querySelectorAll('.sort-arrow').forEach(function(el){el.textContent='';});
  var arrow = document.getElementById('sort-'+col);
  if(arrow) arrow.textContent = sortDir===1?'▲':'▼';
  var filtered = getFilteredData();
  var sorted = [].concat(filtered).sort(function(a,b){
    var va=a[col]||'', vb=b[col]||'';
    if(col==='tdp'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}
    else if(col==='bandwidth'){var pa=va.match(/([\d.]+)(TB|GB)/),pb=vb.match(/([\d.]+)(TB|GB)/);va=pa?(pa[2]==='TB'?pa[1]*1000:parseFloat(pa[1])):0;vb=pb?(pb[2]==='TB'?pb[1]*1000:parseFloat(pb[1])):0;}
    else{va=String(va).toLowerCase();vb=String(vb).toLowerCase();}
    if(va<vb)return -1*sortDir; if(va>vb)return 1*sortDir; return 0;
  });
  renderTable(sorted); renderCards(sorted);
}

// ==================== 表格 ====================
function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  if(data.length===0){
    tbody.innerHTML='<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU 数据</div></td></tr>';
    document.getElementById('tableInfo').textContent='无匹配结果';
  } else {
    tbody.innerHTML = data.map(function(g){
      var vendorTag = g.vendor==='NVIDIA'?'<span class="tag tag-nvidia">NVIDIA</span>':'<span class="tag tag-china">' + g.vendor + '</span>';
      var tdpNum=parseFloat(g.tdp);var tdpClass='';if(tdpNum>=500)tdpClass='power-high';else if(tdpNum>=300)tdpClass='perf-mid';
      var selected=compareList.includes(g.id)?' selected':'';
      var fp16display=g.fp16.length>55?g.fp16.substring(0,52)+'...':g.fp16;
      return '<tr class="'+selected+'" ondblclick="showDetail('+g.id+')"><td style="text-align:center;"><span class="gpu-name" onclick="showDetail('+g.id+')">'+g.name+'</span></td><td style="text-align:center;">'+vendorTag+'</td><td>'+g.arch+'</td><td>'+g.type+'</td><td>'+g.vram+'</td><td>'+g.bandwidth+'</td><td>'+g.interconnect+'</td><td class="'+tdpClass+'">'+g.tdp+'</td><td style="font-size:11px;max-width:240px;white-space:pre-line;">'+fp16display+'</td><td style="display:flex;gap:4px;"><button class="btn btn-outline btn-sm" onclick="showDetail('+g.id+')" title="详情"><svg class="icon icon-sm"><use href=\'#ic-detail\'/></svg></button><button class="btn btn-outline btn-sm" onclick="toggleCompare('+g.id+')">'+(compareList.includes(g.id)?'−':'+')+'</button></td></tr>';
    }).join('');
    document.getElementById('tableInfo').textContent='显示 '+data.length+' 条';
  }
  document.getElementById('gpuCountText').textContent=gpuData.length+' GPU';
}

// ==================== 卡片 (移动端) ====================
function renderCards(data) {
  var grid = document.getElementById('cardGrid');
  if(data.length===0){ grid.innerHTML='<div class="empty-state"><div class="empty-icon">—</div>未找到匹配的 GPU</div>'; return; }
  grid.innerHTML = data.map(function(g){
    var vendorTag = g.vendor==='NVIDIA'?'<span class="tag tag-nvidia">NVIDIA</span>':'<span class="tag tag-china">'+g.vendor+'</span>';
    var inCmp = compareList.includes(g.id);
    return '<div class="gpu-card" onclick="showDetail('+g.id+')">'
      + '<div class="card-header"><span class="card-name">'+g.name+'</span>'+vendorTag+'</div>'
      + '<div class="card-meta">'
      + '<span><strong>架构</strong> '+g.arch+'</span><span><strong>类型</strong> '+g.type+'</span>'
      + '<span><strong>显存</strong> '+g.vram+'</span><span><strong>带宽</strong> '+g.bandwidth+'</span>'
      + '<span><strong>TDP</strong> '+g.tdp+'</span><span><strong>互联</strong> '+g.interconnect+'</span>'
      + '</div>'
      + '<div class="card-actions">'
      + '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showDetail('+g.id+')"><svg class="icon icon-sm"><use href=\'#ic-detail\'/></svg> 详情</button>'
      + '<button class="btn btn-sm '+(inCmp?'btn-primary':'btn-outline')+'" onclick="event.stopPropagation();toggleCompare('+g.id+')">'+(inCmp?'已对比 −':'<svg class="icon icon-sm"><use href=\'#ic-plus\'/></svg> 对比')+'</button>'
      + '</div></div>';
  }).join('');
  document.getElementById('tableInfo').textContent='显示 '+data.length+' 条';
}

// ==================== 搜索 ====================
function handleSearch(){
  closeAllFilterDropdowns();
  var filtered = getFilteredData();
  renderTable(filtered); renderCards(filtered);
}

// ==================== 对比 ====================
function toggleCompare(id){
  var idx=compareList.indexOf(id);
  if(idx>=0){compareList.splice(idx,1);}else{compareList.push(id);}
  updateCompareBar();renderSidebar();renderAll();
  if(compareList.length>=2)renderComparePanel();else document.getElementById('cmpPanelContainer').innerHTML='';
  if (sidebarOpen && window.innerWidth < 1024) toggleSidebar();
}
function clearCompare(){compareList=[];updateCompareBar();renderSidebar();renderAll();document.getElementById('cmpPanelContainer').innerHTML='';}
function scrollToCompare(){ var el=document.getElementById('cmpPanelContainer'); if(el)el.scrollIntoView({behavior:'smooth'}); }

function updateCompareBar(){
  var container=document.getElementById('cmpTags'),placeholder=document.getElementById('cmpPlaceholder');
  if(compareList.length===0){container.innerHTML='';placeholder.style.display='inline';}
  else{placeholder.style.display='none';container.innerHTML=compareList.map(function(id){var g=gpuData.find(function(d){return d.id===id;});if(!g)return'';return '<span class="cmp-tag">'+g.name+' <span class="remove" onclick="toggleCompare('+id+')">×</span></span>';}).join('');}
}

function renderComparePanel(){
  var gpus=compareList.map(function(id){return gpuData.find(function(g){return g.id===id;});}).filter(Boolean);
  if(gpus.length<2)return;
  var specs=[{label:'厂商',key:'vendor'},{label:'产品架构',key:'arch'},{label:'产品类型',key:'type'},{label:'显存',key:'vram'},{label:'显存带宽',key:'bandwidth'},{label:'GPU互联',key:'interconnect'},{label:'TDP',key:'tdp'},{label:'FP16算力',key:'fp16'}];
  var serverSpecs=[{label:serverConfig.gpusPerServer+'卡总TDP',fn:function(g){var w=parseFloat(g.tdp);return isNaN(w)?'—':(w*serverConfig.gpusPerServer*serverConfig.powerOverhead/1000).toFixed(1)+'kW ('+(serverConfig.powerOverhead*100-100).toFixed(0)+'%冗余)';}},{label:serverConfig.gpusPerServer+'卡FP16算力',fn:function(g){return computePerfEst(g);}},{label:'单台高度',fn:function(g){return serverConfig.heightU+'U';}},{label:'千P算力需求('+serverConfig.gpusPerServer+'卡)',fn:function(g){return computeMachinesNeeded(g);}}];

  var html='<div class="cmp-panel"><div class="cmp-panel-header"><h3><svg class="icon icon-md" style="color:var(--accent);"><use href="#ic-compare"/></svg> GPU 核心参数对比</h3><span style="font-size:12px;color:var(--text3);">'+gpus.length+' 款 GPU</span></div>';

  html+='<div class="config-row"><span style="color:var(--text2);font-weight:600;display:flex;align-items:center;gap:4px;"><svg class="icon icon-sm"><use href="#ic-settings"/></svg> 服务器参数：</span>';
  html+='<label>每机GPU <input type="number" value="'+serverConfig.gpusPerServer+'" onchange="updateServerConfig(\'gpusPerServer\',parseInt(this.value))"></label>';
  html+='<label>高度(U) <input type="number" value="'+serverConfig.heightU+'" onchange="updateServerConfig(\'heightU\',parseInt(this.value))"></label>';
  html+='<label>功率冗余 <input type="number" value="'+(serverConfig.powerOverhead*100-100).toFixed(0)+'" onchange="updateServerConfig(\'powerOverhead\',1+parseFloat(this.value)/100)">%</label>';
  html+='</div>';

  html+='<div class="cmp-grid"><div class="cmp-row" style="grid-template-columns:140px repeat('+gpus.length+', 1fr);"><div class="cmp-cell header">参数</div>';
  gpus.forEach(function(g){html+='<div class="cmp-cell header" style="font-size:13px;color:var(--text);">'+g.vendor+' '+g.name+'</div>';});html+='</div>';

  specs.forEach(function(spec){html+='<div class="cmp-row" style="grid-template-columns:140px repeat('+gpus.length+', 1fr);"><div class="cmp-cell header">'+spec.label+'</div>';var bestIdx=-1;
    if(spec.key==='tdp'){var vals=gpus.map(function(g){return parseFloat(g.tdp)||Infinity;});bestIdx=vals.indexOf(Math.min.apply(null,vals));}
    else if(spec.key==='bandwidth'){var vals=gpus.map(function(g){var m=g.bandwidth.match(/([\d.]+)(TB|GB)/);return m?(m[2]==='TB'?m[1]*1000:parseFloat(m[1])):0;});bestIdx=vals.indexOf(Math.max.apply(null,vals));}
    gpus.forEach(function(g,i){var cls=i===bestIdx&&bestIdx>=0&&gpus.length>1?' cmp-cell best':'cmp-cell';var display=spec.key==='fp16'?g[spec.key].replace(/\n/g,'<br>'):g[spec.key];html+='<div class="'+cls+'" style="font-size:11px;">'+display+'</div>';});html+='</div>';});
  serverSpecs.forEach(function(spec){html+='<div class="cmp-row" style="grid-template-columns:140px repeat('+gpus.length+', 1fr);"><div class="cmp-cell header">'+spec.label+'</div>';gpus.forEach(function(g){html+='<div class="cmp-cell" style="font-size:12px;color:var(--warn);">'+spec.fn(g)+'</div>';});html+='</div>';});
  html+='</div></div>';
  document.getElementById('cmpPanelContainer').innerHTML=html;
}

function computePerfEst(g){var fp16=g.fp16;if(fp16.indexOf('P*')>-1||fp16.indexOf('1/2P')>-1)return '>1P FLOPS ('+serverConfig.gpusPerServer+'卡)';var match=fp16.match(/FP16[：:]\s*([\d.]+)T/);if(match){var totalT=parseFloat(match[1])*serverConfig.gpusPerServer;return totalT>=1000?(totalT/1000).toFixed(1)+'P FLOPS':totalT.toFixed(0)+'T FLOPS';}return '—';}
function computeMachinesNeeded(g){var fp16=g.fp16;if(fp16.indexOf('P*')>-1||fp16.indexOf('1/2P')>-1)return '约 1 台';var match=fp16.match(/FP16[：:]\s*([\d.]+)T/);if(match){var totalT=parseFloat(match[1])*serverConfig.gpusPerServer;if(totalT>0)return '约 '+Math.ceil(1000/totalT)+' 台';}return '数据不足';}
function updateServerConfig(key,value){if(isNaN(value)||value<=0)return;serverConfig[key]=value;if(compareList.length>=2)renderComparePanel();}

// ==================== 详情弹窗 ====================
function showDetail(id){
  var g=gpuData.find(function(d){return d.id===id;});if(!g)return;
  var vendorTag=g.vendor==='NVIDIA'?'<span class="tag tag-nvidia">NVIDIA</span>':'<span class="tag tag-china">'+g.vendor+'</span>';
  var inCmp=compareList.includes(id);
  var html='<div class="modal-overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><h2>'+g.name+' '+vendorTag+'</h2><div style="display:flex;gap:6px;"><button class="btn btn-outline btn-sm" onclick="requirePassword(function(){toggleCompare('+id+');renderModalDetail('+id+');})">'+(inCmp?'<svg class="icon icon-sm"><use href=\'#ic-x\'/></svg> 移出对比':'<svg class="icon icon-sm"><use href=\'#ic-plus\'/></svg> 加入对比')+'</button><button class="btn btn-danger btn-sm" onclick="requirePassword(function(){deleteGPU('+id+');})"><svg class="icon icon-sm"><use href=\'#ic-trash\'/></svg></button><button class="modal-close" onclick="closeModal()"><svg class="icon icon-sm"><use href=\'#ic-x\'/></svg></button></div></div><div class="modal-body" id="modalBody">'+renderDetailContent(g)+'</div></div></div>';
  document.getElementById('modalContainer').innerHTML=html;
}

function renderDetailContent(g){
  var fields=[{label:'厂商',key:'vendor'},{label:'GPU 型号',key:'name'},{label:'产品架构',key:'arch'},{label:'产品类型',key:'type'},{label:'显存',key:'vram'},{label:'显存带宽',key:'bandwidth'},{label:'GPU 互联',key:'interconnect'},{label:'TDP',key:'tdp'},{label:'分类',key:'category',select:true},{label:'单卡算力 (FP16)',key:'fp16',full:true}];
  var categoryOptions = getUniqueValues('category');

  // Section 1 — GPU 规格
  var html='<div class="detail-section"><div class="detail-section-title">GPU 规格参数</div><div class="spec-grid">';
  fields.forEach(function(f){
    var cls=f.full?'spec-item full':'spec-item';
    if(editMode){
      html+='<div class="'+cls+'"><label>'+f.label+'</label>';
      if(f.select){
        html+='<select onchange="updateGPU('+g.id+',\''+f.key+'\',this.value)">';
        categoryOptions.forEach(function(c){ html+='<option value="'+c+'"'+(g[f.key]===c?' selected':'')+'>'+c+'</option>'; });
        html+='</select>';
      } else if(f.key==='fp16'){html+='<textarea onchange="updateGPU('+g.id+',\''+f.key+'\',this.value)">'+g[f.key]+'</textarea>';}
      else{html+='<input type="text" value="'+escapeHtml(g[f.key])+'" onchange="updateGPU('+g.id+',\''+f.key+'\',this.value)">';}
      html+='</div>';
    } else {
      html+='<div class="'+cls+'"><label>'+f.label+'</label><div class="value'+(f.key==='fp16'?' fp16-value':'')+'">'+g[f.key]+'</div></div>';
    }
  });
  html+='</div></div>';

  // Section 2 — 服务器估算
  var tdpW=parseFloat(g.tdp);
  if(!isNaN(tdpW)){
    html+='<div class="detail-section"><div class="detail-section-title">服务器估算（'+serverConfig.gpusPerServer+'卡 / '+serverConfig.heightU+'U / '+(serverConfig.powerOverhead*100-100).toFixed(0)+'%冗余）</div><div class="spec-grid">';
    html+='<div class="spec-item"><label>总 TDP</label><div class="value" style="color:var(--warn);">'+(tdpW*serverConfig.gpusPerServer*serverConfig.powerOverhead/1000).toFixed(1)+' kW</div></div>';
    html+='<div class="spec-item"><label>总算力 (FP16)</label><div class="value" style="color:var(--success);">'+computePerfEst(g)+'</div></div>';
    html+='<div class="spec-item"><label>千P算力需求</label><div class="value">'+computeMachinesNeeded(g)+'</div></div>';
    html+='<div class="spec-item"><label>单台高度</label><div class="value">'+serverConfig.heightU+'U</div></div>';
    html+='</div></div>';
  }

  // Section 3 — 备注
  html+='<div class="detail-section"><div class="detail-section-title">备注</div>';
  if(editMode){
    html+='<textarea onchange="updateGPU('+g.id+',\'notes\',this.value)" placeholder="添加备注信息..." style="width:100%;min-height:60px;resize:vertical;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:var(--text-sm);font-family:inherit;outline:none;">'+(g.notes||'')+'</textarea>';
  } else {
    html+='<div style="font-size:var(--text-sm);white-space:pre-wrap;line-height:1.6;'+(g.notes?'':'color:var(--text3);')+'">'+(g.notes||'无')+'</div>';
  }
  html+='</div>';

  return html;
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderModalDetail(id){var g=gpuData.find(function(d){return d.id===id;});if(!g)return;document.getElementById('modalBody').innerHTML=renderDetailContent(g);}

async function updateGPU(id,key,value){
  requirePassword(function(){
    var g=gpuData.find(function(d){return d.id===id;});
    if(g){g[key]=value;saveGPUToSupabase(id,{[key]:value}).then(function(ok){if(ok)showToast('已更新 '+g.name+' 的 '+key);});renderModalDetail(id);refreshUI();updateCompareBar();}
  });
}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}

function showAddGPUModal(){
  var html='<div class="modal-overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()" style="max-width:520px;">';

  html+='<div><label class="field-label">厂商</label><input type="text" id="addVendor" placeholder="例：NVIDIA、华为" class="field-input" onkeydown="if(event.key===\'Enter\')submitAddGPU()"></div>';
  html+='<div><label class="field-label">分类</label><select id="addCategory" class="field-select">';

  html+='<div><label class="field-label">产品类型</label><input type="text" id="addType" placeholder="例：SXM、PCIe" class="field-input" onkeydown="if(event.key===\'Enter\')submitAddGPU()"></div>';
  html+='</div></div>';
  html+='<div style="display:flex;gap:8px;margin-top:16px;"><button class="btn btn-outline" onclick="closeModal()" style="flex:1;">取消</button><button class="btn btn-primary" onclick="submitAddGPU()" style="flex:1;">确认添加</button></div>';
  html+='</div></div></div>';
  document.getElementById('modalContainer').innerHTML=html;

}

async function submitAddGPU(){
  var name=document.getElementById('addName').value.trim();
  if(!name){showToast('请输入 GPU 型号名称');return;}
  var vendor=document.getElementById('addVendor').value.trim();
  var category=document.getElementById('addCategory').value;
  var arch=document.getElementById('addArch').value.trim();
  var type=document.getElementById('addType').value.trim();
  var ng=await addGPUToSupabase({name:name,vendor:vendor||'',category:category,arch:arch,type:type,fp16:'—'});
  if(!ng){showToast('添加失败');return;}
  closeModal();refreshUI();showToast('已添加 '+name);
}

async function deleteGPU(id){
  var g=gpuData.find(function(d){return d.id===id;});if(!g)return;
  if(!confirm('确定删除 '+g.vendor+' '+g.name+' 吗？'))return;
  var cmpIdx=compareList.indexOf(id);if(cmpIdx>=0)compareList.splice(cmpIdx,1);
  await deleteGPUFromSupabase(id);closeModal();refreshUI();
  if(compareList.length>=2)renderComparePanel();else document.getElementById('cmpPanelContainer').innerHTML='';
  showToast('已删除 '+g.name);
}

// ==================== 编辑模式 ====================
function toggleEditMode(){
  editMode=!editMode;
  var btn=document.getElementById('editBtn'),indicator=document.getElementById('editIndicator');
  if(editMode){btn.innerHTML='<svg class="icon icon-sm"><use href="#ic-check"/></svg> 退出编辑';btn.className='btn btn-primary btn-sm';indicator.classList.add('on');}
  else{btn.innerHTML='<svg class="icon icon-sm"><use href="#ic-edit"/></svg> 编辑';btn.className='btn btn-outline btn-sm';indicator.classList.remove('on');}
  var modalBody=document.getElementById('modalBody');
  if(modalBody){var h2=document.querySelector('.modal-header h2');if(h2){var g=gpuData.find(function(d){return h2.textContent.indexOf(d.name)>-1;});if(g)renderModalDetail(g.id);}}
  showToast(editMode?'编辑模式已开启 — 可修改 GPU 数据':'编辑模式已关闭');
}

// ==================== Toast ====================
function showToast(msg,duration){var container=document.getElementById('toastContainer');var toast=document.createElement('div');toast.className='toast';toast.textContent=msg;container.appendChild(toast);setTimeout(function(){toast.remove();},duration||2000);}

// ==================== 导出 ====================
function exportJSON(){var blob=new Blob([JSON.stringify(gpuData,null,2)],{type:'application/json'});downloadBlob(blob,'gpu-server-data.json');showToast('已导出 JSON');}
function exportCSV(){var headers=['厂商','GPU型号','产品架构','产品类型','显存','显存带宽','GPU互联','TDP','单卡算力FP16'];var rows=gpuData.map(function(g){return [g.vendor,g.name,g.arch,g.type,g.vram,g.bandwidth,g.interconnect,g.tdp,g.fp16.replace(/\n/g,' | ')];});var csv=[headers.join(','),rows.map(function(r){return r.map(function(c){return '"'+c+'"';}).join(',');})].join('\n');var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});downloadBlob(blob,'gpu-server-data.csv');showToast('已导出 CSV');}
function downloadBlob(blob,filename){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}

async function resetData(){
  if(confirm('确定恢复为默认数据吗？所有修改将丢失。')){
    await resetSupabaseData();compareList=[];editMode=false;
    document.getElementById('editBtn').innerHTML='<svg class="icon icon-sm"><use href="#ic-edit"/></svg> 编辑';
    document.getElementById('editBtn').className='btn btn-outline btn-sm';
    document.getElementById('editIndicator').classList.remove('on');
    refreshUI();document.getElementById('cmpPanelContainer').innerHTML='';
    document.getElementById('searchInput').value='';
    columnFilters={};showToast('已恢复默认数据');
  }
}
</script>
