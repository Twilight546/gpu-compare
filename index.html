    } else if (API.isConfigured() && Store.get('pollingTimer')) {
      badge.className = 'live-badge';
      badge.title = '轮询模式';
    } else if (API.isConfigured()) {
      badge.className = 'live-badge';
      badge.title = '已连接';
    } else {
      badge.className = 'live-badge offline';
      badge.title = '未连接云端';
    }
  }

  // ---- Unlock button update ----
  function updateUnlockButton() {
    var btn = document.getElementById('unlock-btn');
    if (!btn) return;
    var isUnlocked = !!Store.get('userAccessToken');
    if (isUnlocked) {
      btn.innerHTML = icon('ic-lock', 'icon-sm') + ' 已解锁';
      btn.className = 'btn btn-primary btn-sm';
      btn.title = '编辑功能已解锁';
    } else {
      btn.innerHTML = icon('ic-lock', 'icon-sm') + ' 解锁编辑';
      btn.className = 'btn btn-outline btn-sm';
      btn.title = '输入编辑密码解锁';
    }
    var addBtn = document.getElementById('add-btn');
    var editBtn = document.getElementById('edit-btn');
    if (addBtn) addBtn.style.display = isUnlocked ? '' : 'none';
    if (editBtn) editBtn.style.display = isUnlocked ? '' : 'none';
  }

  function updateServerConfig(key, value) {
    if (isNaN(value) || value <= 0) return;
    Store.update('serverConfig', function (cfg) { cfg[key] = value; return cfg; });
    Store.notify();
  }

  function refresh() {
    var filtered = getFilteredData();
    renderTable(filtered);
    renderCards(filtered);
    renderSidebar();
    updateCompareBar();
    updateConnectionBadge();
    updateFilterButtonStates();
    updateUnlockButton();
    if (Store.get('compareList').length >= 2) renderComparePanel();
    else document.getElementById('cmp-panel-container').innerHTML = '';
    lockColWidths();
  }

  // Helper functions for modal detail
  function computePerfEst(g) {
    var fp16 = g.fp16;
    var serverConfig = Store.get('serverConfig');
    if (fp16.indexOf('P*') > -1 || fp16.indexOf('1/2P') > -1) return '>1P FLOPS (' + serverConfig.gpusPerServer + '卡)';
    var match = fp16.match(/FP16[：:]\s*([\d.]+)T/);
    if (match) {
      var totalT = parseFloat(match[1]) * serverConfig.gpusPerServer;
      return totalT >= 1000 ? (totalT / 1000).toFixed(1) + 'P FLOPS' : totalT.toFixed(0) + 'T FLOPS';
    }
    return '—';
  }

  function computeMachinesNeeded(g) {
    var fp16 = g.fp16;
    var serverConfig = Store.get('serverConfig');
    if (fp16.indexOf('P*') > -1 || fp16.indexOf('1/2P') > -1) return '约 1 台';
    var match = fp16.match(/FP16[：:]\s*([\d.]+)T/);
    if (match) {
      var totalT = parseFloat(match[1]) * serverConfig.gpusPerServer;
      if (totalT > 0) return '约 ' + Math.ceil(1000 / totalT) + ' 台';
    }
    return '数据不足';
  }

  return {
    escapeHtml, icon, getFilteredData, getUniqueValues,
    sortTable, lockColWidths, renderTable, renderCards,
    renderSidebar, updateCompareBar, renderComparePanel,
    toggleSidebar, toggleCompare, clearCompare,
    showDetail, renderModalDetail, closeModal,
    showSetupModal, showAddGPUModal, showPasswordModal, showChangePasswordModal,
    showToast, updateFilterButtonStates, formatFilterDisplay,
    toggleColFilter, renderColFilterDropdown, closeAllFilterDropdowns,
    updateConnectionBadge, updateUnlockButton, updateServerConfig,
    refresh, computePerfEst, computeMachinesNeeded
  };
})();

// ==================== App 模块（协调层 + 事件委托） ====================
const App = (() => {

  async function init() {
    Store.loadConfig();
    await API.loadAll();
    // 从 Supabase 读取编辑密码
    var pw = await API.fetchEditPassword();
    if (pw) Store.set('editPassword', pw);

    // Subscribe to Store changes for auto-refresh
    Store.subscribe(function () {
      UI.refresh();
    });

    // Initial render
    Store.notify();

    if (!API.isConfigured()) {
      document.getElementById('setup-banner').classList.add('show');
    }

    // Event delegation
    bindGlobalEvents();
    bindKeyboardShortcuts();

    // Search input
    document.getElementById('search-input').addEventListener('input', function () {
      var val = this.value.trim();
      if (val === '密码' && Store.get('userAccessToken')) {
        this.value = '';
        Store.notify();
        UI.showChangePasswordModal();
        return;
      }
      Store.notify();
    });

    // Scroll to top button
    var mainEl = document.querySelector('.main');
    mainEl.addEventListener('scroll', function () {
      document.getElementById('scroll-top-btn').classList.toggle('show', mainEl.scrollTop > 300);
    });
    window.addEventListener('scroll', function () {
      document.getElementById('scroll-top-btn').classList.toggle('show', window.scrollY > 300);
    });

    // Responsive sidebar
    window.matchMedia('(min-width: 1024px)').addEventListener('change', function () {
      if (window.matchMedia('(min-width: 1024px)').matches && Store.get('sidebarOpen')) {
        UI.toggleSidebar();
      }
    });

    // Setup banner click
    document.getElementById('setup-banner').addEventListener('click', function () {
      requirePassword(function () { UI.showSetupModal(); });
    });

    // Global click to close dropdowns
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.dropdown')) {
        document.getElementById('export-menu').classList.remove('show');
      }
      if (!e.target.closest('.col-filter-btn') && !e.target.closest('.col-filter-dropdown')) {
        UI.closeAllFilterDropdowns();
      }
    });

    // Scroll to close filter dropdowns
    document.addEventListener('scroll', function () {
      UI.closeAllFilterDropdowns();
    }, true);

    // 60s polling as fallback
    setInterval(async function () {
      if (!Store.get('realtimeChannel')) {
        await API.loadAll();
        Store.notify();
      }
    }, 60000);

    API.subscribeRealtime();

    // Cleanup on page leave
    window.addEventListener('beforeunload', function () {
      API.stopPolling();
    });
  }

  function bindGlobalEvents() {
    document.body.addEventListener('click', function (e) {
      var el = e.target.closest('[data-action]');
      if (!el) return;
      var action = el.dataset.action;
      var id = el.dataset.id ? parseInt(el.dataset.id) : null;
      var col = el.dataset.col;
      var val = el.dataset.val;
      var filterVal = el.dataset.filterVal;

      e.stopPropagation();

      switch (action) {
        case 'toggle-sidebar': UI.toggleSidebar(); break;
        case 'show-detail': if (id) UI.showDetail(id); break;
        case 'toggle-compare': if (id) UI.toggleCompare(id); break;
        case 'show-setup': requirePassword(function () { UI.showSetupModal(); }); break;
        case 'show-add-gpu': requirePassword(function () { UI.showAddGPUModal(); }); break;
        case 'toggle-edit': toggleEditMode(); break;
        case 'show-password': showPasswordPrompt(); break;
        case 'change-password': UI.showChangePasswordModal(); break;
        case 'submit-change-password': submitChangePassword(); break;
        case 'toggle-export-menu':
          document.getElementById('export-menu').classList.toggle('show');
          break;
        case 'export-json': exportJSON(); break;
        case 'export-csv': exportCSV(); break;
        case 'sync-cloud': syncFromSupabase(); break;
        case 'reset-data': requirePassword(resetData); break;
        case 'clear-compare': UI.clearCompare(); break;
        case 'scroll-top': window.scrollTo({ top: 0, behavior: 'smooth' }); break;
        case 'close-modal':
          // el is the closest element with data-action="close-modal"
          // Only close if: clicking the overlay itself, OR clicking a close button (not overlay)
          if (el.classList.contains('modal-overlay') && e.target !== el && !e.target.closest('.modal-close')) return;
          UI.closeModal();
          break;
        case 'delete-gpu': if (id) deleteGPU(id); break;
        case 'save-config': saveConfig(); break;
        case 'submit-add-gpu': submitAddGPU(); break;
        case 'verify-password': verifyPassword(); break;
        case 'unlock-screen': unlockScreen(); break;
        case 'sort-table': if (col) UI.sortTable(col); break;
        case 'toggle-col-filter': if (col) UI.toggleColFilter(col); break;
        case 'filter-all': clearAllFilters(); break;
        case 'filter-vendor':
          if (filterVal) { Store.set('columnFilters', { vendor: filterVal }); Store.notify(); }
          break;
        case 'filter-category':
          if (filterVal) {
            Store.update('columnFilters', function (f) { f.category = filterVal; return f; });
            Store.notify();
          }
          break;
        case 'scroll-compare':
          var panel = document.getElementById('cmp-panel-container');
          if (panel) panel.scrollIntoView({ behavior: 'smooth' });
          break;
        case 'focus-search': document.getElementById('search-input').focus(); break;
        case 'apply-col-filter':
          if (col && val) applyColFilter(col, val);
          break;
        case 'apply-text-filter':
          if (col) {
            var inp = document.getElementById('filter-input-' + col);
            applyColFilter(col, inp ? inp.value : '');
          }
          break;
        case 'apply-range-filter':
          if (col) applyColFilterRange(col);
          break;
        case 'clear-col-filter':
          if (col) clearColFilter(col);
          break;
      }
    });
  }

  function bindKeyboardShortcuts() {
    document.addEventListener('keydown', function (e) {
      // Ctrl+K / Cmd+K: focus search
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
      // Escape: close modals and dropdowns
      if (e.key === 'Escape') {
        UI.closeModal();
        UI.closeAllFilterDropdowns();
        document.getElementById('export-menu').classList.remove('show');
      }
    });
  }

  // ---- Password helpers ----
  function requirePassword(callback) {
    if (Store.get('userAccessToken')) {
      callback();
      return;
    }
    UI.showPasswordModal(callback);
  }
  window.requirePassword = requirePassword;

  function showPasswordPrompt() {
    if (Store.get('userAccessToken')) {
      // Already unlocked — lock it
      Store.set('userAccessToken', null);
      Store.notify();
      UI.showToast('已锁定');
    } else {
      UI.showPasswordModal(function () {
        Store.notify();
        UI.showToast('可以修改数据了');
      });
    }
  }

  function verifyPassword() {
    var input = document.getElementById('edit-password-input');
    var password = input ? input.value : '';
    var correctPw = Store.get('editPassword');
    if (!password) {
      showPasswordError('请输入密码');
      return;
    }
    if (password === correctPw) {
      Store.set('userAccessToken', password);
      UI.closeModal();
      Store.notify();
      UI.showToast('密码正确，已解锁编辑');
      var cb = window.__pwCallback;
      window.__pwCallback = null;
      setTimeout(function () { if (cb) cb(); }, 300);
    } else {
      showPasswordError('密码错误，请重试');
    }
  }

  async function submitChangePassword() {
    var input = document.getElementById('new-password-input');
    var newPw = input ? input.value.trim() : '';
    if (newPw.length < 4) {
      var err = document.getElementById('chpw-error-msg');
      if (err) { err.textContent = '密码至少4位'; err.classList.add('show'); }
      return;
    }
    if (!API.isConfigured()) {
      UI.showToast('请先配置 Supabase 连接');
      return;
    }
    var ok = await API.setEditPassword(newPw);
    if (ok) {
      Store.set('editPassword', newPw);
      Store.set('userAccessToken', newPw);
      UI.closeModal();
      UI.showToast('密码已修改');
      Store.notify();
    } else {
      var err = document.getElementById('chpw-error-msg');
      if (err) { err.textContent = '修改失败，请检查网络'; err.classList.add('show'); }
    }
  }

  function unlockScreen() {
    var input = document.getElementById('lock-input');
    var password = input ? input.value : '';
    var correctPw = Store.get('editPassword');
    if (!password) {
      var err = document.getElementById('lock-error');
      if (err) { err.textContent = '请输入密码'; err.classList.add('show'); }
      return;
    }
    if (password === correctPw) {
      Store.set('userAccessToken', password);
      document.getElementById('lock-screen').classList.add('hidden');
      Store.notify();
      UI.showToast('密码正确');
    } else {
      var err = document.getElementById('lock-error');
      if (err) { err.textContent = '密码错误，请重试'; err.classList.add('show');
        setTimeout(function () { err.classList.remove('show'); }, 3000); }
    }
  }

  function showPasswordError(msg) {
    var err = document.getElementById('pw-error-msg');
    if (err) { err.textContent = msg; err.classList.add('show'); }
    setTimeout(function () {
      var e = document.getElementById('pw-error-msg');
      if (e) e.classList.remove('show');
    }, 3000);
  }

  // ---- Config ----
  async function saveConfig() {
    var url = document.getElementById('setup-url').value.trim();
    var key = document.getElementById('setup-key').value.trim();
    Store.set('supabaseConfig', { url: url, anonKey: key });
    Store.saveConfig();
    Store.set('supabaseClient', null);
    Store.set('realtimeChannel', null);
    API.stopPolling();
    UI.closeModal();
    await API.loadAll();
    Store.notify();
    if (API.isConfigured()) {
      document.getElementById('setup-banner').classList.remove('show');
      API.subscribeRealtime();
      UI.showToast('已连接云端 (' + Store.get('gpuData').length + ' 条数据)');
    }
  }

  // ---- Filters ----
  function applyColFilter(col, val) {
    if (!val) { clearColFilter(col); return; }
    Store.update('columnFilters', function (f) { f[col] = val; return f; });
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  function applyColFilterRange(col) {
    var minEl = document.getElementById('tdp-min');
    var maxEl = document.getElementById('tdp-max');
    var minV = minEl ? parseFloat(minEl.value) : NaN;
    var maxV = maxEl ? parseFloat(maxEl.value) : NaN;
    if (isNaN(minV) && isNaN(maxV)) { clearColFilter(col); return; }
    Store.update('columnFilters', function (f) {
      f[col] = { min: isNaN(minV) ? null : minV, max: isNaN(maxV) ? null : maxV };
      return f;
    });
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  function clearColFilter(col) {
    Store.update('columnFilters', function (f) { delete f[col]; return f; });
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  function clearAllFilters() {
    Store.set('columnFilters', {});
    document.getElementById('search-input').value = '';
    UI.closeAllFilterDropdowns();
    Store.notify();
  }

  // ---- Edit mode ----
  function toggleEditMode() {
    Store.update('editMode', function (v) { return !v; });
    var editMode = Store.get('editMode');
    var btn = document.getElementById('edit-btn');
    var indicator = document.getElementById('edit-indicator');
    if (editMode) {
      btn.innerHTML = UI.icon('ic-check', 'icon-sm') + ' 退出编辑';
      btn.className = 'btn btn-primary btn-sm';
      indicator.classList.add('on');
    } else {
      btn.innerHTML = UI.icon('ic-edit', 'icon-sm') + ' 编辑';
      btn.className = 'btn btn-outline btn-sm';
      indicator.classList.remove('on');
    }
    Store.notify();
    UI.showToast(editMode ? '编辑模式已开启 — 可修改 GPU 数据' : '编辑模式已关闭');
  }

  // ---- GPU operations ----
  async function updateGPU(id, key, value) {
    var g = Store.get('gpuData').find(function (d) { return d.id === id; });
    if (g) {
      g[key] = value;
      await API.saveOne(id, { [key]: value }).then(function (ok) {
        if (ok) UI.showToast('已更新 ' + g.name + ' 的 ' + key);
      });
      UI.renderModalDetail(id);
      Store.notify();
    }
  }

  async function submitAddGPU() {
    var name = document.getElementById('add-name').value.trim();
    if (!name) { UI.showToast('请输入 GPU 型号名称'); return; }
    var vendor = document.getElementById('add-vendor').value.trim();
    var category = document.getElementById('add-category').value;
    var arch = document.getElementById('add-arch').value.trim();
    var type = document.getElementById('add-type').value.trim();
    var ng = await API.addOne({ name: name, vendor: vendor || '', category: category, arch: arch, type: type, fp16: '—' });
    if (!ng) { UI.showToast('添加失败'); return; }
    UI.closeModal();
    Store.notify();
    UI.showToast('已添加 ' + name);
  }

  async function deleteGPU(id) {
    var g = Store.get('gpuData').find(function (d) { return d.id === id; });
    if (!g) return;
    if (!confirm('确定删除 ' + g.vendor + ' ' + g.name + ' 吗？')) return;
    Store.update('compareList', function (list) {
      var idx = list.indexOf(id);
      if (idx >= 0) list.splice(idx, 1);
      return list;
    });
    await API.deleteOne(id);
    UI.closeModal();
    Store.notify();
    UI.showToast('已删除 ' + g.name);
  }

  // ---- Export ----
  function exportJSON() {
    var blob = new Blob([JSON.stringify(Store.get('gpuData'), null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'gpu-server-data.json');
    UI.showToast('已导出 JSON');
  }

  function exportCSV() {
    var headers = ['厂商', 'GPU型号', '产品架构', '产品类型', '显存', '显存带宽', 'GPU互联', 'TDP', '单卡算力FP16'];
    var rows = Store.get('gpuData').map(function (g) {
      return [g.vendor, g.name, g.arch, g.type, g.vram, g.bandwidth, g.interconnect, g.tdp, g.fp16.replace(/\n/g, ' | ')];
    });
    var csv = [headers.join(','), rows.map(function (r) { return r.map(function (c) { return '"' + c + '"'; }).join(','); })].join('\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, 'gpu-server-data.csv');
    UI.showToast('已导出 CSV');
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function syncFromSupabase() {
    if (!API.isConfigured()) { UI.showToast('请先配置 Supabase 连接'); return; }
    await API.loadAll();
    Store.notify();
    UI.showToast('已从云端刷新 (' + Store.get('gpuData').length + ' 条)');
  }

  async function resetData() {
    if (confirm('确定恢复为默认数据吗？所有修改将丢失。')) {
      await API.resetAll();
      Store.set('compareList', []);
      Store.set('editMode', false);
      Store.set('columnFilters', {});
      document.getElementById('search-input').value = '';
      Store.notify();
      UI.showToast('已恢复默认数据');
    }
  }

  function updateServerConfig(key, value) {
    if (isNaN(value) || value <= 0) return;
    Store.update('serverConfig', function (cfg) { cfg[key] = value; return cfg; });
    Store.notify();
  }

  return {
    init, verifyPassword, showPasswordPrompt, unlockScreen, submitChangePassword,
    applyColFilter, applyColFilterRange, clearColFilter, clearAllFilters,
    toggleEditMode, updateGPU, submitAddGPU, deleteGPU,
    updateServerConfig
  };
})();

window.addEventListener('DOMContentLoaded', function () { App.init(); });

/*
-- Supabase SQL 初始化脚本（在 Supabase Dashboard → SQL Editor 中执行） --

-- 1. 创建 gpus 表
CREATE TABLE IF NOT EXISTS public.gpus (
  id INTEGER PRIMARY KEY,
  vendor TEXT DEFAULT '',
  name TEXT DEFAULT '',
  arch TEXT DEFAULT '',
  type TEXT DEFAULT '',
  vram TEXT DEFAULT '—',
  bandwidth TEXT DEFAULT '—',
  interconnect TEXT DEFAULT '—',
  tdp TEXT DEFAULT '—',
  fp16 TEXT DEFAULT '—',
  notes TEXT DEFAULT '',
  category TEXT DEFAULT 'nvidia',
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. 创建 settings 表（存储编辑密码）
CREATE TABLE IF NOT EXISTS public.settings (
  id SERIAL PRIMARY KEY,
  key TEXT UNIQUE NOT NULL,
  value TEXT DEFAULT ''
);

-- 3. 设置默认编辑密码（请修改为你的密码）
INSERT INTO public.settings (key, value) VALUES ('edit_password', 'admin123')
ON CONFLICT (key) DO NOTHING;

-- 4. 开启 RLS
ALTER TABLE public.gpus ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.settings ENABLE ROW LEVEL SECURITY;

-- 5. 公开读取（所有人可查看 gpus 和 settings）
CREATE POLICY "public_read_gpus" ON public.gpus FOR SELECT USING (true);
CREATE POLICY "public_read_settings" ON public.settings FOR SELECT USING (true);

-- 6. 使用 anon key 即可写入（通过 REST API）
CREATE POLICY "public_insert_gpus" ON public.gpus FOR INSERT WITH CHECK (true);
CREATE POLICY "public_update_gpus" ON public.gpus FOR UPDATE USING (true);
CREATE POLICY "public_delete_gpus" ON public.gpus FOR DELETE USING (true);

-- 7. 开启 Realtime（如已开启则会跳过）
DO $$
BEGIN
  ALTER PUBLICATION supabase_realtime ADD TABLE public.gpus;
EXCEPTION WHEN duplicate_object THEN
  RAISE NOTICE 'gpus 表已在 Realtime 中，跳过';
END $$;
*/
</script>
</body>
